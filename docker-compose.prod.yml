name: arenda-prod

x-env-file: &prod-env-file
  - path: .env.prod
    required: true

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=0
    logging: *default-logging
    env_file: *prod-env-file
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - arenda-prod

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.00
    logging: *default-logging
    env_file: *prod-env-file
    environment:
      AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - arenda-prod
      # Observability: reach uptrace:14317 (OTLP/gRPC); the network is created by the devnumbers/observability stack in /opt/observability.
      - observability

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    logging: *default-logging
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:13000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - arenda-prod

  landing:
    image: ${LANDING_IMAGE}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    ports:
      - "127.0.0.1:13002:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - arenda-prod

  admin:
    image: ${ADMIN_IMAGE}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:13001:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - arenda-prod

  migrate:
    image: ${BACKEND_IMAGE}
    profiles: ["migrate"]
    command: ["./arenda-api", "migrate"]
    env_file: *prod-env-file
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks:
      - arenda-prod

networks:
  arenda-prod:
    name: arenda-prod
  # Created by the devnumbers/observability stack in /opt/observability; start that stack first.
  observability:
    external: true
    name: observability

volumes:
  postgres-data:
