<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Нет соединения — Рентли</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #1e1e1e;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Колонка макета Figma 2353:50704: центрированный блок, зазоры 32/8.
       400px — ширина карточки канона Modal, чтобы кнопки не расползались
       на всю ширину десктопа. */
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 400px;
    }

    /* Лого — вектор HeaderLogo (shared/assets/icons/rently-logo.svg),
       заинлайнен: страница отдаётся из кэша SW при выключенной сети и
       должна работать с нулём сетевых запросов. */
    .logo {
      width: 112px;
      height: 28px;
      flex-shrink: 0;
    }

    .text-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title {
      margin: 0;
      font-size: 28px;
      line-height: 32px;
      font-weight: 600;
    }

    .subtitle {
      margin: 0;
      font-size: 16px;
      line-height: 18px;
      font-weight: 400;
      color: #6f787c;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    /* Канон Button default (Figma 939:46118): 56px, паддинг 24, кегль
       R/500 16/18, радиус 16; Primary/Secondary с шагами hover/active
       из токенов дизайн-слоя. */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 56px;
      padding: 0 24px;
      border: 0;
      border-radius: 16px;
      font-family: inherit;
      font-size: 16px;
      line-height: 18px;
      font-weight: 500;
      cursor: pointer;
      /* Ссылка-кнопка (Telegram) без браузерного подчёркивания — как
         buttonVariants канона. */
      text-decoration: none;
      transition: background-color 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 6px #2b7fff;
    }

    .btn-primary {
      background: #2b7fff;
      color: #ffffff;
    }

    /* Touch-safe hover (DESIGN.md §8): hover-шаги только для устройств
       с курсором, на таче залипшей заливки нет. */
    @media (hover: hover) {
      .btn-primary:hover {
        background: #2175f5;
      }

      .btn-secondary:hover {
        background: #e9eaec;
      }
    }

    .btn-primary:active {
      background: #176beb;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #171a1c;
    }

    .btn-secondary:active {
      background: #dfe0e2;
    }
  </style>
</head>

    <div class="text-group">
      <h1 class="title">Нет соединения</h1>
      <p class="subtitle">Проверьте подключение к интернету и попробуйте снова</p>
    </div>

    <div class="buttons">
      <button type="button" id="reload-button" class="btn btn-primary">Обновить страницу</button>
      <a id="support-telegram" class="btn btn-secondary" href="https://t.me/swirnowwwivan" target="_blank" rel="noopener noreferrer">Обратиться в поддержку</a>
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      // Ссылка поддержки — shared/config/support.ts; страница самодостаточна
      // и не может импортировать TS, адрес продублирован вручную, синхронность
      // сторожит shared/config/support.test.ts (решение владельца 21.09:
      // «на тг ссылку просто» — без блока копирования, канон #766 тут не
      // воспроизводится).

      var reloadButton = document.getElementById('reload-button');

      reloadButton.addEventListener('click', function () {
        location.reload();
      });
    })();
  </script>
