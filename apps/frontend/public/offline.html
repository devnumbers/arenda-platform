<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Нет соединения — Рентли</title>
  <style>
    /* Макет «Рентли» Figma 40000051:81613 (27.10.2026). Геометрия колонки —
       канон сервиса (решение владельца 27.10: max-width 560 = --container-column,
       паддинги 24 вместо 32 макета). Root-колонка макета держит трёх детей —
       лого / блок «иллюстрация + текст» / кнопки — и space-between разводит
       их: лого вверху, кнопки прижаты к низу, середина висит в центре
       освободившегося пространства. */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* Onest — фирменный шрифт (решение владельца 27.10: не системный стек).
       @font-face продублирован из app/globals.css: страница отдаётся из кэша SW
       офлайн и не может импортировать CSS-бандл. Два сабсета — латиница («VPN»)
       и кириллица (весь русский текст) — те же, что прелоадит app/layout.tsx;
       сами файлы прекэшит public/sw.js (OFFLINE_FONT_PATHS): /fonts отдаётся с
       max-age=0/must-revalidate, офлайн перевалидация умирает. Синхронность
       трёх файлов сторожит shared/lib/pwa/offline-fonts.test.ts. */
    @font-face {
      font-family: 'Onest';
      src: url('/fonts/onest-cyrillic.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: 'Onest';
      src: url('/fonts/onest-latin.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #1e1e1e;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      /* dvh — видимая высота без адресной строки мобильного браузера:
         100vh включает её, и нижний блок уезжает за пределы экрана. */
      min-height: 100vh;
      min-height: 100dvh;
      padding: 32px;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }

    /* Лого — вектор HeaderLogo (shared/assets/icons/rently-logo.svg),
       заинлайнен: страница должна работать с нулём сетевых запросов. */
    .logo {
      display: block;
      width: 112px;
      height: 28px;
      flex-shrink: 0;
    }

    /* Средний блок макета (кадр 40000052:81661): иллюстрация → текст,
       зазор 24. */
    .content {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Иллюстрация «нет интернета» — байт-копия
       shared/assets/icons/no-internet.svg (Figma 40000051:81652), вне бареля
       иконок: потребитель один — эта страница. Декоративная: смысл несёт
       заголовок. */
    .illustration {
      display: block;
      width: 96px;
      height: 96px;
    }

    .text-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title {
      margin: 0;
      font-size: 32px;
      line-height: 36px;
      font-weight: 600;
    }

    .paragraphs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .paragraphs p {
      margin: 0;
      font-size: 16px;
      line-height: 20px;
      font-weight: 400;
      color: #6f787c;
    }

    /* Кнопки в ряд, поровну (макет 40000053:81673): «Поддержка» слева,
       «Обновить» справа. */
    .buttons {
      display: flex;
      gap: 8px;
    }

    /* Канон Button default (Figma 939:46118): 56px, паддинг 24, кегль
       R/500 16/18, радиус 16; Primary/Secondary с шагами hover/active
       из токенов дизайн-слоя. */
    .btn {
      display: flex;
      flex: 1 1 0;
      min-width: 0;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 56px;
      padding: 0 24px;
      border: 0;
      border-radius: 16px;
      font-family: inherit;
      font-size: 16px;
      line-height: 18px;
      font-weight: 500;
      cursor: pointer;
      /* Ссылка-кнопка (Telegram) без браузерного подчёркивания — как
         buttonVariants канона. */
      text-decoration: none;
      transition: background-color 0.25s cubic-bezier(0.32, 0.72, 0, 1);
      -webkit-tap-highlight-color: transparent;
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 6px #2b7fff;
    }

    .btn-primary {
      background: #2b7fff;
      color: #ffffff;
    }

    /* Touch-safe hover (DESIGN.md §8): hover-шаги только для устройств
       с курсором, на таче залипшей заливки нет. */
    @media (hover: hover) {
      .btn-primary:hover {
        background: #2175f5;
      }

      .btn-secondary:hover {
        background: #e9eaec;
      }
    }

    .btn-primary:active {
      background: #176beb;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #171a1c;
    }

    .btn-secondary:active {
      background: #dfe0e2;
    }

    /* На минимальной ширине поддержки (320, ярусы globals.css) ряд из двух
       кнопок канона с боковым паддингом 24 физически не помещается
       («Поддержка» не влезает в половину колонки) — ниже 360 паддинг
       сжимается до 16, композиция макета (ряд поровну) сохраняется. */
    @media (max-width: 359px) {
      .btn {
        padding: 0 16px;
      }
    }
  </style>
