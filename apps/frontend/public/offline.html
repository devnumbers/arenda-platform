<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Нет соединения — Рентли</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #1e1e1e;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Brand mark — glass house icon, same source as the PWA icon. */
    .icon {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      flex-shrink: 0;
      /* Subtle depth to match the glass aesthetic. */
      filter: drop-shadow(0 4px 12px rgba(43, 127, 255, 0.18));
    }

    /* Wordmark — Rentle title (house glyph + word), sits below the mark. */
    .title-img {
      width: 130px;
      height: auto;
      margin-bottom: 32px;
      flex-shrink: 0;
    }

    .title {
      margin: 0 0 8px;
      font-size: 1.25rem;
      line-height: 1.5rem;
      font-weight: 700;
    }

    .text {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.4rem;
      color: rgba(30, 30, 30, 0.6);
      max-width: 320px;
    }
  </style>
</head>
<body>
  <img class="icon" src="/images/boot-icon.png" alt="" />
  <img class="title-img" src="/images/rentle-title.svg" alt="Rentle" />
  <h1 class="title">Нет соединения</h1>
  <p class="text">Проверьте подключение к интернету и попробуйте снова.</p>
</body>
</html>
