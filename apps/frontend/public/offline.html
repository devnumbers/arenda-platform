<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Нет соединения — Рентли</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #1e1e1e;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .title {
      margin: 0 0 8px;
      font-size: 1.25rem;
      line-height: 1.5rem;
      font-weight: 700;
    }

    .text {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.4rem;
      color: rgba(30, 30, 30, 0.6);
      max-width: 320px;
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M29.6209 1.14286H42.6411L27.8306 24L42.6411 46.8571H29.6209L21.3205 34.0471L13.0202 46.8571H0L14.8105 24L0 1.14286H13.0202L21.3205 13.9529L29.6209 1.14286Z" fill="#2B7FFF"/>
  </svg>
  <h1 class="title">Нет соединения</h1>
  <p class="text">Проверьте подключение к интернету и попробуйте снова.</p>
</body>
</html>
