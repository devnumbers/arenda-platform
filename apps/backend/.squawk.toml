# Squawk — линтер lock-safety PostgreSQL-миграций (волна 3, #309; решение #295;
# registry: docs/agents/tooling.md). Запуск: make migrations-lint — pre-commit
# по staged-миграциям, pre-push и CI полным прогоном.
# Доменные правила, которых у Squawk нет (деньги-BIGINT, запрет DEFAULT на id), —
# рядом, в tools/migration-lint/domain-rules.mjs.

# golang-migrate выполняет файл миграции одной транзакцией (pgx): CREATE/DROP
# INDEX CONCURRENTLY невозможны, а неудачный файл откатывается целиком и
# переисполняется с чистого листа (правило prefer-robust-stmts гасится этим
# же флагом автоматически).
assume_in_transaction = true

# Миграции исполняются на PostgreSQL 18 (docker-compose, testcontainers, прод).
pg_version = "18"

excluded_paths = [
  # Down-миграции — намеренные инверсии уже проверенных up-файлов (drop, откат
  # типа, возврат DEFAULT); линтится только прямая эволюция схемы.
  "*.down.sql",
  # Исторические up-миграции, применённые до введения линта (осознанные решения
  # своего времени): точечные исключения с причинами, baseline-файл не вводится.
  "*000007_user_recurring_operations.up.sql",        # ban-drop-not-null
  "*000011_add_sending_status.up.sql",               # require-enum-value-ordering: значение вставлено не в конец
  "*000012_sent_sms_reminder_unique.up.sql",         # disallowed-unique-constraint: partial unique с NULL-семантикой
  "*000016_drop_reminders_event_date.up.sql",        # ban-drop-column: осознанный drop
  "*000022_tariff_prices_kopecks.up.sql",            # renaming-column + changing-column-type: миграция копеек (ADR 0008), NUMERIC → BIGINT
  "*000023_subscription_lifecycle.up.sql",           # adding-foreign-key-constraint + changing-column-type (ADR 0008)
  "*000024_payment_methods.up.sql",                  # adding-foreign-key-constraint: FK без NOT VALID
  "*000035_session_sliding_expiration.up.sql",       # adding-not-nullable-field: бэкфилл в той же транзакции
  "*000037_add_operation_overdue_event.up.sql",      # require-enum-value-ordering
  "*000045_add_sms_code_purpose.up.sql",             # prefer-text-field: VARCHAR-код
  "*000046_add_login_attempts_user_id.up.sql",       # adding-foreign-key-constraint: FK без NOT VALID
  "*000055_login_codes.up.sql",                      # prefer-text-field: VARCHAR-код
  "*000064_drop_sms_codes.up.sql",                   # ban-drop-table: осознанный drop
  "*000077_migrate_operation_category.up.sql",       # FK + not-null-бэкфилл + drop колонок: дата-миграция
  "*000081_notification_status_skipped.up.sql",      # require-enum-value-ordering
  "*000086_property_deletion_detach.up.sql",         # FK + ban-drop-not-null: семантика удаления свойства
  "*000089_free_reminder_enums.up.sql",              # require-enum-value-ordering
  "*000091_reminders_free_reminder_fk.up.sql",       # adding-foreign-key-constraint
  "*000096_sent_email_reminders_per_recipient.up.sql", # disallowed-unique-constraint
  "*000102_drop_legacy_notification_preferences.up.sql", # ban-drop-table: осознанный drop
  "*000104_billing_core_rewrite.up.sql",             # ban-drop-table ×4: переписывание billing (ADR 0037)
  "*000105_grace_notifications.up.sql",              # require-enum-value-ordering
  "*000108_drop_free_reminders.up.sql",              # ban-drop-column + ban-drop-table: осознанный drop (спека #380, решение #277)
  # Новые миграции ниже — не «исторические»: осознанные решения текущей
  # конвенции. NOT VALID + VALIDATE отклонён (#295: одна транзакция на файл,
  # таблицы малы); операционный риск очереди блокировок гасят SET-таймауты
  # в начале файла.
  "*000111_property_contacts_owner_fk.up.sql",       # adding-foreign-key-constraint: FK без NOT VALID (тикет #351, решение #324)
  "*000112_drop_sent_sms_reminders.up.sql",          # ban-drop-table: осознанный drop (ADR 0044, канал SMS удалён)
  "*000114_drop_leases_and_operations.up.sql",       # ban-drop-table ×8: осознанный drop контекста аренд (тикет #438, спека #434)
  "*000119_contacts_context.up.sql",                 # ban-drop-table: осознанный drop property_contacts (ADR 0051, карта #503 — данные не переносятся)
  "*000121_tasks_without_property.up.sql",           # ban-drop-not-null: свой смысл миграции — property_id в tasks становится опциональным (ADR 0052, карта #518); объектный срез не меняется, NULL-строки порождает только новый безобъектный срез
  "*000132_notifications_feed.up.sql",               # ban-drop-table + require-enum-value-ordering: осознанный дроп user_notification_channel_preferences без переноса строк (решение #738, ADR 0058); 15 типов каталога #737 добавляются порядком каталога, не алфавитом
  "*000145_drop_payment_form.up.sql",                # ban-drop-column ×2: осознанный снос «Формы оплаты» — поле write-only, ценности не несёт (карта #1005, тикет #1006, ревизия решения №3 ADR 0047)
  "*000147_push_enabled_drop.up.sql",                # ban-drop-column: осознанный снос вырожденного мастера enabled — строка есть = включено, выключение удаляет подписку (карта #1024, спека #1028 §5, решение владельца 01.10)
  "*000148_contacts_property_delete_cascade.up.sql", # adding-foreign-key-constraint: смена referential action DROP+ADD без NOT VALID — файл гоняется одной транзакцией golang-migrate, отдельный VALIDATE невозможен; прецедент 000086 (карта #1047, тикет #1049, разворот ADR 0054 §2)
  "*000150_rental_completion_payment_delete.up.sql", # ban-drop-not-null: свой смысл миграции — ссылка rentals.payment_id становится необязательной, Завершение аренды удаляет Платёж (ревизия ADR 0053 #1161); дюральный жизненный цикл ссылки держат новые CHECK'и того же файла; прецедент 000121
  "*000154_entity_photo_columns.up.sql",             # ban-drop-table: осознанный снос property_photos вместе со старым контрактом до-10-фото — строк нет, данные не переносятся (ADR 0065, карта #1217, решение #1220; прецеденты 000119/000132)
  "*000155_email_change_grant_addressless.up.sql",   # ban-drop-not-null: свой смысл миграции — адрес гранта смены email становится опциональным: грант рождается на проверке текущего адреса (verify-current), адрес привязывается следующим шагом (request-new-email-code), протокол #1202, тикет #1203; безадресный грант в домен не течёт — его гасит грант-сим liveBoundGrant; прецедент 000121
]

excluded_rules = [
  # Решение #295: конфликт с uuid-v7-app-side (ADR 0019) — id генерирует
  # приложение, а не база.
  "prefer-identity",
  "adding-serial-primary-key-field",
  "prefer-bigint-over-int",
  # CONCURRENTLY не исполняется внутри транзакции golang-migrate (см.
  # assume_in_transaction выше).
  "require-concurrent-index-creation",
  "require-concurrent-index-deletion",
  # Правила остаются выключенными: ретрофит исторического корпуса (файлы до
  # 108) невозможен без правки применённых миграций. Конвенция для новых
  # миграций уже принята (#324): файлы >= 000108 открываются SET
  # lock_timeout/statement_timeout; cutoff-правило в domain-rules.mjs —
  # отдельное внедрение пайплайна #324.
  "require-lock-timeout",
  "require-statement-timeout",
  # NOT VALID-констрейнты: таблицы малы, миграция исполняется одной транзакцией
  # вместе с бэкфиллом — двухшаговый NOT VALID + VALIDATE не применяется.
  "constraint-missing-not-valid",
]
