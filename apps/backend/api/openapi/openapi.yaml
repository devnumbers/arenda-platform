          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/access/invitations:
    post:
      operationId: createPropertyAccessInvitation
      summary: Invite a user by email to shared access to the property
      description: >
        Invites a user by email. When the email belongs to a registered user,
        the membership is activated instantly (equivalent to adding a member,
        no invite email is sent); otherwise a pending invitation is stored and
        a single invite email is sent. A pending invitation never expires and
