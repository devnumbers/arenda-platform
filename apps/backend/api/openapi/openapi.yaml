        access:
          allOf:
            - $ref: '#/components/schemas/PropertyAccessContext'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPhoto'
        members_count:
          type: integer
          minimum: 0
          description: >
            Shared-access participants of the property: membership rows (any
            status, owner excluded — the owner is never a membership row) plus
            pending email invitations.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PropertyPhoto:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    PropertyPhotosResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPhoto'

    ContactCreateRequest:
      description: >-
        The create payload of a contact card (ADR 0051). Only the first name
        is required; the phone travels in any accepted Russian spelling and
        is stored normalized to +7XXXXXXXXXX. A card with a propertyId lands
        in the property owner's book (the edit gate applies); without one it
        is created «без объекта» in the actor's own book.
      type: object
      required: [firstName]
      properties:
        propertyId:
          type: string
          format: uuid
          nullable: true
        firstName:
          type: string
          maxLength: 255
        lastName:
          type: string
          maxLength: 255
        patronymic:
          type: string
          maxLength: 255
        role:
          type: string
          description: What the person is to the property — «сантехник», «консьерж». Free text, never an access role.
        phone:
          type: string
        email:
          type: string
        messengerName:
          type: string
          description: The messenger's name — any service, one pair per contact.
        messengerUsername:
          type: string
        note:
          type: string

    ContactUpdateRequest:
      description: >-
        The partial-update payload of a contact card: an omitted field keeps
        the stored value, and a text field clears by sending an empty string.
        The propertyId is tri-state — omitted keeps the current binding, null
        clears it («без объекта»), a uuid moves the card onto that property
        (the target's edit gate applies).
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
          nullable: true
        firstName:
          type: string
          maxLength: 255
        lastName:
          type: string
          maxLength: 255
        patronymic:
          type: string
          maxLength: 255
        role:
          type: string
        phone:
          type: string
        email:
          type: string
        messengerName:
          type: string
        messengerUsername:
          type: string
        note:
          type: string

    ContactResponse:
      description: >-
        One card of the owner's contact book (ADR 0051): a person useful for
        a property — not a service user. propertyId null means «без
        объекта»; the card survives the property's deletion.
      type: object
      required: [id, firstName, lastName, patronymic, role, phone, email, messengerName, messengerUsername, note, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
        firstName:
          type: string
        lastName:
          type: string
        patronymic:
          type: string
        role:
          type: string
        phone:
          type: string
        email:
          type: string
        messengerName:
          type: string
        messengerUsername:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContactsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactResponse'

    Recurrence:
      description: >-
        The schedule anchor of a payment rule, discriminated by kind. The
        anchor lives in the recurrence itself; the lower bound of generation
        is the rule's server-set since date. Weekdays are 0=Sunday..6=Saturday.
        Day 31 clamps to the month's last day; Feb 29 clamps in non-leap
        years — the schedule never drifts.
      oneOf:
        - $ref: '#/components/schemas/RecurrenceDaily'
        - $ref: '#/components/schemas/RecurrenceWeekly'
        - $ref: '#/components/schemas/RecurrenceMonthly'
        - $ref: '#/components/schemas/RecurrenceYearly'
      discriminator:
        propertyName: kind
        mapping:
          daily: '#/components/schemas/RecurrenceDaily'
          weekly: '#/components/schemas/RecurrenceWeekly'
          monthly: '#/components/schemas/RecurrenceMonthly'
          yearly: '#/components/schemas/RecurrenceYearly'

    RecurrenceDaily:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [daily]

    RecurrenceWeekly:
      type: object
      required: [kind, weekdays]
      properties:
        kind:
          type: string
          enum: [weekly]
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 6

    RecurrenceMonthly:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [monthly]
        daysOfMonth:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 30
        lastDay:
          type: boolean
          description: >-
            Дополнительно срабатывать в последний день месяца (в коротких
            месяцах — в его фактический последний день).
      description: >-
        Хотя бы одно из daysOfMonth и lastDay обязательно (проверяется
        доменом). День 1..30 в коротких месяцах зажимается на последний день
        месяца без сдвига расписания.

    RecurrenceYearly:
      type: object
      required: [kind, month, day]
      properties:
        kind:
          type: string
          enum: [yearly]
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31

    PaymentCreateRequest:
      description: >-
        A payment rule on a property. The since date is server-set (today in
        the property owner's timezone) and never accepted from the client;
        backdated occurrences are not generated.
      type: object
      required: [type, title, amountKopecks, recurrence, paymentForm, categorySlug]
      properties:
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
          minLength: 1
          maxLength: 255
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        paymentForm:
          type: string
          enum: [transfer, cash]
        categorySlug:
          type: string
          description: Slug of the default category catalog (user categories arrive in a later slice).
        endDate:
          type: string
          format: date
          nullable: true
        autoPay:
          type: boolean
          default: false

    PaymentUpdateRequest:
      description: >-
        Partial payment update: an omitted field is left unchanged. endDate is
        tri-state — omitted keeps it, null clears it (open-ended), a date sets
        it. The since date is not editable.
      type: object
      properties:
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
          minLength: 1
          maxLength: 255
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        paymentForm:
          type: string
          enum: [transfer, cash]
        categorySlug:
          type: string
        endDate:
          type: string
          format: date
          nullable: true
        autoPay:
          type: boolean

    CategoryView:
      description: >-
        The payment's category reference resolved by the server: a default
        catalog slug (label from the code catalog; a slug removed from the
        catalog falls back to the label «Прочее») or a user category. Icon and
        color are frontend catalog metadata keyed by slug.
      type: object
      required: [source, label]
      properties:
        source:
          type: string
          enum: [default, custom]
        slug:
          type: string
        id:
          type: string
          format: uuid
        label:
          type: string

    PauseIntervalView:
      description: One pause interval [fromDate, toDate); a null toDate is the active open-ended pause.
      type: object
      required: [fromDate]
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
          nullable: true

    PaymentResponse:
      type: object
      required: [id, propertyId, type, title, amountKopecks, recurrence, since, autoPay, paymentForm, category, isFavorite, isCompleted, pauses, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
        amountKopecks:
          type: integer
          format: int64
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        since:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        autoPay:
          type: boolean
        paymentForm:
          type: string
          enum: [transfer, cash]
        category:
          $ref: '#/components/schemas/CategoryView'
        isFavorite:
          type: boolean
          description: The rule's favorite star (PUT favorite); returned in the reads and the lists.
        isCompleted:
          type: boolean
          description: >-
            Server-computed settlement view of the rule (CONTEXT.md,
            «Завершённый платёж»): no planned operations — overdue included —
            and no occurrence beyond the last materialized date of any
            status. Never stored, never written by the client; derived on
            every read like the operation's overdue.
        pauses:
          type: array
          items:
            $ref: '#/components/schemas/PauseIntervalView'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'

    FavoriteUpdateRequest:
      description: >-
        The favorite toggle body of PUT favorite (an atomic UPDATE on the
        server — never a read-modify-write PATCH).
      type: object
      required: [favorite]
      properties:
        favorite:
          type: boolean

    OperationResponse:
      description: >-
        One operation of the Payments context: a payment occurrence or a
        manual fact. status carries overdue as a server-computed view status
        (planned with the date already past in the property owner's timezone).
      type: object
      required: [id, propertyId, paymentId, date, paidDate, status, type, title, amountKopecks, paymentForm, categoryLabel, categorySlug]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
          nullable: true
          description: The originating rule; null marks it deleted or the fact manual.
        date:
          type: string
          format: date
        paidDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [planned, paid, overdue]
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
        amountKopecks:
          type: integer
          format: int64
        paymentForm:
          type: string
          enum: [transfer, cash]
          nullable: true
          description: Snapshot of the rule's form; null leaves room for manual operations.
        categoryLabel:
          type: string
          description: Category label snapshot frozen at materialization time.
        categorySlug:
          type: string
          nullable: true
          description: Default-catalog slug snapshot for icon rendering; null when absent.

    OperationsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationResponse'

    PropertyAccessMemberRole:
      type: string
      enum: [owner, full_access, viewer]
      description: >
        The participant's role on a property. `owner` is the object owner
        (synthesized, never stored as a membership); `full_access` and
        `viewer` are granted memberships.

    PropertyAccessMemberResponse:
      type: object
      required: [user_id, role, is_owner, status]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: >
            Membership id; null for the synthesized owner row. For a pending
            invitation row this is the invitation id.
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Participant user id; null for a pending invitation row.
        email:
          type: string
          format: email
          nullable: true
          description: >
            Invitee email; filled only on pending invitation rows, null for
            registered participants.
        role:
          $ref: '#/components/schemas/PropertyAccessMemberRole'
        is_owner:
          type: boolean
        display_name:
          type: string
          description: >
            Participant display name (name and surname, or a masked phone).
            Never the raw phone or email.
        has_email:
          type: boolean
        status:
          type: string
          enum: [active, suspended, pending]
          description: >
            Membership lifecycle status. "suspended" means the recipient's
            tariff slot was exceeded, so the object is hidden from the
            recipient's list and grants no access until a slot frees up.
            "pending" is an email invitation waiting for the invitee to
            register.
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: When the membership was suspended; null when active.
        last_sent_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the invite email was last sent; filled only on pending
            invitation rows.

    PropertyAccessMembersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyAccessMemberResponse'

    PropertyAccessMemberCreateRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: Registered user to grant access to.
        role:
          type: string
          enum: [full_access, viewer]

    PropertyAccessInvitationCreateRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: >
            Invitee email. A registered email activates the membership
            instantly; an unregistered email becomes a pending invitation.
        role:
          type: string
          enum: [full_access, viewer]

    PropertyAccessMemberUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [full_access, viewer]

    PropertiesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyResponse'
        hidden_shared_count:
          type: integer
          description: >
            Number of shared properties hidden from the recipient due to a
            tariff slot shortage (suspended memberships). Zero for owners and
            when the recipient is within their limit.
          default: 0

    PropertyType:
      type: string
      enum: [apartment, room, apartments, house, commercial, office, warehouse, garage, parking, land]

    PropertyStatus:
      type: string
      enum: [active, maintenance, archived]

    SubscriptionStatus:
      type: string
      enum: [active, grace, cancelled]

    SubscriptionPaymentStatus:
      type: string
      enum: [pending, succeeded, failed, refunded, partial_refunded, refunding]

    AdminSubscriptionPaymentPeriod:
      type: string
      enum: [month, year]

    TariffName:
      type: string
      enum: [basic, pro, business]

    NotificationPreference:
      type: object
      required: [event_type, email_allowed, push_allowed]
      properties:
        event_type:
          type: string
          enum: [subscription_grace]
        email_allowed:
          type: boolean
          description: Permission to deliver this event type over email.
        push_allowed:
          type: boolean
          description: Permission to deliver this event type over Web Push.

    NotificationPreferencesResponse:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'

    NotificationPreferencesUpdateRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/NotificationPreference'

    VapidPublicKeyResponse:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The application server's VAPID P-256 public key, base64url without padding (RFC 8292). Pass this to `pushManager.subscribe({ applicationServerKey })`.

    PushSubscriptionCreateRequest:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
          description: The push endpoint URL issued by the browser push service.
          maxLength: 2048
        p256dh:
          type: string
          description: The client ECDH P-256 public key, base64url (RFC 8291).
          maxLength: 512
        auth:
          type: string
          description: The per-subscription auth secret, base64url (RFC 8291).
          maxLength: 512
        expiration_time:
          type: string
          format: date-time
          nullable: true
          description: Optional subscription expiration instant reported by the browser (RFC 8030).

    PushSubscriptionDeleteRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          description: The push endpoint URL to unregister (same value sent on subscribe).
          maxLength: 2048

    PushSubscriptionResponse:
      type: object
      required: [id, endpoint, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PendingPopupsResponse:
      type: object
      required: [popups]
      properties:
        popups:
          type: array
          items:
            type: string

    ClientErrorReport:
      type: object
      required: [app, message]
      properties:
        app:
          type: string
          enum: [frontend, admin, landing]
          description: Application that reported the error
        message:
          type: string
          maxLength: 500
          description: Error message reported by the browser
        stack:
          type: string
          maxLength: 4000
          description: Optional stack trace
        url:
          type: string
          maxLength: 500
          description: Page URL where the error occurred

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    SubscriptionBlocked:
      description: Subscription is blocked; renew to continue mutating data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    MembershipSuspended:
      description: >-
        Access to the property is suspended because the recipient's tariff
        active-property limit is exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: "Доступ к объекту приостановлен: превышен лимит объектов по тарифу"
            code: membership_suspended
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
