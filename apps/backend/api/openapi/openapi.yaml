    post:
      operationId: resendPropertyAccessInvitation
      summary: Resend the invite email (24-hour cooldown)
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: invitationId
          in: path
          required: true
