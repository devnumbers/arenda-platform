            type: string
            format: uuid
      responses:
        '200':
          description: Recurring operation resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringOperationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
