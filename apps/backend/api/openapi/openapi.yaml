        - name: sort
          in: query
          required: false
          description: 'Sort field (camelCase). Allowed: createdAt. Defaults to createdAt descending.'
          schema:
            type: string
        - name: order
          in: query
          required: false
          description: 'Sort direction: asc or desc (default desc).'
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Admin audit log list for one user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/service:
    post:
      operationId: assignAdminServiceSubscription
      security:
        - sessionCookie: []
      description: |
        Assigns a service subscription (issue #255): the tariff runs for a fixed
        term without payment, auto-renew off; at the end of the term the
        subscription falls to the basic tariff through the common expiry path.
        The assignment overwrites the current subscription — a paid remainder
        does not stack. An upgrade on top of the service subscription later
        converts it back to paid from the new period.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAssignServiceSubscriptionRequest'
      responses:
        '204':
          description: Service subscription assigned
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/force-change:
    post:
      operationId: forceChangeAdminSubscriptionTariff
      security:
        - sessionCookie: []
      description: |
        Force-changes the subscription tariff (issue #255): the new tariff
        applies immediately without payment for the chosen period from now.
        The subscription keeps its source (a paid subscription stays paid, a
        service one stays service); excess properties beyond the new tariff
        limit are archived. Used to repair subscription state during incidents.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminForceChangeTariffRequest'
      responses:
        '204':
          description: Tariff force-changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/grace-extension:
    post:
      operationId: extendAdminSubscriptionGrace
      security:
        - sessionCookie: []
      description: |
        Extends the grace window manually (issue #255): gives the user extra
        days to fix their payment method. Only a subscription in grace can be
        extended; an already-expired window that the worker has not downgraded
        yet extends from now.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminExtendGraceRequest'
      responses:
        '204':
          description: Grace window extended
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/cancel:
    post:
      operationId: cancelAdminSubscription
      security:
        - sessionCookie: []
      description: |
        Cancels the subscription on the user's behalf (issue #255): the same
        semantics as the user's own cancellation — the tariff keeps working
        until valid_until, auto-renew switches off immediately. Paid
        subscriptions only; a service subscription is withdrawn by
        reassignment, not cancellation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Subscription cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/transitions:
    get:
      operationId: listAdminSubscriptionTransitions
      security:
        - sessionCookie: []
      description: >
        The subscription transition log of one user's subscription (issue
        #255): every status and tariff change with its reason, initiator
        (user/admin/system) and the payment that caused it, newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription transition log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscriptionTransitionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /client-errors:
    post:
      operationId: reportClientError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
      responses:
        '204':
          description: Error report accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /feedback:
    post:
      operationId: sendFeedback
      description: >
        Public landing feedback form (карта #1010): a question from the
        «Задать вопрос» modal forwarded by the landing's server-side proxy.
        Rate limited per IP; the message is emailed to the configured
        FEEDBACK_EMAIL recipient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204':
          description: Feedback accepted and queued for delivery
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Feedback is not configured (no recipient email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /webhooks/payment/{provider}:
    post:
      operationId: handlePaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed; response body is provider-specific
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string

  /properties/{propertyId}/rentals:
    post:
      operationId: createRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCreateRequest'
      responses:
        '201':
          description: Rental created (with its managed rent payment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Conflict: the property already has an unfinished rental, is
            archived, or is under maintenance. The maintenance guard answers
            code `property_maintenance` (ticket #1050) — every rental mutation
            of an unfinished rental stays blocked until the maintenance ends
            («Завершить ремонт» is the way back); the reads stay open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listRentals
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Rentals list (unfinished first, then completed by completion date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties/{propertyId}/rentals/{rentalId}:
    get:
      operationId: getRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rental
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalUpdateRequest'
      responses:
        '200':
          description: Rental updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Conflict: the rental is completed, the property is archived, or
            the property is under maintenance — the maintenance guard answers
            code `property_maintenance` (ticket #1050) for every mutation of
            an unfinished rental, terms edits included (продление rides the
            same PATCH).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteRental
      security:
        - sessionCookie: []
      description: >-
        Deletes the rental together with its managed rent payment (the rental
        row goes first, releasing the payment FK). Only a not-started
        («передумал до старта» — all planned occurrences are future and go
        cleanly) or a completed rental deletes; a started unfinished rental
        answers 409 — it only goes through completion. Overdue operations
        survive the payment as the property's debt.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Rental deleted (with its managed rent payment)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The rental has already started — finish it instead. On a property
            under maintenance the guard answers code `property_maintenance`
            (ticket #1050) for an unfinished rental's deletion; a completed
            rental (the history) deletes as before.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /properties/{propertyId}/rentals/{rentalId}/complete:
    post:
      operationId: completeRental
      security:
        - sessionCookie: []
      description: >-
        Completes the rental: records the completion date (start ≤ date ≤
        today in the owner's timezone — «По плану» is the UI's substitution)
        and stops the managed rent payment at that date — the strictly future
        planned operations are torn down, the due ones stay with the owner.
        The optional deposit return is a record, not an operation. Completing
        a future rental is impossible by design — a start date in the future
        leaves the valid window empty (400).
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCompleteRequest'
      responses:
        '200':
          description: Rental completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          description: The completion date is before the start or in the future
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The rental is already completed. On a property under maintenance
            the guard answers code `property_maintenance` (ticket #1050) —
            completing an unfinished rental is a mutation of it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /properties/{propertyId}/rentals/{rentalId}/summary:
    get:
      operationId: getRentalSummary
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: until
          in: query
          required: false
          description: >-
            Period end (inclusive). Defaults to the completion date for a
            completed rental, otherwise today in the owner's timezone; the
            completion master previews with the chosen date before completing.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The property's paid-operations totals over the rental period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        The actual cookie name depends on the `cookieSecure` setting:
        `session_id` when insecure and `__Host-session_id` when secure.

  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PaymentsSearchQuery:
      name: search
      in: query
      required: false
      description: >-
        Case-insensitive substring search. On /payments/search it runs over
        the rule title and the category (the default catalog label of the
        rule's slug or the user category's name); on /payments/objects it
        runs over the property name and address. Empty or missing — no
        filter.
      schema:
        type: string
    PaymentsCategoryFilter:
      name: category
      in: query
      required: false
      description: >-
        The search screen's chip filter (map #573 rework): the selected
        chip's category — the default catalog's slug or the user category's
        id — narrowing the matched rules to that category. Empty or missing
        — no filter. It never narrows matchedCategories.
      schema:
        type: string
    PaymentsTypeFilter:
      name: type
      in: query
      required: false
      description: >-
        The rules list's direction filter (map #573 rework): narrows the
        matched rules to income or expense. The category chips carry no
        direction (ticket #602), so nothing on the search screen sends it
        today. Missing — no filter. It never narrows matchedCategories.
      schema:
        type: string
        enum: [income, expense]
    PaymentsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    PaymentsCursor:
      name: cursor
      in: query
      required: false
      description: >-
        The opaque continuation cursor from the previous page's nextCursor
        (keyset pagination over (created_at, id), ticket #597). A missing or
        empty value starts the list from the beginning; a malformed value is
        a 400.
      schema:
        type: string

    PropertiesSearchQuery:
      name: search
      in: query
      required: true
      description: >-
        The case-insensitive substring the matches run over — the property's
        name or its address (ticket #601). Leading and trailing whitespace
        never takes part in the match.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    PropertiesSearchLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    PropertiesSearchCursor:
      name: cursor
      in: query
      required: false
      description: >-
        The opaque continuation cursor from the previous page's nextCursor
        (keyset pagination over (name, id), ticket #597's pattern). A missing
        or empty value starts the list from the beginning; a malformed value
        is a 400.
      schema:
        type: string

    HistoryBeforeCursor:
      name: before_cursor
      in: query
      required: false
      description: >-
        Непрозрачный курсор страницы СТАРШЕ ключа (продолжение ленты в
        прошлое, скролл вверх): берётся из next_cursor предыдущей страницы.
        Ключ keyset — (created_at, id); страница возобновляется строго после
        него. Отсутствие — лента читается с самых новых записей. Некорректный
        blob — 400; вместе с after_cursor передавать нельзя — 400.
      schema:
        type: string
    HistoryAfterCursor:
      name: after_cursor
      in: query
      required: false
      description: >-
        Непрозрачный курсор страницы МОЛОЖЕ ключа (prepend новых записей,
        канон InfiniteQueryTail): берётся из prev_cursor страницы с самими
        свежими из уже загруженных записей. Порядок строк страницы — по-прежнему
        (created_at, id) DESC. Пустой ответ — новых записей нет. Вместе с
        before_cursor передавать нельзя — 400.
      schema:
        type: string
    HistoryLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
      description: "Размер страницы (канон #597: 50 по умолчанию, 100 потолок)."
    HistoryDateFrom:
      name: date_from
      in: query
      required: false
      description: >-
        Включительная нижняя граница периода по created_at — календарная дата
        в 00:00:00 UTC (канон фильтра периода админ-аудита).
      schema:
        type: string
        format: date
    HistoryDateTo:
      name: date_to
      in: query
      required: false
      description: >-
        Включительная верхняя граница периода по created_at — матчингется как
        дата + 24ч без включения самой границы (канон фильтра периода
        админ-аудита).
      schema:
        type: string
        format: date
    HistoryBaseActions:
      name: actions
      in: query
      required: false
      description: >-
        Фильтр по основным действиям — через запятую, одно или несколько из
        словаря (ADR 0061 §4). Неизвестное значение — 400.
      schema:
        type: string
        example: added,deleted
    HistoryKinds:
      name: kinds
      in: query
      required: false
      description: >-
        Фильтр по видам действий — через запятую, одно или несколько из семи
        групп словаря (ADR 0061 §4). Неизвестное значение — 400.
      schema:
        type: string
        example: payment,operation
    HistoryActorIds:
      name: actor_ids
      in: query
      required: false
      description: >-
        Фильтр по актёрам — uuid через запятую; один id — экран «Действия
        участника». Записи с обезличенным актёром (пользователь удалён) под
        фильтр по актёру не попадают никогда. Некорректный uuid — 400.
      schema:
        type: string
        example: 0198bef4-16a2-7dd0-a52d-4b1f0e3c9a11
    HistoryPropertyIds:
      name: property_ids
      in: query
      required: false
      description: >-
        Фильтр по объектам — uuid через запятую; один id — история объекта.
        Каждый перечисленный объект должен быть видим читателю (один
        невидимый или неизвестный id — privacy-404 всего запроса, канон
        ленты задач #547); архивные объекты владельца строки отдают, у
        участника архивные объекты ничего не добавляют. Некорректный uuid —
        400.
      schema:
        type: string
    HistoryQuery:
      name: q
      in: query
      required: false
      description: >-
        Поисковая строка по журналу области чтения: ищет по тексту строки и
        снапшотам актёра (имя, почта) — «как в Telegram»: по началу слова
        (префикс), по фрагменту внутри слова и по словоформам; всегда-OR
        предикат prefix-FTS OR ILIKE (ресерч #839, тикет #842). Пробелы по
        краям не участвуют; пустая строка — фильтра нет. Серверный бэкстоп:
        ввод 400 байт и больше — 400 (255 символа кириллицы потолок схемы
        превышают; практические поисковые вводы на порядок короче).
      schema:
        type: string
        maxLength: 255

    OperationsStatusFilter:
      name: status
      in: query
      required: false
      description: >-
        Filter by the operation's view status. overdue is not stored anywhere —
        the server computes it against today in the property owner's timezone
        (planned with the date already past), so clients never need the owner's
        timezone.
      schema:
        type: string
        enum: [planned, paid, overdue]
    OperationsDateFrom:
      name: date_from
      in: query
      required: false
      description: >-
        Inclusive lower bound of the period on the listing's date key (see
        sort; the planned operation date by default, the paid_date payment
        fact under sort=paid_date).
      schema:
        type: string
        format: date
    OperationsDateTo:
      name: date_to
      in: query
      required: false
      description: >-
        Inclusive upper bound of the period on the listing's date key (see
        sort; the planned operation date by default, the paid_date payment
        fact under sort=paid_date).
      schema:
        type: string
        format: date
    OperationsSort:
      name: sort
      in: query
      required: false
      description: >-
        Which operation date the listing reads (ticket #992): date — the
        planned operation date, the schedule attribute the payment history,
        the overdue split and the projection live on (the contract default);
        paid_date — the actual payment fact date the operational feeds read.
        The period bounds (date_from/date_to) and the summaries follow the
        same date. A planned row carries no payment fact and sorts last in
        both directions under paid_date; on the global feed — paid facts
        only — the keyset cursor walks the same date and is bound to the
        sort it was issued under.
      schema:
        type: string
        enum: [date, paid_date]
        default: date
    OperationsOrder:
      name: order
      in: query
      required: false
      description: Sort direction over the listing's date key (see sort); asc (oldest first) or desc (default, newest first).
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    OperationsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    OperationsCursor:
      name: cursor
      in: query
      required: false
      description: >-
        The opaque continuation cursor from the previous page's nextCursor
        (keyset pagination over the listing's sort key and id, ticket #597)
        — the global feed's window; the property listings keep the offset
        vocabulary. The cursor is bound to the sort it was issued under —
        echoing it with a different sort is a 400. A missing or empty value
        starts the feed from the beginning; a malformed value is a 400.
      schema:
        type: string
    OperationsOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    ContactsLimit:
      name: limit
      in: query
      required: false
      description: >-
        The page size of the keyset window (ticket #600). A missing value
        means the default page; an out-of-range value is a 400.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    ContactsCursor:
      name: cursor
      in: query
      required: false
      description: >-
        The opaque continuation cursor from the previous page's nextCursor
        (keyset pagination over the listing's sort key and id, ticket #600).
        A missing or empty value starts the list from the beginning; a
        malformed value is a 400.
      schema:
        type: string
    TasksLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 500
    TasksOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    TitleSearch:
      name: search
      in: query
      required: false
      description: >-
        Case-insensitive substring search by title. A missing or empty value
        disables the filter; LIKE metacharacters in the value are literals.
      schema:
        type: string
    OperationsSearch:
      name: search
      in: query
      required: false
      description: >-
        Case-insensitive substring search over the operation title and the
        operation's category snapshot. A query made only of digits and amount
        separators (spaces, commas, points, dashes) additionally matches the
        amount: its digits are searched inside the amount's decimal digits
        (kopecks), so 2500 finds 2 500,00 ₽ and 2500,50 finds 2 500,50 ₽,
        while a query holding any letter never matches amounts. A missing or
        empty value disables the filter; LIKE metacharacters in the value are
        literals.
      schema:
        type: string
    OperationsTypeFilter:
      name: type
      in: query
      required: false
      description: >-
        Filter by the operation direction: the payment's type snapshot every
        operation carries. A missing value disables the filter.
      schema:
        type: string
        enum: [income, expense]
    OperationsIncludeArchived:
      name: includeArchived
      in: query
      required: false
      description: >-
        Lift the archive cut (#549): operations of archived properties rejoin
        the feed or the summary under the same visibility predicate. A missing
        value or false keeps the archive excluded (the #540 contract default).
      schema:
        type: boolean
    OperationsCategoriesFilter:
      name: category
      in: query
      required: false
      description: >-
        Comma-separated category slugs (the chips multi-select); operations of
        any other category are filtered out. A missing or empty value disables
        the filter; whitespace around slugs is ignored.
      schema:
        type: string
    OperationsPropertyIdsFilter:
      name: propertyIds
      in: query
      required: false
      description: >-
        Comma-separated property ids (the global «Объект» multi-select);
        operations of any other property are filtered out. Each id is resolved
        through its view gate (ADR 0028) — an unknown or non-visible id is the
        privacy 404; an archived property narrows the feed to an empty page
        (the feed never carries archived rows). A missing or empty value
        disables the filter — the merged feed.
      schema:
        type: string

  schemas:

    SendCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
        email:
          type: string

    SendCodeResponse:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: Whether a code was sent (false = email step required)
        retryAfter:
          type: integer
          description: Seconds before another code can be requested

    VerifyCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
        email:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
        timezone:
          type: string
          description: >-
            Browser-detected IANA timezone of the registering device
            (Intl.DateTimeFormat().resolvedOptions().timeZone). Applied only when
            this request creates a new user; an absent or invalid value keeps the
            Europe/Moscow default. Ignored for existing users — the manual choice
            in the profile picker is never overwritten.

    MeResponse:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA timezone identifier, e.g. Europe/Moscow.
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true

    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ActiveSession'

    ActiveSession:
      type: object
      required: [id, deviceType, browser, os, city, lastIp, lastSeenAt, createdAt, current]
      properties:
        id:
          type: string
          format: uuid
        deviceType:
          type: string
          enum: [computer, phone, tablet, tv, unknown]
          description: Device class captured from the User-Agent at session creation.
        browser:
          type: string
          description: Browser name, e.g. Chrome or YaBrowser; empty when unparsed.
        browserMajor:
          type: integer
          nullable: true
          description: Browser major version; null when unknown.
        os:
          type: string
          description: Operating system name; empty when unparsed.
        city:
          type: string
          nullable: true
          description: GeoIP-resolved city for the last IP in the ru locale; null when unknown.
        lastIp:
          type: string
          nullable: true
          description: Client IP of the most recent request.
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True when the session belongs to the caller's own cookie.

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        surname:
          type: string
          nullable: true
          maxLength: 255
        patronymic:
          type: string
          nullable: true
          maxLength: 255
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: IANA timezone identifier, e.g. Europe/Moscow.

    SendPhoneChangeCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+79990001122'

    ChangePhoneRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: '+79990001122'
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          example: '123456'

    ConfirmCurrentEmailRequest:
      type: object
      required: [code, newEmail]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          description: The code sent to the current email.
          example: '123456'
        newEmail:
          type: string
          maxLength: 255
          description: The new address; stored in lowercase.

    EmailChangeGrantResponse:
      type: object
      required: [grant]
      properties:
        grant:
          type: string
          description: >-
            One-time grant token binding the confirmed new email to the user.
            Present it at /me/email/change together with the code delivered to
            the new address; it expires in about 10 minutes.

    ResendEmailCodeRequest:
      type: object
      required: [grant]
      properties:
        grant:
          type: string
          description: >-
            The still-live grant token returned by /me/email/confirm-current;
            the code is re-issued for the address it binds.

    ChangeEmailRequest:
      type: object
      required: [code, grant]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          description: The code sent to the new email.
          example: '123456'
        grant:
          type: string
          description: The grant token returned by /me/email/confirm-current.

    Tariff:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          $ref: '#/components/schemas/TariffName'
        activePropertyLimit:
          type: integer
        monthlyPriceKopecks:
          type: integer
          format: int64
        yearlyPriceKopecks:
          type: integer
          format: int64

    Subscription:
      type: object
      required: [tariff, status, source, autoRenewEnabled]
      properties:
        tariff:
          $ref: '#/components/schemas/Tariff'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        source:
          type: string
          enum: [paid, service]
          description: |
            paid — the owner pays for the tariff (or runs the free basic plan);
            service — an admin assigned the tariff for a fixed term without
            payment (issue #255).
        validUntil:
          type: string
          format: date-time
          nullable: true
        autoRenewEnabled:
          type: boolean
        currentPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        pendingTariff:
          $ref: '#/components/schemas/Tariff'
          nullable: true
        pendingChangeAt:
          type: string
          format: date-time
          nullable: true
        pendingPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        activePaymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true
        pendingPayment:
          $ref: '#/components/schemas/SubscriptionPendingPayment'
          nullable: true
          description: >-
            The user's live pending payment (issue #616) — present only while
            an unpaid payment form holds the tariff decision. Its expiry is
            the server-side truth: past expiresAt the payment turns failed and
            the tariff choice unlocks.

    PaymentMethod:
      type: object
      required: [id, provider, displayMask, cardSystem, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        displayMask:
          type: string
        cardSystem:
          $ref: '#/components/schemas/CardSystem'
        expDate:
          type: string
          nullable: true
          description: Card expiry in the provider's display format (MMYY); null when unknown.
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SubscriptionPendingPayment:
      type: object
      required: [tariffName, period, amountKopecks, confirmUrl, expiresAt]
      description: >-
        The live pending subscription payment (issue #616): one per user, with
        the confirm URL and the absolute expiry instant the countdown anchors
        to. The TTL itself is a backend constant and does not surface here.
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        confirmUrl:
          type: string
        expiresAt:
          type: string
          format: date-time

    SubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, createdAt]
      description: >-
        One subscription charge (issue #619): one list row is one payment — a
        refunded payment keeps its own row with the refunded status and the
        same positive amount. The sign and the status label are a UI
        convention the frontend renders on top of the status; amounts in the
        contract are always positive kopecks.
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        provider:
          type: string
        paymentUrl:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            The payment form's absolute deadline (issue #680): the same instant
            the provider got as its redirect deadline, so the client closes the
            return-to-payment link by server truth instead of duplicating the
            form TTL. Null on merchant-initiated charges — they carry no payer
            form.
        paymentMethod:
          $ref: '#/components/schemas/SubscriptionPaymentCard'
        succeededAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    SubscriptionPaymentCard:
      type: object
      required: [displayMask, cardSystem]
      description: >-
        The card a payment was charged with (issue #619): a snapshot taken at
        creation or finalization of the payment, so the history survives
        payment-method deletion. Null for payments the provider reported no
        card for.
      properties:
        displayMask:
          type: string
          description: Masked card number, e.g. "4300********1234".
        cardSystem:
          $ref: '#/components/schemas/CardSystem'

    CardSystem:
      type: string
      enum: [mir, visa, mastercard, unknown]
      description: >-
        Card system derived by the backend from the BIN prefix of the masked
        number (2 — Mir, 4 — Visa, 5 — Mastercard); unknown for old or
        unrecognized cards.

    ChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'

    ChangeTariffResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
        confirmUrl:
          type: string
          nullable: true

    AutoRenewRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    CancelSubscriptionRequest:
      type: object
      properties:
        keepPropertyId:
          type: string
          format: uuid
          description: |
            The property the owner chooses to keep when the cancelled
            subscription later expires and the basic tariff's property limit
            is applied: the chosen property survives, the excess ones are
            archived. Must be one of the owner's active properties, otherwise
            the cancellation answers 409 `invalid_keep_property`. Omitted
            when there is no choice to make (0 or 1 active properties) — the
            most recently updated property survives.

    AddPaymentMethodRequest:
      type: object
      properties:
        providerToken:
          type: string
          description: |
            Raw provider token for synchronous providers (e.g. fake).
            Ignored for providers that use a bank-form flow such as T-Kassa.

    AddPaymentMethodResponse:
      type: object
      properties:
        confirmUrl:
          type: string
          nullable: true
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    TariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'

    AdminTariff:
      type: object
      required: [id, name, isActive, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/TariffName'
        isActive:
          type: boolean
          description: Hidden tariffs (false) stay referable by foreign keys but are not offered to users.
        activePropertyLimit:
          type: integer
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
        yearlyPriceKopecks:
          type: integer
          format: int64

    AdminTariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTariff'

    AdminCreateTariffRequest:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          $ref: '#/components/schemas/TariffName'
        activePropertyLimit:
          type: integer
          minimum: -1
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Monthly price in kopecks.
        yearlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Yearly price in kopecks.

    AdminUpdateTariffRequest:
      type: object
      required: [activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks, isActive]
      properties:
        activePropertyLimit:
          type: integer
          minimum: -1
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Monthly price in kopecks.
        yearlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Yearly price in kopecks.
        isActive:
          type: boolean
          description: |
            false hides the plan: it disappears from the user-facing listing
            and cannot be newly selected, while existing subscriptions,
            renewals and payment history keep referencing it.

    PaymentMethodsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'

    SubscriptionPaymentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPayment'

    AdminSubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, userId, userPhone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        provider:
          type: string
        userId:
          type: string
          format: uuid
        userPhone:
          type: string
        refundedAmountKopecks:
          type: integer
          format: int64
          nullable: true
        succeededAt:
          type: string
          format: date-time
          nullable: true
        paymentMethodId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminSubscriptionPaymentsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSubscriptionPayment'
        total:
          type: integer

    AdminAssignServiceSubscriptionRequest:
      type: object
      required: [tariffName, termType]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        termType:
          type: string
          enum: [month, year, date]
          description: |
            The fixed term of the service subscription: month or year counts
            from the assignment moment; date runs until the end of untilDate
            (UTC, inclusive).
        untilDate:
          type: string
          format: date
          description: Required when termType is date; must be today or later.

    AdminForceChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'

    AdminExtendGraceRequest:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 90
          description: The extra days added to the current grace window.

    AdminSubscriptionTransition:
      type: object
      required: [id, toStatus, toTariffId, toTariffName, reason, initiator, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/SubscriptionStatus'
          nullable: true
        toStatus:
          $ref: '#/components/schemas/SubscriptionStatus'
        fromTariffId:
          type: string
          format: uuid
          nullable: true
        toTariffId:
          type: string
          format: uuid
        fromTariffName:
          type: string
          nullable: true
        toTariffName:
          type: string
        reason:
          type: string
          description: |
            Why the transition happened: registered, cancelled, resumed,
            downgrade_scheduled, payment_applied, grace_entered,
            grace_extended, scheduled_change_applied, expired, refunded,
            service_assigned, forced_change.
        initiator:
          type: string
          enum: [user, admin, system]
        initiatorId:
          type: string
          format: uuid
          nullable: true
          description: The user or admin actor id; absent for the system.
        paymentId:
          type: string
          format: uuid
          nullable: true
          description: The payment that caused the transition, when there was one.
        createdAt:
          type: string
          format: date-time

    AdminSubscriptionTransitionsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSubscriptionTransition'
        total:
          type: integer

    AdminUser:
      type: object
      required: [id, phone, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        subscriptionStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SubscriptionStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminUserStats:
      type: object
      required: [activePropertiesCount, archivedPropertiesCount]
      properties:
        activePropertiesCount:
          type: integer
        archivedPropertiesCount:
          type: integer

    AdminUserResponse:
      type: object
      required: [user, subscription, stats]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        subscription:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Subscription'
        stats:
          $ref: '#/components/schemas/AdminUserStats'

    AdminUsersResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer

    AdminProperty:
      type: object
      required: [id, ownerId, ownerPhone, name, type, address, attributes, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        ownerPhone:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
        description:
          type: string
          nullable: true
        attributes:
          $ref: '#/components/schemas/PropertyAttributes'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        photos:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PropertyPhoto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminPropertiesResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProperty'
        total:
          type: integer

    AdminPropertyContact:
      type: object
      required: [id, propertyId, name, phone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminPropertyContactsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPropertyContact'
        total:
          type: integer

    AdminPropertyResponse:
      type: object
      required: [property]
      properties:
        property:
          $ref: '#/components/schemas/AdminProperty'

    AdminAuditLog:
