              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTaskRuleWithoutProperty
      summary: Partial task rule update on the property-less slice
      description: >
        The same PATCH semantics as the property path: omitted fields stay
        unchanged; comment, dueDate and dueTime are tri-state (null clears).
        The edit invalidates the not-yet-due uncompleted tasks — the tick
        stands the single future again with fresh snapshots; already due and
        completed tasks keep their frozen snapshots. A newly set due date
        must be today or later in the owner's timezone.
      security:
        - sessionCookie: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRuleUpdateRequest'
      responses:
        '200':
          description: Task rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTaskRuleWithoutProperty
      summary: Delete a property-less task rule (hard)
      description: >
        Every uncompleted task of the rule is physically removed; the
        completed journal stays with its snapshots (ruleId set to null).
        Owner-only (ADR 0052).
      security:
        - sessionCookie: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task rule deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/complete:
    post:
      operationId: completeTaskWithoutProperty
      summary: «Выполнить» a property-less task
      description: >
        The completion fact is stamped with today in the owner's timezone; a
