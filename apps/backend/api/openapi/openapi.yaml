components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        The actual cookie name depends on the `cookieSecure` setting:
        `session_id` when insecure and `__Host-session_id` when secure.

  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OperationsStatusFilter:
      name: status
      in: query
      required: false
      description: >-
        Filter by the operation's view status. overdue is not stored anywhere —
        the server computes it against today in the property owner's timezone
        (planned with the date already past), so clients never need the owner's
        timezone.
      schema:
        type: string
        enum: [planned, paid, overdue]
    OperationsDateFrom:
      name: date_from
      in: query
      required: false
      description: Inclusive lower bound of the period on the operation date.
      schema:
        type: string
        format: date
    OperationsDateTo:
      name: date_to
      in: query
      required: false
      description: Inclusive upper bound of the period on the operation date.
      schema:
        type: string
        format: date
    OperationsOrder:
      name: order
      in: query
      required: false
      description: Sort by the operation date; asc (oldest first) or desc (default, newest first).
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    OperationsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    OperationsOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    TitleSearch:
      name: search
      in: query
      required: false
      description: >-
        Case-insensitive substring search by title. A missing or empty value
        disables the filter; LIKE metacharacters in the value are literals.
      schema:
        type: string

  schemas:

    SendCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
        email:
          type: string

    SendCodeResponse:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: Whether a code was sent (false = email step required)
        retryAfter:
          type: integer
          description: Seconds before another code can be requested

    VerifyCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
        email:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'

    MeResponse:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA timezone identifier, e.g. Europe/Moscow.
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        surname:
          type: string
          nullable: true
          maxLength: 255
        patronymic:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          nullable: true
          maxLength: 255
          description: Email is stored in lowercase.
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: IANA timezone identifier, e.g. Europe/Moscow.

    SendPhoneChangeCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+79990001122'

    ChangePhoneRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: '+79990001122'
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          example: '123456'

    Tariff:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          $ref: '#/components/schemas/TariffName'
        activePropertyLimit:
          type: integer
        monthlyPriceKopecks:
          type: integer
          format: int64
        yearlyPriceKopecks:
          type: integer
          format: int64

    Subscription:
      type: object
      required: [tariff, status, source, autoRenewEnabled]
      properties:
        tariff:
          $ref: '#/components/schemas/Tariff'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        source:
          type: string
          enum: [paid, service]
          description: |
            paid — the owner pays for the tariff (or runs the free basic plan);
            service — an admin assigned the tariff for a fixed term without
            payment (issue #255).
        validUntil:
          type: string
          format: date-time
          nullable: true
        autoRenewEnabled:
          type: boolean
        currentPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        pendingTariff:
          $ref: '#/components/schemas/Tariff'
          nullable: true
        pendingChangeAt:
          type: string
          format: date-time
          nullable: true
        pendingPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        activePaymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    PaymentMethod:
      type: object
      required: [id, provider, displayMask, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        displayMask:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        provider:
          type: string
        paymentUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'

    ChangeTariffResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
