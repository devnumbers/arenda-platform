  /properties/{propertyId}/tasks/{taskId}/uncomplete:
    post:
      operationId: uncompleteTask
      summary: «Отменить выполнение» the task
      description: >
        The completion fact is cleared and the task returns to the active
        ones; the rule's schedule is untouched. Possible only while the rule
        lives — a journal row of a deleted rule is a 409.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task reopened (status is the server-computed view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
