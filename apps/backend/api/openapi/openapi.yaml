        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /operations:
    get:
      operationId: listOperations
      summary: List the actor's visible paid operations (the global «Операции» screen)
      description: >
        The global read side of the operations context (ticket #540). The
        response is the actor's visible merged feed: the paid operations of
        their own properties plus those of the properties they can view
        (ADR 0028; an actor-scoped cross-property read — the visibility
        predicate lives in the store's SQL, the tasks global feed's rule).
        The feed is paid-only: planned and overdue occurrences are the
        property screens' vocabulary, cancelled operations do not exist for
        reads. The operations of archived properties are not in the feed
        unless includeArchived lifts the cut (#549).
        The propertyIds filter narrows the feed to the listed properties,
        each resolved through its view gate — an unknown or non-visible id
        is the privacy 404. Every row carries propertyName, the bound
        property's display name — the global screen's row label. The period,
        search, type, category, order and pagination vocabulary is the
        property listing's. Reads never tick.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OperationsPropertyIdsFilter'
        - $ref: '#/components/parameters/OperationsDateFrom'
        - $ref: '#/components/parameters/OperationsDateTo'
        - $ref: '#/components/parameters/OperationsSearch'
        - $ref: '#/components/parameters/OperationsTypeFilter'
        - $ref: '#/components/parameters/OperationsIncludeArchived'
        - $ref: '#/components/parameters/OperationsCategoriesFilter'
        - $ref: '#/components/parameters/OperationsOrder'
        - $ref: '#/components/parameters/OperationsLimit'
        - $ref: '#/components/parameters/OperationsOffset'
      responses:
        '200':
          description: >
            Paid operations page. status is always paid (the feed's only
            view status); propertyName is the bound property's display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /operations/summary:
    get:
      operationId: summarizeOperations
      summary: Summarize the actor's visible paid operations (the global «Операции» screen)
      description: >
        The global twin of the property operations summary (ticket #540) over
        the same visible merged feed as GET /operations: paid operations of
        the actor's own properties plus the properties they can view, the
        archived ones excluded. The propertyIds filter and the period narrow
        the whole scope — totals and the category breakdown alike; the type
        and category filters narrow only the categories array, the totals
        always report both directions. Search is the listing's predicate —
        the summary of the searched scope stays consistent with its list.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OperationsPropertyIdsFilter'
        - $ref: '#/components/parameters/OperationsDateFrom'
        - $ref: '#/components/parameters/OperationsDateTo'
        - $ref: '#/components/parameters/OperationsSearch'
        - $ref: '#/components/parameters/OperationsTypeFilter'
        - $ref: '#/components/parameters/OperationsIncludeArchived'
        - $ref: '#/components/parameters/OperationsCategoriesFilter'
      responses:
        '200':
          description: >-
            Period totals of the visible paid operations by direction plus the
            per-category breakdown. The totals always report both directions —
            the summary cards read them together — while the type and category
            filters narrow only the categories array. Categories with no
            operations in scope are absent; the array is ordered by total,
            largest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/tasks:
    get:
      operationId: listPropertyTasks
      summary: List the property's tasks (active ones or the completed journal)
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: completed
          in: query
          required: false
          description: >
            The bucket selector: false (default) — the active tasks (the
            screen's Просроченные/Сегодня/даты/Без даты sections), true — the
            completed journal (the collapsible «Выполненные» section). total
            always counts the same bucket.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/TasksLimit'
        - $ref: '#/components/parameters/TasksOffset'
      responses:
        '200':
          description: >
            Tasks page. status is the server-computed view bucket (active,
            overdue, undated, completed) — the client never needs the owner's
            timezone; today is the data owner's current date for the
            «Сегодня»/«Завтра» sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/tasks/rules:
    post:
      operationId: createTaskRule
      summary: Create a task rule (creating a task is creating a rule)
      description: >
        The first materialization happens in the same call: the undated task
        of an undated rule, every occurrence due today, and the single future
        one. The due date must be today or later in the property owner's
        timezone — backdated rules are rejected.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRuleCreateRequest'
      responses:
        '201':
          description: Task rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /properties/{propertyId}/tasks/rules/{ruleId}:
    get:
      operationId: getTaskRule
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTaskRule
      summary: Partial task rule update
      description: >
        Omitted fields stay unchanged; comment, dueDate and dueTime are
        tri-state (null clears). The edit invalidates the not-yet-due
        uncompleted tasks (the undated and strictly future ones) — the tick
        stands the single future again with fresh snapshots; already due and
        completed tasks keep their frozen snapshots. A newly set due date must
        be today or later.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRuleUpdateRequest'
      responses:
        '200':
          description: Task rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTaskRule
      summary: Delete the task rule (hard; not covered by the v1 UI)
      description: >
        Every uncompleted task of the rule — planned, overdue, today's and the
        single future — is physically removed; the completed journal stays
        with its snapshots (ruleId set to null). There is no keep_overdue
        analogue: у задач нет долга.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task rule deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/tasks/completed:
    delete:
      operationId: deleteCompletedTasks
      summary: «Удалить все выполненные» — clear the completed journal
      description: >
        Removes the completed tasks of the property's deleted rules forever;
        rules and active tasks are untouched. The completed tasks of live
        rules stay — they hold the materialization dedup keys, and clearing
        them would re-materialize the rule's whole past (ADR 0051).
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Completed journal cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
