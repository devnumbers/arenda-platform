        - sessionCookie: []
      description: |
        Assigns a service subscription (issue #255): the tariff runs for a fixed
        term without payment, auto-renew off; at the end of the term the
        subscription falls to the basic tariff through the common expiry path.
        The assignment overwrites the current subscription — a paid remainder
        does not stack. An upgrade on top of the service subscription later
        converts it back to paid from the new period.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAssignServiceSubscriptionRequest'
      responses:
        '204':
          description: Service subscription assigned
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/force-change:
    post:
      operationId: forceChangeAdminSubscriptionTariff
      security:
        - sessionCookie: []
      description: |
        Force-changes the subscription tariff (issue #255): the new tariff
        applies immediately without payment for the chosen period from now.
        The subscription keeps its source (a paid subscription stays paid, a
        service one stays service); excess properties beyond the new tariff
        limit are archived. Used to repair subscription state during incidents.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminForceChangeTariffRequest'
      responses:
        '204':
          description: Tariff force-changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/grace-extension:
    post:
      operationId: extendAdminSubscriptionGrace
      security:
        - sessionCookie: []
      description: |
        Extends the grace window manually (issue #255): gives the user extra
        days to fix their payment method. Only a subscription in grace can be
        extended; an already-expired window that the worker has not downgraded
        yet extends from now.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminExtendGraceRequest'
      responses:
        '204':
          description: Grace window extended
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/cancel:
    post:
      operationId: cancelAdminSubscription
      security:
        - sessionCookie: []
      description: |
        Cancels the subscription on the user's behalf (issue #255): the same
        semantics as the user's own cancellation — the tariff keeps working
        until valid_until, auto-renew switches off immediately. Paid
        subscriptions only; a service subscription is withdrawn by
        reassignment, not cancellation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Subscription cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/transitions:
    get:
      operationId: listAdminSubscriptionTransitions
      security:
        - sessionCookie: []
      description: >
        The subscription transition log of one user's subscription (issue
        #255): every status and tariff change with its reason, initiator
        (user/admin/system) and the payment that caused it, newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription transition log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscriptionTransitionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /client-errors:
    post:
      operationId: reportClientError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
      responses:
        '204':
          description: Error report accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /webhooks/payment/{provider}:
    post:
      operationId: handlePaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed; response body is provider-specific
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string

  /properties/{propertyId}/rentals:
    post:
      operationId: createRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCreateRequest'
      responses:
        '201':
          description: Rental created (with its managed rent payment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listRentals
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Rentals list (unfinished first, then completed by completion date)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties/{propertyId}/rentals/{rentalId}:
    get:
      operationId: getRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rental
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalUpdateRequest'
      responses:
        '200':
          description: Rental updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Rental deleted (with its managed rent payment)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /properties/{propertyId}/rentals/{rentalId}/complete:
    post:
      operationId: completeRental
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalCompleteRequest'
      responses:
        '200':
          description: Rental completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /properties/{propertyId}/rentals/{rentalId}/summary:
    get:
      operationId: getRentalSummary
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - name: rentalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: until
          in: query
          required: false
          description: >-
            Period end (inclusive). Defaults to the completion date for a
            completed rental, otherwise today in the owner's timezone; the
            completion master previews with the chosen date before completing.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The property's paid-operations totals over the rental period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        The actual cookie name depends on the `cookieSecure` setting:
        `session_id` when insecure and `__Host-session_id` when secure.

  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OperationsStatusFilter:
      name: status
      in: query
      required: false
      description: >-
        Filter by the operation's view status. overdue is not stored anywhere —
        the server computes it against today in the property owner's timezone
        (planned with the date already past), so clients never need the owner's
        timezone.
      schema:
        type: string
        enum: [planned, paid, overdue]
    OperationsDateFrom:
      name: date_from
      in: query
      required: false
      description: Inclusive lower bound of the period on the operation date.
      schema:
        type: string
        format: date
    OperationsDateTo:
      name: date_to
      in: query
      required: false
      description: Inclusive upper bound of the period on the operation date.
      schema:
        type: string
        format: date
    OperationsOrder:
      name: order
      in: query
      required: false
      description: Sort by the operation date; asc (oldest first) or desc (default, newest first).
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    OperationsLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 100
    OperationsOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    TasksLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 500
    TasksOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    TitleSearch:
      name: search
      in: query
      required: false
      description: >-
        Case-insensitive substring search by title. A missing or empty value
        disables the filter; LIKE metacharacters in the value are literals.
      schema:
        type: string
    OperationsSearch:
      name: search
      in: query
      required: false
      description: >-
        Case-insensitive substring search over the operation title and the
        operation's category snapshot. A query made only of digits and amount
        separators (spaces, commas, points, dashes) additionally matches the
        amount: its digits are searched inside the amount's decimal digits
        (kopecks), so 2500 finds 2 500,00 ₽ and 2500,50 finds 2 500,50 ₽,
        while a query holding any letter never matches amounts. A missing or
        empty value disables the filter; LIKE metacharacters in the value are
        literals.
      schema:
        type: string
    OperationsTypeFilter:
      name: type
      in: query
      required: false
      description: >-
        Filter by the operation direction: the payment's type snapshot every
        operation carries. A missing value disables the filter.
      schema:
        type: string
        enum: [income, expense]
    OperationsIncludeArchived:
      name: includeArchived
      in: query
      required: false
      description: >-
        Lift the archive cut (#549): operations of archived properties rejoin
        the feed or the summary under the same visibility predicate. A missing
        value or false keeps the archive excluded (the #540 contract default).
      schema:
        type: boolean
    OperationsCategoriesFilter:
      name: category
      in: query
      required: false
      description: >-
        Comma-separated category slugs (the chips multi-select); operations of
        any other category are filtered out. A missing or empty value disables
        the filter; whitespace around slugs is ignored.
      schema:
        type: string
    OperationsPropertyIdsFilter:
      name: propertyIds
      in: query
      required: false
      description: >-
        Comma-separated property ids (the global «Объект» multi-select);
        operations of any other property are filtered out. Each id is resolved
        through its view gate (ADR 0028) — an unknown or non-visible id is the
        privacy 404; an archived property narrows the feed to an empty page
        (the feed never carries archived rows). A missing or empty value
        disables the filter — the merged feed.
      schema:
        type: string

  schemas:

    SendCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
        email:
          type: string

    SendCodeResponse:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: Whether a code was sent (false = email step required)
        retryAfter:
          type: integer
          description: Seconds before another code can be requested

    VerifyCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
        email:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'

    MeResponse:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA timezone identifier, e.g. Europe/Moscow.
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        surname:
          type: string
          nullable: true
          maxLength: 255
        patronymic:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          nullable: true
          maxLength: 255
          description: Email is stored in lowercase.
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: IANA timezone identifier, e.g. Europe/Moscow.

    SendPhoneChangeCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+79990001122'

    ChangePhoneRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: '+79990001122'
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          example: '123456'

    Tariff:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          $ref: '#/components/schemas/TariffName'
        activePropertyLimit:
          type: integer
        monthlyPriceKopecks:
          type: integer
          format: int64
        yearlyPriceKopecks:
          type: integer
          format: int64

    Subscription:
      type: object
      required: [tariff, status, source, autoRenewEnabled]
      properties:
        tariff:
          $ref: '#/components/schemas/Tariff'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        source:
          type: string
          enum: [paid, service]
          description: |
            paid — the owner pays for the tariff (or runs the free basic plan);
            service — an admin assigned the tariff for a fixed term without
            payment (issue #255).
        validUntil:
          type: string
          format: date-time
          nullable: true
        autoRenewEnabled:
          type: boolean
        currentPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        pendingTariff:
          $ref: '#/components/schemas/Tariff'
          nullable: true
        pendingChangeAt:
          type: string
          format: date-time
          nullable: true
        pendingPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        activePaymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    PaymentMethod:
      type: object
      required: [id, provider, displayMask, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        displayMask:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        provider:
          type: string
        paymentUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'

    ChangeTariffResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
        confirmUrl:
          type: string
          nullable: true

    AutoRenewRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    AddPaymentMethodRequest:
      type: object
      properties:
        providerToken:
          type: string
          description: |
            Raw provider token for synchronous providers (e.g. fake).
            Ignored for providers that use a bank-form flow such as T-Kassa.

    AddPaymentMethodResponse:
      type: object
      properties:
        confirmUrl:
          type: string
          nullable: true
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    TariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'

    AdminTariff:
      type: object
      required: [id, name, isActive, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/TariffName'
        isActive:
          type: boolean
          description: Hidden tariffs (false) stay referable by foreign keys but are not offered to users.
        activePropertyLimit:
          type: integer
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
        yearlyPriceKopecks:
          type: integer
          format: int64

    AdminTariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTariff'

    AdminCreateTariffRequest:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          $ref: '#/components/schemas/TariffName'
        activePropertyLimit:
          type: integer
          minimum: -1
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Monthly price in kopecks.
        yearlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Yearly price in kopecks.

    AdminUpdateTariffRequest:
      type: object
      required: [activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks, isActive]
      properties:
        activePropertyLimit:
          type: integer
          minimum: -1
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Monthly price in kopecks.
        yearlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Yearly price in kopecks.
        isActive:
          type: boolean
          description: |
            false hides the plan: it disappears from the user-facing listing
            and cannot be newly selected, while existing subscriptions,
            renewals and payment history keep referencing it.

    PaymentMethodsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'

    SubscriptionPaymentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPayment'

    AdminSubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, userId, userPhone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        provider:
          type: string
        userId:
          type: string
          format: uuid
        userPhone:
          type: string
        refundedAmountKopecks:
          type: integer
          format: int64
          nullable: true
        succeededAt:
          type: string
          format: date-time
          nullable: true
        paymentMethodId:
          type: string
