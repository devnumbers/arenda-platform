components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id

  schemas:
    SendPhoneCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+79990001122'

    VerifyPhoneCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
          example: '123456'

    MeResponse:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        surname:
          type: string
          nullable: true
          maxLength: 255
        patronymic:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          nullable: true
          maxLength: 255
          description: Email is stored in lowercase.

    SendPhoneChangeCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+79990001122'

    ChangePhoneRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: '+79990001122'
        code:
          type: string
          example: '123456'

    Tariff:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          type: string
          enum: [basic, pro, business]
        activePropertyLimit:
          type: integer
        monthlyPriceKopecks:
          type: integer
        yearlyPriceKopecks:
          type: integer

    Subscription:
      type: object
      required: [tariff, status, autoRenewEnabled]
      properties:
        tariff:
          $ref: '#/components/schemas/Tariff'
        status:
          type: string
          enum: [active, grace, blocked, cancelled]
        validUntil:
          type: string
          format: date-time
          nullable: true
        autoRenewEnabled:
          type: boolean
        pendingTariff:
          $ref: '#/components/schemas/Tariff'
          nullable: true
        pendingChangeAt:
          type: string
          format: date-time
          nullable: true
        pendingPeriod:
          type: string
          enum: [month, year]
          nullable: true
        activePaymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    PaymentMethod:
      type: object
      required: [id, provider, displayMask, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        displayMask:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          type: string
          enum: [month, year]
        amountKopecks:
          type: integer
        status:
          type: string
          enum: [pending, succeeded, failed, refunded, partial_refunded]
        provider:
          type: string
        createdAt:
          type: string
          format: date-time

    ChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          type: string
          enum: [basic, pro, business]
        period:
          type: string
          enum: [month, year]

    ChangeTariffResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
        confirmUrl:
          type: string
          nullable: true

    AutoRenewRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    AddPaymentMethodRequest:
      type: object
      properties:
        providerToken:
          type: string
          description: |
            Raw provider token for synchronous providers (e.g. fake).
            Ignored for providers that use a bank-form flow such as T-Kassa.

    AddPaymentMethodResponse:
      type: object
      properties:
        confirmUrl:
          type: string
          nullable: true
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    TariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'

    PaymentMethodsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'

    SubscriptionPaymentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPayment'

    AdminSubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, userId, userPhone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          type: string
          enum: [month, year]
        amountKopecks:
          type: integer
        status:
          type: string
          enum: [pending, succeeded, failed, refunded, partial_refunded]
        provider:
          type: string
        userId:
          type: string
          format: uuid
        userPhone:
          type: string
        createdAt:
          type: string
          format: date-time

    AdminSubscriptionPaymentsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSubscriptionPayment'
        total:
          type: integer

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string

    AddressSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AddressSuggestion'

    AddressSuggestion:
      type: object
      required: [value]
      properties:
        value:
          type: string
        city:
          type: string

    PropertyCreateRequest:
      type: object
      required: [name, type, address]
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [apartment, room, apartments, house, commercial, office, warehouse, garage, parking, land]
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000

    PropertyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [apartment, room, apartments, house, commercial, office, warehouse, garage, parking, land]
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [active, maintenance]

    PropertyResponse:
      type: object
      required: [id, name, type, address, status, occupancy, active_lease, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
