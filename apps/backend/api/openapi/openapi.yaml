    AdminAuditLogResponse:
      type: object
      required: [auditLog]
      properties:
        auditLog:
          $ref: '#/components/schemas/AdminAuditLog'

    AdminStatsRecentUser:
      type: object
      required: [id, phone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminStatsRecentPayment:
      type: object
      required: [id, userId, userPhone, amountKopecks, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userPhone:
