      responses:
        '200':
          description: Recurring operations list for property
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringOperationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createRecurringOperation
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
