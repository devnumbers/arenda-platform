        '500':
          $ref: '#/components/responses/InternalServerError'

  /admin/users/{id}/subscription/transitions:
    get:
      operationId: listAdminSubscriptionTransitions
      security:
        - sessionCookie: []
      description: >
        The subscription transition log of one user's subscription (issue
        #255): every status and tariff change with its reason, initiator
        (user/admin/system) and the payment that caused it, newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subscription transition log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscriptionTransitionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /client-errors:
    post:
      operationId: reportClientError
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientErrorReport'
      responses:
        '204':
          description: Error report accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /webhooks/payment/{provider}:
    post:
      operationId: handlePaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed; response body is provider-specific
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        The actual cookie name depends on the `cookieSecure` setting:
        `session_id` when insecure and `__Host-session_id` when secure.

  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:

    SendCodeRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
        email:
          type: string

    SendCodeResponse:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: Whether a code was sent (false = email step required)
        retryAfter:
          type: integer
          description: Seconds before another code can be requested

    VerifyCodeRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
        email:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'

    MeResponse:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
          description: IANA timezone identifier, e.g. Europe/Moscow.
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        surname:
          type: string
          nullable: true
          maxLength: 255
        patronymic:
          type: string
          nullable: true
          maxLength: 255
        email:
          type: string
          nullable: true
          maxLength: 255
          description: Email is stored in lowercase.
        timezone:
          type: string
          nullable: true
          maxLength: 64
          description: IANA timezone identifier, e.g. Europe/Moscow.

    SendPhoneChangeCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+79990001122'

    ChangePhoneRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: '+79990001122'
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'
          example: '123456'

    Tariff:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          $ref: '#/components/schemas/TariffName'
        activePropertyLimit:
          type: integer
        monthlyPriceKopecks:
          type: integer
          format: int64
        yearlyPriceKopecks:
          type: integer
          format: int64

    Subscription:
      type: object
      required: [tariff, status, source, autoRenewEnabled]
      properties:
        tariff:
          $ref: '#/components/schemas/Tariff'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        source:
          type: string
          enum: [paid, service]
          description: |
            paid — the owner pays for the tariff (or runs the free basic plan);
            service — an admin assigned the tariff for a fixed term without
            payment (issue #255).
        validUntil:
          type: string
          format: date-time
          nullable: true
        autoRenewEnabled:
          type: boolean
        currentPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        pendingTariff:
          $ref: '#/components/schemas/Tariff'
          nullable: true
        pendingChangeAt:
          type: string
          format: date-time
          nullable: true
        pendingPeriod:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
          nullable: true
        activePaymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    PaymentMethod:
      type: object
      required: [id, provider, displayMask, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        displayMask:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        provider:
          type: string
        paymentUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    ChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'

    ChangeTariffResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
        confirmUrl:
          type: string
          nullable: true

    AutoRenewRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    AddPaymentMethodRequest:
      type: object
      properties:
        providerToken:
          type: string
          description: |
            Raw provider token for synchronous providers (e.g. fake).
            Ignored for providers that use a bank-form flow such as T-Kassa.

    AddPaymentMethodResponse:
      type: object
      properties:
        confirmUrl:
          type: string
          nullable: true
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    TariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'

    AdminTariff:
      type: object
      required: [id, name, isActive, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/TariffName'
        isActive:
          type: boolean
          description: Hidden tariffs (false) stay referable by foreign keys but are not offered to users.
        activePropertyLimit:
          type: integer
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
        yearlyPriceKopecks:
          type: integer
          format: int64

    AdminTariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminTariff'

    AdminCreateTariffRequest:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          $ref: '#/components/schemas/TariffName'
        activePropertyLimit:
          type: integer
          minimum: -1
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Monthly price in kopecks.
        yearlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Yearly price in kopecks.

    AdminUpdateTariffRequest:
      type: object
      required: [activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks, isActive]
      properties:
        activePropertyLimit:
          type: integer
          minimum: -1
          description: Maximum number of active properties; -1 means unlimited.
        monthlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Monthly price in kopecks.
        yearlyPriceKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000 # domain.MaxTariffPriceKopecks (issue #425)
          description: Yearly price in kopecks.
        isActive:
          type: boolean
          description: |
            false hides the plan: it disappears from the user-facing listing
            and cannot be newly selected, while existing subscriptions,
            renewals and payment history keep referencing it.

    PaymentMethodsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'

    SubscriptionPaymentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPayment'

    AdminSubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, userId, userPhone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        provider:
          type: string
        userId:
          type: string
          format: uuid
        userPhone:
          type: string
        refundedAmountKopecks:
          type: integer
          format: int64
          nullable: true
        succeededAt:
          type: string
          format: date-time
          nullable: true
        paymentMethodId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminSubscriptionPaymentsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSubscriptionPayment'
        total:
          type: integer

    AdminAssignServiceSubscriptionRequest:
      type: object
      required: [tariffName, termType]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        termType:
          type: string
          enum: [month, year, date]
          description: |
            The fixed term of the service subscription: month or year counts
            from the assignment moment; date runs until the end of untilDate
            (UTC, inclusive).
        untilDate:
          type: string
          format: date
          description: Required when termType is date; must be today or later.

    AdminForceChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          $ref: '#/components/schemas/TariffName'
        period:
          $ref: '#/components/schemas/AdminSubscriptionPaymentPeriod'

    AdminExtendGraceRequest:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          minimum: 1
          maximum: 90
          description: The extra days added to the current grace window.

    AdminSubscriptionTransition:
      type: object
      required: [id, toStatus, toTariffId, toTariffName, reason, initiator, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/SubscriptionStatus'
          nullable: true
        toStatus:
          $ref: '#/components/schemas/SubscriptionStatus'
        fromTariffId:
          type: string
          format: uuid
          nullable: true
        toTariffId:
          type: string
          format: uuid
        fromTariffName:
          type: string
          nullable: true
        toTariffName:
          type: string
        reason:
          type: string
          description: |
            Why the transition happened: registered, cancelled,
            downgrade_scheduled, payment_applied, grace_entered,
            grace_extended, scheduled_change_applied, expired, refunded,
            service_assigned, forced_change.
        initiator:
          type: string
          enum: [user, admin, system]
        initiatorId:
          type: string
          format: uuid
          nullable: true
          description: The user or admin actor id; absent for the system.
        paymentId:
          type: string
          format: uuid
          nullable: true
          description: The payment that caused the transition, when there was one.
        createdAt:
          type: string
          format: date-time

    AdminSubscriptionTransitionsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSubscriptionTransition'
        total:
          type: integer

    AdminUser:
      type: object
      required: [id, phone, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        subscriptionStatus:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SubscriptionStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminUserStats:
      type: object
      required: [activePropertiesCount, archivedPropertiesCount]
      properties:
        activePropertiesCount:
          type: integer
        archivedPropertiesCount:
          type: integer

    AdminUserResponse:
      type: object
      required: [user, subscription, stats]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        subscription:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Subscription'
        stats:
          $ref: '#/components/schemas/AdminUserStats'

    AdminUsersResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer

    AdminProperty:
      type: object
      required: [id, ownerId, ownerPhone, name, type, address, attributes, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        ownerPhone:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
        description:
          type: string
          nullable: true
        attributes:
          $ref: '#/components/schemas/PropertyAttributes'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        photos:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/PropertyPhoto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminPropertiesResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProperty'
        total:
          type: integer

    AdminPropertyContact:
      type: object
      required: [id, propertyId, name, phone, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminPropertyContactsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPropertyContact'
        total:
          type: integer

    AdminPropertyResponse:
      type: object
      required: [property]
      properties:
        property:
          $ref: '#/components/schemas/AdminProperty'

    AdminAuditLog:
      type: object
      required: [id, actorRole, action, context, createdAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
        actorRole:
          type: string
          enum: [owner, admin, system, anonymous, full_access, viewer]
        action:
          type: string
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          format: uuid
          nullable: true
        context:
          type: object
          additionalProperties: true
        requestId:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminAuditLogsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditLog'
        total:
          type: integer

    AdminAuditLogResponse:
      type: object
      required: [auditLog]
      properties:
        auditLog:
          $ref: '#/components/schemas/AdminAuditLog'

    AdminStatsRecentUser:
      type: object
      required: [id, phone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminStatsRecentPayment:
      type: object
      required: [id, userId, userPhone, amountKopecks, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userPhone:
          type: string
        amountKopecks:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubscriptionPaymentStatus'
        createdAt:
          type: string
          format: date-time

    AdminStats:
      type: object
      required: [usersTotal, usersNewLast30d, subscriptionsActive, propertiesActive, propertiesArchived, paymentsSucceededTotalKopecksLast30d, paymentsFailedCountLast30d, paymentsRefundedCountLast30d, recentUsers, recentPayments]
      properties:
        usersTotal:
          type: integer
        usersNewLast30d:
          type: integer
        subscriptionsActive:
          type: integer
        propertiesActive:
          type: integer
        propertiesArchived:
          type: integer
        paymentsSucceededTotalKopecksLast30d:
          type: integer
          format: int64
        paymentsFailedCountLast30d:
          type: integer
        paymentsRefundedCountLast30d:
          type: integer
        recentUsers:
          type: array
          items:
            $ref: '#/components/schemas/AdminStatsRecentUser'
        recentPayments:
          type: array
          items:
            $ref: '#/components/schemas/AdminStatsRecentPayment'

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        code:
          type: string
          description: >-
            Machine-readable error code for failures the client must
            distinguish from the generic HTTP status (e.g.
            `membership_suspended`).
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      type: object
      required: [field, detail]
      properties:
        field:
          type: string
          description: JSON key of the invalid field (e.g. "floor").
        detail:
          type: string
          description: Human-readable explanation of the validation failure.

    AddressSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AddressSuggestion'

    AddressSuggestion:
      type: object
      required: [value]
      properties:
        value:
          type: string
        city:
          type: string

    PropertyAttributes:
      type: object
      additionalProperties: true
      description: >
        Per-type typed property characteristics. Keys and values are in English
        snake_case; Russian labels are a frontend/admin concern. The set of
        valid keys depends on the property type and is validated by the backend
        catalog (see issue #125). An empty object means "no characteristics".
        Only filled keys are stored; null values are never written.

    PropertyCreateRequest:
      type: object
      required: [name, type, address]
      properties:
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        attributes:
          $ref: '#/components/schemas/PropertyAttributes'

    PropertyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        attributes:
          allOf:
            - $ref: '#/components/schemas/PropertyAttributes'
          description: >
            Full replacement (idempotent). Omit the field to leave attributes
            unchanged; send an empty object to clear all characteristics.
        status:
          $ref: '#/components/schemas/PropertyStatus'

    PropertyAccessContext:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, full_access, viewer]
          description: >
            Actor's role on this property: owner for own properties,
            full_access/viewer for shared ones. Suspended memberships never
            appear here — the detail endpoint answers 403 membership_suspended.
        owner_name:
          type: string
          description: >
            Owner display name ("Name Surname" or masked phone, never email).
            Present only in the detail response when the actor is not the owner.

    PropertyResponse:
      type: object
      required: [id, name, type, address, status, members_count, attributes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
        description:
          type: string
        attributes:
          $ref: '#/components/schemas/PropertyAttributes'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        access:
          allOf:
            - $ref: '#/components/schemas/PropertyAccessContext'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPhoto'
        members_count:
          type: integer
          minimum: 0
          description: >
            Shared-access participants of the property: membership rows (any
            status, owner excluded — the owner is never a membership row) plus
            pending email invitations.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PropertyPhoto:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    PropertyPhotosResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPhoto'

    LeaseCreateRequest:
      type: object
