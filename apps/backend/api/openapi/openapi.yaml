        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
        actorRole:
          type: string
          enum: [owner, admin, system, anonymous, full_access, viewer]
        action:
          type: string
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          format: uuid
          nullable: true
        context:
          type: object
          additionalProperties: true
        requestId:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AdminAuditLogsResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditLog'
        total:
