  /tasks:
    get:
      operationId: listTasks
      summary: List the actor's visible tasks (the global «Задачи» screen)
      description: >
        The global read side of the tasks context (ADR 0052, ticket #521).
        Without a property filter the response is the actor's visible merged
        feed: their own tasks — bound and property-less — plus the bound
        tasks of the properties they can view (ADR 0028; a sharing member
        never sees the feed owner's property-less tasks). The tasks of
        archived properties are not in the feed — non-archived properties
        plus the property-less cut only (карта #518, решение 9). The property
        filters select one slice: propertyId — the tasks of the listed
        properties (one id keeps the one-property slice semantics, several —
        the picker's multi-select, ticket #547), every listed id resolved
        through its view gate (one invisible id is the privacy 404 of the
        whole request); withoutProperty — the property-less slice of the
        actor's own book. The two filters combine freely — the union is the
        feed filter's «Общие задачи» + objects (решение владельца
        2026-09-07); the property-less rows stay the reader's own book
        (ADR 0052). Every item's status is computed against its data owner's
        current moment (a merged page may span owners); today is the reading
        actor's current date — the day boundary for the «Сегодня»/«Завтра»
        sections (the data owner's on the single-id branch). The flat order
        is by due date — the property screen's section-contiguous backbone;
        the screen sorts rows inside the sections client-side (по дате
        создания / по названию, like the property screen). Reads never tick.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: query
          required: false
          description: >
            Filter by bound properties — a comma-separated list of one or
            more property UUIDs (the picker's multi-select, ticket #547). A
            single id keeps the one-property slice of ticket #521: resolved
            through the property's view gate (a stranger gets the privacy
            404), today is the data owner's. Several ids select the tasks of
            those properties in one merged page — every listed id must be
            visible to the reader (one invisible id is a privacy 404 of the
            whole request), today is the reader's, and archived properties
            contribute nothing (карта #518, решение 9). Combining it with
            withoutProperty is the union filter's «Общие задачи» + objects
            (решение владельца 2026-09-07); a malformed UUID in the list is
            a 400.
          schema:
            type: string
        - name: withoutProperty
          in: query
          required: false
          description: >
            The property-less slice of the actor's own book («без объекта»,
            ADR 0052). Combining it with propertyId unions the two cuts —
            the property-less rows stay the reader's own book (решение
            владельца 2026-09-07).
          schema:
            type: boolean
            default: false
        - name: completed
          in: query
          required: false
          description: >
            The bucket selector: false (default) — the active tasks (the
            screen's Просроченные/Сегодня/даты/Без даты sections), true — the
            completed journal. total always counts the same bucket.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/TasksLimit'
        - $ref: '#/components/parameters/TasksOffset'
      responses:
        '200':
          description: >
            Tasks page. status is the server-computed view bucket (active,
            overdue, undated, completed); propertyName is the bound
            property's display name for the global row — null on the
            property-less slice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/completed:
    delete:
      operationId: deleteCompletedTasksWithoutProperty
      summary: «Удалить все выполненные» — clear the actor's book-wide completed journal
      description: >
        The book-wide twin of the property journal clear (ticket #536): every
        completed task of the actor's own book is removed forever — the bound
        rows and the property-less ones (ADR 0052) in the same query, the
        deleted-rule journals and the live rules' completed rows alike. Each
        live rule losing rows gets its history horizon raised to
        max(deleted due)+1, so the cleared occurrences never materialize
        again (ADR 0051 as amended 2026-10-01). The archived properties'
        journals stay frozen (ADR 0025), and the shared-to properties'
        journals are other owners' books — the clear is owner-scope (ADR
        0028). No rule data changes — the tick is a no-op.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Completed journal cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks/rules:
    post:
      operationId: createTaskRuleWithoutProperty
      summary: Create a task rule without a property (the owner's own book)
      description: >
        The property-less slice of the tasks context (ADR 0052): the rule
        lives in the actor's own book — there is no property to resolve a
        role on, the actor is the data owner and the only actor who can
        create here. The first materialization happens in the same call: the
        undated task of an undated rule, every occurrence due today, and the
        single future one — today in the owner's timezone. The due date must
        be today or later in the owner's timezone — backdated rules are
        rejected.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRuleCreateRequest'
      responses:
        '201':
          description: Task rule created (propertyId is null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /tasks/rules/{ruleId}:
    get:
      operationId: getTaskRuleWithoutProperty
      summary: Load a task rule of the property-less slice (the edit screen)
      description: >
        Owner-only (ADR 0052): a foreign actor — including a member of any
        shared property — gets the privacy 404. A rule bound to a property is
        invisible on this path: the slices never mix.
      security:
        - sessionCookie: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
