openapi: 3.0.3
info:
  title: Arenda Planform API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /auth/send:
    post:
      operationId: sendCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/verify:
    post:
      operationId: verifyCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: >-
            Logged out. Deliberately without Clear-Site-Data: Chrome blocks
            delivering the response until the origin HTTP-cache purge
            finishes (11–14 s on real profiles, slow-logout diagnosis
            2026-10-06), and the HTTP cache holds no user data anyway.
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      operationId: getMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: updateMe
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/phone/send-code:
    post:
      operationId: sendPhoneChangeCode
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPhoneChangeCodeRequest'
      responses:
        '204':
          description: Code sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/phone/change:
    post:
      operationId: changePhone
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePhoneRequest'
      responses:
        '200':
          description: Phone changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/email/send-code:
    post:
      operationId: sendEmailChangeCode
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Code sent to the current email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/email/confirm-current:
    post:
      operationId: confirmCurrentEmail
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCurrentEmailRequest'
      responses:
        '200':
          description: Current email confirmed; a one-time grant and a code for the new email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeGrantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/email/resend-code:
    post:
      operationId: resendEmailCode
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailCodeRequest'
      responses:
        '204':
          description: Code re-sent to the pending new email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/email/change:
    post:
      operationId: changeEmail
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: Email changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/sessions:
    get:
      operationId: listSessions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active sessions of the current user, most recent activity first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/sessions/logout-others:
    post:
      operationId: logoutOtherSessions
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Every other session of the user is terminated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The session is terminated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /properties:
    post:
      operationId: createProperty
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SubscriptionBlocked'
    get:
      operationId: listProperties
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Properties list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /properties/archive:
    get:
      operationId: listArchivedProperties
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Archived properties list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /properties/search:
    get:
      operationId: searchProperties
      summary: Search the actor's visible properties (the «Объекты» search)
      description: >
        The hub's visible slice narrowed by the search query (ticket #601):
        a case-insensitive substring over the property's name and address.
        The slice is the main list's — the actor's own properties plus the
        ones shared with an active membership (ADR 0028), archived excluded.
        The list runs in pages of 50 the search screen's infinite scroll
        walks; the window is keyset pagination over (name, id) (ticket
        #597's pattern) — the hub's own default order, so rows shifting
        between loads never duplicate or drop, the previous page's nextCursor
        comes back as cursor. A rename can move a row across a window
        boundary — inherent to the visible-name sort (the contacts book,
        #600).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PropertiesSearchQuery'
        - $ref: '#/components/parameters/PropertiesSearchLimit'
        - $ref: '#/components/parameters/PropertiesSearchCursor'
      responses:
        '200':
          description: >
            The matched properties; nextCursor carries the next page's
            continuation (null — the matches are exhausted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dadata/suggestions/address:
    get:
      operationId: getAddressSuggestions
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 255
      responses:
        '200':
          description: Address suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSuggestionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /properties/{id}:
    get:
      operationId: getProperty
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/MembershipSuspended'
    patch:
      operationId: updateProperty
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdateRequest'
      responses:
        '200':
          description: Property updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/SubscriptionBlocked'
    delete:
      operationId: deleteProperty
      description: >-
        Deletes the property together with all its data: rentals, payments,
        operations, tasks and attached contacts. Irreversible. Blocked while
        the property has an unfinished rental — complete it first.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Property deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/SubscriptionBlocked'
  /properties/{id}/archive:
    post:
      operationId: archiveProperty
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/SubscriptionBlocked'
  /properties/{id}/unarchive:
    post:
      operationId: unarchiveProperty
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property unarchived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/SubscriptionBlocked'
  /properties/{propertyId}/photos:
    post:
      operationId: uploadPropertyPhoto
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /properties/{propertyId}/photos/{photoId}:
    delete:
      operationId: deletePropertyPhoto
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Photo deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /contacts:
    post:
      operationId: createContact
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactCreateRequest'
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: listContacts
      security:
        - sessionCookie: []
      parameters:
        - name: property_id
          in: query
          required: false
          description: >-
            Filter by the bound property. A missing value lists the actor's
            visible book: their own cards plus the property-bound cards of
            the properties they can view (ADR 0028 — for a shared member that
            is the bound cards of the shared properties plus their own unbound
            ones); a property-bound listing resolves through the view gate of
            that property (ADR 0028) and reads the cards bound to it.
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          description: >-
            Case-insensitive substring search over the name fields, phone,
            email, messenger username and role. A missing or empty value
            disables the filter; LIKE metacharacters in the value are
            literals.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            The sort key: `name` — the contact's display name (default);
            `property` — the bound property's name with the unbound cards
            first in both directions («Общие контакты»), contact name order
            inside; `created` — the card's creation moment (ticket #847 —
            the «свежие контакты сверху» promise server-side: descending
            leads with the freshest cards whatever the book's size; the
            default order is asc, so a bare sort=created lists oldest-first —
            the freshness promise needs an explicit order=desc, as the
            tenant picker sends). The name/property keys use the Russian
            collation to match the client's letter grouping.
          schema:
            type: string
            enum: [name, property, created]
            default: name
        - name: order
          in: query
          required: false
          description: >-
            The sort direction: ascending (default) or descending.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/ContactsLimit'
        - $ref: '#/components/parameters/ContactsCursor'
      responses:
        '200':
          description: >
            Contacts page. The window is keyset pagination over the listing's
            own sort key and id (ticket #600): the page always resumes
            strictly after the cursor's key, so cards created or deleted
            between loads never duplicate or drop. The name/property sort
            keys are mutable (display name, property binding): a rename or
            rebind of a card the walk has already passed can move it across
            the window boundary; the created key is immutable, so a walked
            card never moves. The cursor is bound to the sort/order it was
            issued under — echoing it with a different sort is a 400.
            nextCursor is null once the matches are exhausted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /contacts/{contactId}:
    get:
      operationId: getContact
      security:
        - sessionCookie: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateContact
      security:
        - sessionCookie: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdateRequest'
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteContact
      security:
        - sessionCookie: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Contact deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/payments:
    post:
      operationId: createPayment
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listPayments
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TitleSearch'
      responses:
        '200':
          description: >
            Payments list; every row carries the rule's next payment date
            (ticket #991) — null when the schedule has no next occurrence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/payments/{paymentId}:
    get:
      operationId: getPayment
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updatePayment
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdateRequest'
      responses:
        '200':
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
