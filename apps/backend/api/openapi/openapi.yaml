      operationId: listParticipants
      summary: List the owner's participants (aggregate over all properties)
      description: >
        The «Ваши участники» list (issue #693): one aggregate row per person —
        a registered user or a pending email — across every non-archived
        property the reading actor owns or manages as an active full_access
        member. The actor themself never appears. A person's identifier (id)
        is the registered user's uuid, or the invitee email for a pending row.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The owner's participants sorted by display name, pending emails last
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /participants/summary:
    get:
      operationId: getParticipantsSummary
      summary: Counters of the «Совместный доступ» hub
      description: >
        The hub card counters (issue #693): the number of the reading actor's
        participants (the same aggregate the list endpoint returns) and the
        number of other people's objects the actor has access to (the active
        shared memberships — the recipient tariff-slot counter).
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The hub counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantsSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /participants/invite:
    post:
      operationId: inviteParticipant
      summary: Invite a person to several objects with one role
      description: >
        The multi-object invitation of the «Совместный доступ» hub (issue
        #694). One email and one role against a list of property ids — a
        snapshot of the objects chosen at invite time; objects added later are
        not shared automatically. A registered email gets instant memberships
        (each property individually slot-checked, so a batch can mix active
        and suspended results); an unregistered email gets one pending
        invitation per property and exactly one invite email listing the
        objects. Every requested property id comes back with its per-property
        outcome. Requesting the actor's own email is a bad request.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantInviteRequest'
      responses:
        '200':
          description: >
            The per-property grant results, one item per requested id in
            request order (duplicate ids collapse to the first occurrence).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantGrantResultsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /participants/{participantId}/properties:
    post:
      operationId: addParticipantProperties
      summary: Grant an existing participant access to more objects
      description: >
        The «Пригласить в объект» action on the participant page (issue #694):
        adds the chosen properties to an existing person's aggregate with one
        role. The identifier resolves like everywhere else on the participant
        API — a registered user's uuid, or an invitee email (which may already
        have resolved to a registered user). Registered targets get
        memberships (per-property slot checks apply), pending-email targets
        get invitations and one invite email listing the newly granted
        objects. Every requested property id comes back with its per-property
        outcome.
      security:
        - sessionCookie: []
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            type: string
          description: A registered user's uuid or an invitee email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantPropertiesAddRequest'
      responses:
        '200':
          description: >
            The per-property grant results, one item per requested id in
            request order (duplicate ids collapse to the first occurrence).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantGrantResultsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /participants/{participantId}:
    delete:
      operationId: deleteParticipant
      summary: Revoke and remove a participant from all of the actor's objects
      description: >
        The «Отозвать и удалить» action on the participant page (issue #694):
        removes every membership and pending invitation the person holds on
        the properties the reading actor manages (owner or active full_access
        member) — including archived ones — in one transaction, with an audit
        entry per removed row and FIFO recovery of the person's suspended
        accesses when active slots were freed. No lifecycle emails are sent.
        Legs on other owners' properties stay untouched. A person with
        nothing in the actor's scope is a privacy-preserving 404.
      security:
        - sessionCookie: []
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            type: string
          description: A registered user's uuid or an invitee email.
      responses:
        '204':
          description: The person was removed from the actor's properties
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      operationId: getParticipant
      summary: One participant's aggregate (the participant page)
      description: >
        The same aggregate the list returns for one person: display data, the
        aggregate status and every access leg with its per-object role and
        lifecycle status (issue #693). A uuid resolves a registered user, an
        email resolves a pending invitee (and after the registration resolves
        to the same user's aggregate). Everything outside the reading actor's
        scope — including a person whose access was fully revoked — is a
        privacy-preserving 404 (the deep-link policy of the participant page).
      security:
        - sessionCookie: []
      parameters:
        - name: participantId
          in: path
          required: true
          schema:
            type: string
          description: A registered user's uuid or a pending invitee email.
      responses:
        '200':
          description: The participant's aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /history:
    get:
      operationId: getHistory
      summary: "Страница ленты «История действий» (двусторонний keyset, канон #597)"
      description: |
        Лента журнала действий по объектам, доступным читателю (ADR 0061 §7,
        карта #704, тикет #708): объекты, где читатель — владелец (включая
        архивные — история переживает архив), и объекты с его активным
        участием full_access/viewer (архив участнику ленту не раскрывает —
        канон невидимости архива, #163). Приостановленное участие (suspended)
        ленту не пускает; чужие объекты невидимы — их строк в ответе нет.

        Один эндпоинт обслуживает все четыре экрана карты #704: общая лента,
        история объекта (property_ids = один id), «Действия участника»
        (actor_ids = один id) и «Действия участника в объекте» (actor_ids и
        property_ids = по одному, сервер AND'ит их — #841). Группировка
        «дата → объект → актёр» — работа экрана; счётчика «найдено N» нет
        (решение #706).

        Курсор двусторонний: before_cursor продолжает ленту в старую сторону
        (бесконечный скролл вверх), after_cursor запрашивает записи моложе
        уже загруженных (prepend новых, канон InfiniteQueryTail); передавать
        оба сразу — 400. Строки страницы всегда идут по (created_at, id)
        DESC. Появившиеся и удалённые между загрузками записи не дублируются
        и не теряются — курсор возобновляется строго после ключа.

        Поиск q ищет по конкатенации текста строки и снапшотов актёра
        (имя + почта) — колонке searchable, материализованной при записи:
        «как в Telegram» — по началу слова (префикс), по фрагменту внутри
        слова и по словоформам; всегда-OR предикат prefix-FTS OR ILIKE на
        сервере (ресерч #839, тикет #842). Суммы в поиске не участвуют
        (их в тексте нет, ADR 0061 §5).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/HistoryBeforeCursor'
        - $ref: '#/components/parameters/HistoryAfterCursor'
        - $ref: '#/components/parameters/HistoryLimit'
        - $ref: '#/components/parameters/HistoryDateFrom'
        - $ref: '#/components/parameters/HistoryDateTo'
        - $ref: '#/components/parameters/HistoryBaseActions'
        - $ref: '#/components/parameters/HistoryKinds'
        - $ref: '#/components/parameters/HistoryActorIds'
        - $ref: '#/components/parameters/HistoryPropertyIds'
        - $ref: '#/components/parameters/HistoryQuery'
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /history/filters:
    get:
      operationId: getHistoryFilters
      summary: Опции шита фильтров «Истории действий»
      description: |
        Опции фильтров ленты в области чтения читателя (ADR 0061 §7): те же
        правила доступа, что у GET /history. «Участники» — владелец и
        участники области сейчас ∪ все актёры, встречающиеся в журнале
        области (отозванные и вышедшие остаются фильтруемыми — их записи
        переживают отзыв). «Объекты» — объекты области с названием, адресом
        и фото-аватаром (первое по времени фото, #582). property_ids сужает
        область (история одного объекта); та же дисциплина privacy-404, что
        у ленты: один невидимый или неизвестный id — 404 всего запроса.
        Счётчики N/M групп чекбоксов клиент считает сам; сами группы
        (4 основных действия, 7 видов) — статический словарь экрана
        (ADR 0061 §4).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/HistoryPropertyIds'
      responses:
        '200':
          description: Опции фильтров области
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryFiltersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      operationId: listNotifications
      summary: "Страница ленты уведомлений (keyset, канон #597)"
      description: |
        Хранимая лента пользователя, newest-first keyset-пагинация (карта
        #734, решение #737, #743). Удалённые строки не появляются. Курсор —
        непрозрачный blob из next_cursor предыдущей страницы; страницы
        читаются строго после последней строки, новые строки между загрузками
        не дублируются и не теряются. limit 1..100, по умолчанию 50.
      security:
        - sessionCookie: []
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
          description: Только непрочитанные строки.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: |
            Непрозрачный курсор продолжения (next_cursor прошлой страницы).
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteAllNotifications
      summary: Удалить все уведомления
      description: |
        Мягкое удаление всех строк ленты пользователя (решение #737):
        строки остаются с deleted_at, лента и счётчик непрочитанных их
        перестают видеть. Подтверждение — на стороне клиента.
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Все строки скрыты
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Счётчик непрочитанных
      description: |
        Число непрочитанных неудалённых строк пользователя (решение #737).
        Снижается кликом, открытием страницы и «Прочитать все»; пуш и email
        на читаемость не влияют.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Значение счётчика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Прочитать все
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Все непрочитанные строки помечены прочитанными
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}:
    get:
      operationId: getNotification
      summary: Страница уведомления с живыми действиями
      description: |
        Одна строка ленты с payload для отрисовки карточек (объект,
        приглашающий) и действиями, вычисленными при чтении по живому
        состоянию сущностей и правам читателя (решение #737): состояние
        ушло или сущность удалена — кнопок нет; роль «Просмотр» не получает
        кнопок-мутаций. Чужая или удалённая строка — 404.
      security:
        - sessionCookie: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Уведомление с действиями
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteNotification
      summary: Удалить уведомление
      description: Мягкое удаление одной строки; удаление непрочитанного снижает счётчик.
      security:
        - sessionCookie: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Строка скрыта (идемпотентно)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Прочитать уведомление
      description: Идемпотентно — повторный вызов не меняет состояние.
      security:
        - sessionCookie: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Строка прочитана
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Матрица email-настроек аккаунта
      description: |
        Email — на аккаунте: одна конфигурация на все устройства (решение
        #738, ADR 0058). Четыре настраиваемые категории; нет строки —
        всё включено. Тариф и Системные всегда включены и в настройках
        не показываются.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Текущая матрица
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: putNotificationPreferences
      summary: Заменить матрицу email-настроек аккаунта
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesRequest'
      responses:
        '200':
          description: Сохранённая матрица
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/stream:
    get:
      operationId: streamNotifications
      summary: Живой стрим событий пользователя (SSE)
      description: |
        Общий пользовательский Server-Sent Events стрим (карта #734, #742;
        ADR 0060). Авторизация — cookie-сессия тем же SessionMiddleware;
        без актора хендлер отвечает 401 problem+json до старта стрима.
        Формат кадров — WHATWG SSE: retry-подсказка и стартовое событие
        connected на старте, id — монотонная последовательность (курсор
        Last-Event-ID; replay в v1 не реализован), event — стабильное грубое
        имя (notification.created, notification.unread_count; новые
        имена — аддитивно), data — JSON-конверт {v, occurredAt, payload}.
        Heartbeat-комментарий каждые 25 с, соединение закрывается через час
        (пере-аутентификация при переподключении). Кадры best-effort:
        состояние клиент дочитывает через обычные эндпоинты. События
        изменений сущностей (карта #714) в этот стрим не входят: они едут
        отдельным стримом /realtime/stream — ADR 0062 superseded зарисовку
        §5 ADR 0060; контракт этого стрима заморожен.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Поток событий в формате text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Стрим недоступен (хаб не сконфигурирован)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /realtime/stream:
    get:
      operationId: streamRealtime
      summary: Живой стрим изменений сущностей (SSE)
      description: |
        Второй пользовательский Server-Sent Events стрим — кадры инвалидации
        карты #714 (тикет #716; ADR 0062) поверх транспорта ADR 0060
        (heartbeat 25 с, TTL час, тот же хаб и бюджет 8 соединений на
        пользователя, что и у /notifications/stream). Авторизация —
        cookie-сессия тем же SessionMiddleware; без актора хендлер отвечает
        401 problem+json до старта стрима. Единственное имя события —
        entity.changed, data — JSON-конверт {v, occurredAt, payload} с грубым
        payload {propertyId, entity}: имени из словаря (payments, operations,
        tasks, contacts, rentals, property, access, history) и объекта (null
        для внеобъектных правок книжки владельца). Данных сущности кадр не
        несёт — клиент перечитывает состояние через API. Аудитория кадра —
        производный доступ на чтение объекта на момент публикации (ADR 0028),
        включая автора; кадр с propertyId=null (внеобъектные правки книжки
        владельца) доставляется только автору; отзыв или приостановка доступа
        посреди стрима просто прекращают кадры, соединение не закрывается.
        Replay в v1 нет — при каждом открытии и переподключении
        клиент перечитывает живое состояние.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Поток событий в формате text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Стрим недоступен (хаб не сконфигурирован)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The application server's VAPID public key (base64url, RFC 8292)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /push/subscriptions:
    post:
      operationId: createPushSubscription
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionCreateRequest'
      responses:
        '201':
          description: Push subscription stored (upserted by endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deletePushSubscription
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionDeleteRequest'
      responses:
        '204':
          description: |
            Подписка удалена. Идемпотентно (спека #1028 §5): 204 и при
            отсутствии строки — интент «выключено» исполнен в обоих случаях,
            404 фронту различать не требуется.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /push/subscriptions/preferences:
    get:
      operationId: getPushSubscriptionPreferences
      summary: Настройки пушей устройства
      description: |
        Пуш — на устройстве (решение #738): мастер-тумблер «Получать
        пуш-уведомления» и четыре категорийных флага на подписке браузера.
        Устройство идентифицируется endpoint URL — естественным ключом и
        секретом подписки (RFC 8030 §8.3). Чужой/неизвестный endpoint — 404.
      security:
        - sessionCookie: []
      parameters:
        - name: endpoint
          in: query
          required: true
          schema:
            type: string
            maxLength: 2048
      responses:
        '200':
          description: Текущее состояние устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putPushSubscriptionPreferences
      summary: Заменить настройки пушей устройства
      description: |
        Замена категорий устройства (спека #1028 §5): категорийные флаги
        двигаются, подписка и её ключи остаются. Не upsert — неизвестный
        устройству endpoint строгий 404 (в нормальном флоу недостижим:
        мастер-состояние — само существование подписки, выключение
        выполняет DELETE /push/subscriptions).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushPreferencesRequest'
      responses:
        '200':
          description: Сохранённое состояние устройства
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /popups/pending:
    get:
      operationId: getPendingPopups
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Active popups the user has not seen yet, in display order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingPopupsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /popups/{popupKey}/seen:
    post:
      operationId: markPopupSeen
      security:
        - sessionCookie: []
      parameters:
        - name: popupKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Popup marked as seen (idempotent)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
