    FinanceReportPropertyRow:
      type: object
      required: [income_kopecks, expense_kopecks, profit_kopecks]
      properties:
        property_id:
          type: string
          format: uuid
          nullable: true
          description: Null groups operations whose property was deleted in detach mode.
        income_kopecks:
          type: integer
          format: int64
        expense_kopecks:
          type: integer
          format: int64
        profit_kopecks:
          type: integer
          format: int64
    FinanceReportCategoryRow:
      type: object
      required: [type, category_id, category_name, total_kopecks]
      properties:
        type:
          $ref: '#/components/schemas/OperationType'
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        total_kopecks:
          type: integer
          format: int64
    FinanceReportMonthRow:
      type: object
      required: [month, income_kopecks, expense_kopecks, profit_kopecks]
      properties:
        month:
          type: string
          format: date
        income_kopecks:
          type: integer
          format: int64
        expense_kopecks:
          type: integer
          format: int64
        profit_kopecks:
          type: integer
          format: int64

    ClientErrorReport:
      type: object
      required: [app, message]
      properties:
        app:
          type: string
          enum: [frontend, admin, landing]
          description: Application that reported the error
        message:
          type: string
          maxLength: 500
          description: Error message reported by the browser
        stack:
          type: string
          maxLength: 4000
          description: Optional stack trace
        url:
          type: string
          maxLength: 500
          description: Page URL where the error occurred

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    SubscriptionBlocked:
      description: Subscription is blocked; renew to continue mutating data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    MembershipSuspended:
      description: >-
        Access to the property is suspended because the recipient's tariff
        active-property limit is exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: "Доступ к объекту приостановлен: превышен лимит объектов по тарифу"
            code: membership_suspended
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
