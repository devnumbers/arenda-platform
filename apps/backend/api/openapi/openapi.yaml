  /reminders:
    get:
      operationId: listReminders
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Reminders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemindersResponse'
