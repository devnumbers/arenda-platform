        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscription/cancel:
    post:
      operationId: cancelSubscription
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Subscription cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscription/change:
    post:
      operationId: changeTariff
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTariffRequest'
      responses:
        '200':
          description: Tariff change initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeTariffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscription/payments:
    get:
      operationId: listSubscriptionPayments
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Subscription payments list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPaymentsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscription/payment-methods:
    get:
      operationId: listPaymentMethods
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Payment methods list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: addPaymentMethod
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPaymentMethodRequest'
      responses:
        '201':
          description: Payment method added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscription/payment-methods/{id}:
    delete:
      operationId: deletePaymentMethod
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Payment method deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /subscription/payment-methods/{id}/activate:
    post:
      operationId: activatePaymentMethod
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Payment method activated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /internal/fake-subscription-payment/{id}/confirm:
    post:
      operationId: confirmFakeSubscriptionPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /webhooks/payment/{provider}:
    post:
      operationId: handlePaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id

  schemas:
    SendPhoneCodeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: '+79990001122'

    VerifyPhoneCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
          example: '123456'

    MeResponse:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        role:
          type: string
          enum: [owner, admin]
        name:
          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        subscription:
          $ref: '#/components/schemas/Subscription'
          nullable: true

    Tariff:
      type: object
      required: [name, activePropertyLimit, monthlyPriceKopecks, yearlyPriceKopecks]
      properties:
        name:
          type: string
          enum: [basic, pro, business]
        activePropertyLimit:
          type: integer
        monthlyPriceKopecks:
          type: integer
        yearlyPriceKopecks:
          type: integer

    Subscription:
      type: object
      required: [tariff, status, autoRenewEnabled]
      properties:
        tariff:
          $ref: '#/components/schemas/Tariff'
        status:
          type: string
          enum: [active, grace, blocked, cancelled]
        validUntil:
          type: string
          format: date-time
          nullable: true
        autoRenewEnabled:
          type: boolean
        pendingTariff:
          $ref: '#/components/schemas/Tariff'
          nullable: true
        pendingChangeAt:
          type: string
          format: date-time
          nullable: true
        pendingPeriod:
          type: string
          enum: [month, year]
          nullable: true
        activePaymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          nullable: true

    PaymentMethod:
      type: object
      required: [id, provider, displayMask, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        displayMask:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SubscriptionPayment:
      type: object
      required: [id, tariff, period, amountKopecks, status, provider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        tariff:
          $ref: '#/components/schemas/Tariff'
        period:
          type: string
          enum: [month, year]
        amountKopecks:
          type: integer
        status:
          type: string
          enum: [pending, succeeded, failed]
        provider:
          type: string
        createdAt:
          type: string
          format: date-time

    ChangeTariffRequest:
      type: object
      required: [tariffName, period]
      properties:
        tariffName:
          type: string
          enum: [basic, pro, business]
        period:
          type: string
          enum: [month, year]

    ChangeTariffResponse:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
        confirmUrl:
          type: string
          nullable: true

    AutoRenewRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    AddPaymentMethodRequest:
      type: object
      required: [providerToken]
      properties:
        providerToken:
          type: string

    TariffsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tariff'

    PaymentMethodsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'

    SubscriptionPaymentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPayment'

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string

    PropertyCreateRequest:
      type: object
      required: [name, type, address]
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [apartment, room, apartments, house, commercial, office, warehouse, garage, parking, land]
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000

    PropertyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [apartment, room, apartments, house, commercial, office, warehouse, garage, parking, land]
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [active, maintenance]

    PropertyResponse:
      type: object
      required: [id, name, type, address, status, occupancy, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [apartment, room, apartments, house, commercial, office, warehouse, garage, parking, land]
        address:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, maintenance, archived]
        occupancy:
          type: string
          enum: [free, occupied]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LeaseCreateRequest:
      type: object
      required: [property_id, start_date, rent_amount_kopecks, payment_day]
      properties:
        property_id:
          type: string
          format: uuid
        tenant_contact_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        rent_amount_kopecks:
          type: integer
          minimum: 0
        deposit_amount_kopecks:
          type: integer
          minimum: 0
          default: 0
        payment_day:
          type: integer
          minimum: 1
          maximum: 31
        comment:
          type: string
          maxLength: 2000

    LeaseUpdateRequest:
      type: object
      properties:
        tenant_contact_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        rent_amount_kopecks:
          type: integer
        deposit_amount_kopecks:
          type: integer
        payment_day:
          type: integer
        comment:
          type: string

    LeaseResponse:
      type: object
      required: [id, property_id, owner_id, tenant_contact, status, start_date, rent_amount_kopecks, deposit_amount_kopecks, payment_day, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        tenant_contact:
          allOf:
            - $ref: '#/components/schemas/TenantContactResponse'
          nullable: true
        status:
          type: string
          enum: [awaiting_start, active, requires_action, completed, archived]
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        rent_amount_kopecks:
          type: integer
        deposit_amount_kopecks:
          type: integer
        payment_day:
          type: integer
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LeasesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaseResponse'

    TenantContactCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        surname:
          type: string
        patronymic:
          type: string
        phone:
          type: string
        email:
          type: string
        comment:
          type: string

    TenantContactUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        surname:
          type: string
        patronymic:
          type: string
        phone:
          type: string
        email:
          type: string
        comment:
          type: string

    TenantContactResponse:
      type: object
      required: [id, owner_id, name, surname, patronymic, phone, email, comment, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        surname:
          type: string
          nullable: true
        patronymic:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantContactsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantContactResponse'

    PropertiesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyResponse'

    OperationType:
      type: string
      enum: [income, expense]

    OperationCategory:
      type: string
      enum: [rent, other_income, utilities, repair, tax, other_expense]

    OperationCreateRequest:
      type: object
      required: [type, category, amount_kopecks, operation_date]
      properties:
        type:
          $ref: '#/components/schemas/OperationType'
        category:
          $ref: '#/components/schemas/OperationCategory'
        amount_kopecks:
          type: integer
          minimum: 0
        operation_date:
          type: string
          format: date
        comment:
          type: string
          maxLength: 2000
        lease_id:
          type: string
          format: uuid

    OperationUpdateRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/OperationType'
        category:
          $ref: '#/components/schemas/OperationCategory'
        amount_kopecks:
          type: integer
        operation_date:
          type: string
          format: date
        comment:
          type: string
          maxLength: 2000
        lease_id:
          type: string
          format: uuid

    OperationResponse:
      type: object
      required: [id, owner_id, property_id, type, category, amount_kopecks, operation_date, is_exception, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        lease_id:
          type: string
          format: uuid
          nullable: true
        recurring_operation_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/OperationType'
        category:
          $ref: '#/components/schemas/OperationCategory'
        amount_kopecks:
          type: integer
        operation_date:
          type: string
          format: date
        comment:
          type: string
          nullable: true
        is_exception:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OperationsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationResponse'

    RecurringOperationCreateRequest:
      type: object
      required: [type, category, amount_kopecks, start_date, payment_day]
      properties:
        type:
          $ref: '#/components/schemas/OperationType'
        category:
          $ref: '#/components/schemas/OperationCategory'
        amount_kopecks:
          type: integer
          minimum: 0
        start_date:
          type: string
          format: date
        payment_day:
          type: integer
          minimum: 1
          maximum: 31
        end_date:
          type: string
          format: date
        comment:
          type: string
          maxLength: 2000

    RecurringOperationUpdateRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/OperationType'
        category:
          $ref: '#/components/schemas/OperationCategory'
        amount_kopecks:
          type: integer
          minimum: 0
        start_date:
          type: string
          format: date
        payment_day:
          type: integer
          minimum: 1
          maximum: 31
        end_date:
          type: string
          format: date
        comment:
          type: string
          maxLength: 2000

    RecurringOperationResponse:
      type: object
      required: [id, owner_id, property_id, type, category, amount_kopecks, start_date, payment_day, periodicity, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        lease_id:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/OperationType'
        category:
          $ref: '#/components/schemas/OperationCategory'
        amount_kopecks:
          type: integer
        start_date:
          type: string
          format: date
        payment_day:
          type: integer
        end_date:
          type: string
          format: date
          nullable: true
        periodicity:
          type: string
          enum: [monthly]
        status:
          type: string
          enum: [active, paused]
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecurringOperationsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecurringOperationResponse'

    ReminderResponse:
      type: object
      required: [id, owner_id, target_type, event_type, status, scheduled_at, message_title, message_body, failed_attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [operation, recurring_operation, lease]
        operation_id:
          type: string
          format: uuid
          nullable: true
        recurring_operation_id:
          type: string
          format: uuid
          nullable: true
        lease_id:
          type: string
          format: uuid
          nullable: true
        property_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
          enum: [operation_due, lease_expiring, lease_requires_action]
        status:
          type: string
          enum: [pending, sent, failed, cancelled]
        scheduled_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          nullable: true
        failed_attempts:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        message_title:
          type: string
        message_body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReminderCreateRequest:
      type: object
      required: [reminder_date]
      properties:
        reminder_date:
          type: string
          format: date

    ReminderUpdateRequest:
      type: object
      required: [reminder_date]
      properties:
        reminder_date:
          type: string
          format: date

    RemindersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReminderResponse'

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    SubscriptionBlocked:
      description: Subscription is blocked; renew to continue mutating data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
