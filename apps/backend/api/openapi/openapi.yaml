          $ref: '#/components/responses/Unauthorized'

  /reminders/{reminderId}:
    patch:
      operationId: updateReminder
      security:
        - sessionCookie: []
      parameters:
        - name: reminderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderUpdateRequest'
      responses:
