    AdminStats:
      type: object
      required: [usersTotal, usersNewLast30d, subscriptionsActive, propertiesActive, propertiesArchived, paymentsSucceededTotalKopecksLast30d, paymentsFailedCountLast30d, paymentsRefundedCountLast30d, recentUsers, recentPayments]
      properties:
        usersTotal:
          type: integer
        usersNewLast30d:
          type: integer
        subscriptionsActive:
          type: integer
        propertiesActive:
          type: integer
        propertiesArchived:
          type: integer
        paymentsSucceededTotalKopecksLast30d:
          type: integer
          format: int64
        paymentsFailedCountLast30d:
          type: integer
        paymentsRefundedCountLast30d:
          type: integer
        recentUsers:
          type: array
          items:
            $ref: '#/components/schemas/AdminStatsRecentUser'
        recentPayments:
          type: array
          items:
            $ref: '#/components/schemas/AdminStatsRecentPayment'

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        code:
          type: string
          description: >-
            Machine-readable error code for failures the client must
            distinguish from the generic HTTP status (e.g.
            `membership_suspended`).
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'

    ProblemError:
      type: object
      required: [field, detail]
      properties:
        field:
          type: string
          description: JSON key of the invalid field (e.g. "floor").
        detail:
          type: string
          description: Human-readable explanation of the validation failure.

    AddressSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/AddressSuggestion'

    AddressSuggestion:
      type: object
      required: [value]
      properties:
        value:
          type: string
        city:
          type: string

    PropertyAttributes:
      type: object
      additionalProperties: true
      description: >
        Per-type typed property characteristics. Keys and values are in English
        snake_case; Russian labels are a frontend/admin concern. The set of
        valid keys depends on the property type and is validated by the backend
        catalog (see issue #125). An empty object means "no characteristics".
        Only filled keys are stored; null values are never written.

    PropertyCreateRequest:
      type: object
      required: [type, address]
      properties:
        name:
          type: string
          maxLength: 255
          description: >
            Optional. Omit (or send empty) to let the server generate the name
            from the property type — «Моя квартира», «Мой гараж 2»
            (ticket #1001). The serial is the object's position among the
            owner's properties of the type (archived included, deleted gone);
            the first property of the type carries no serial (ticket #1078).
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        attributes:
          $ref: '#/components/schemas/PropertyAttributes'

    PropertyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          description: >
            Omit to leave the name unchanged. An empty string clears the name
            and regenerates it from the property type — «Моя квартира»
            (ticket #1001): the first property of the type carries no serial,
            from the second the serial is appended (ticket #1078).
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        attributes:
          allOf:
            - $ref: '#/components/schemas/PropertyAttributes'
          description: >
            Full replacement (idempotent). Omit the field to leave attributes
            unchanged; send an empty object to clear all characteristics.
        status:
          $ref: '#/components/schemas/PropertyStatus'

    PropertyAccessContext:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, full_access, viewer]
          description: >
            Actor's role on this property: owner for own properties,
            full_access/viewer for shared ones. Suspended memberships never
            appear here — the detail endpoint answers 403 membership_suspended.
        owner_name:
          type: string
          description: >
            Owner display name ("Name Surname" or «Пользователь», never a
            phone or an email — карта #1105, аменд #1123).
            Present when the actor is not the owner: in the detail response
            and on the list rows (main and archive) — the shared card shows
            whose object it is. Own rows carry none.
        owner_email:
          type: string
          description: >
            Owner's account email for the detail's owner contact row — a
            deliberate exposure on this surface (Figma 2200-97365), the same
            posture as SuspendedShared.owner_email. Present in the detail
            response only when the actor is not the owner; empty when the
            owner has no email or the resolution failed.

    PropertyResponse:
      type: object
      required: [id, name, type, address, status, members_count, attributes, created_at, updated_at, pinned_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/PropertyType'
        address:
          type: string
        description:
          type: string
        attributes:
          $ref: '#/components/schemas/PropertyAttributes'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        access:
          allOf:
            - $ref: '#/components/schemas/PropertyAccessContext'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPhoto'
        members_count:
          type: integer
          minimum: 0
          description: >
            Shared-access participants of the property: membership rows (any
            status, owner excluded — the owner is never a membership row) plus
            pending email invitations.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        pinned_at:
          type: string
          format: date-time
          nullable: true
          description: >
            The global pin (ticket #577): null — not pinned, a moment — pinned
            since then. The lists order the pinned first, among themselves by
            this time. Archiving clears the pin. The domain language calls the
            concept «основной объект / primary property» (резолюция #584);
            the contract keeps the pin name.
        occupancy:
          $ref: '#/components/schemas/PropertyOccupancy'
          nullable: true
        has_overdue_operations:
          type: boolean
          description: >
            The payments half of the card's red dot (резолюция #584): the
            property holds at least one overdue planned operation — a stored
            planned row dated before the data owner's today (ADR 0048), the
            same predicate the payments listings report as the overdue view
            status. Red dot = needs_attention occupancy OR this flag.
            Populated by the list endpoints only (ticket #585); omitted
            elsewhere.

    PropertyOccupancy:
      description: >-
        Занятость объекта (property occupancy, резолюция #584, ticket #585):
        the property's computed state from its single unfinished rental
        against the data owner's today (ADR 0048) — the canon for the «По
        статусу» grouping, the card's rental badges and the red dot. The
        property lifecycle status (active/maintenance) is a different
        concept: a rental property under maintenance stays in its rental
        group. Populated by the list endpoints only; omitted on the write
        and detail responses.
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [upcoming, active, needs_attention, none]
          description: >
            The unfinished rental's status in the rentals vocabulary
            (rentals/CONTEXT.md): upcoming — the start has not come yet
            («Аренда с DD.MM» badge); active — the rental runs; needs_attention
            — the planned end has passed and the rental is not completed (the
            «Аренда завершена» badge, a red dot reason); none — no unfinished
            rental (an explicitly completed rental is history and reports
            none).
        start_date:
          type: string
          format: date
          nullable: true
          description: The unfinished rental's start date; null without one.
        planned_end_date:
          type: string
          format: date
          nullable: true
          description: >
            The unfinished rental's planned end date («Осталось N месяцев» —
            the client counts the full months from today); null for an
            open-ended rental or without one.

    PropertyPhoto:
      type: object
      required: [id, url]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    PropertyPhotosResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPhoto'

    ContactCreateRequest:
      description: >-
        The create payload of a contact card (ADR 0054). Only the first name
        is required; the phone travels in any accepted Russian spelling and
        is stored normalized to +7XXXXXXXXXX. A card with a propertyId lands
        in the property owner's book (the edit gate applies); without one it
        is created «без объекта» in the actor's own book.
      type: object
      required: [firstName]
      properties:
        propertyId:
          type: string
          format: uuid
          nullable: true
        firstName:
          type: string
          maxLength: 255
        lastName:
          type: string
          maxLength: 255
        patronymic:
          type: string
          maxLength: 255
        role:
          type: string
          description: What the person is to the property — «сантехник», «консьерж». Free text, never an access role.
        phone:
          type: string
        email:
          type: string
        messengerName:
          type: string
          description: The messenger's name — any service, one pair per contact.
        messengerUsername:
          type: string
        note:
          type: string

    ContactUpdateRequest:
      description: >-
        The partial-update payload of a contact card: an omitted field keeps
        the stored value, and a text field clears by sending an empty string.
        The propertyId is tri-state — omitted keeps the current binding, null
        clears it («без объекта»), a uuid moves the card onto that property
        (the target's edit gate applies).
      type: object
      properties:
        propertyId:
          type: string
          format: uuid
          nullable: true
        firstName:
          type: string
          maxLength: 255
        lastName:
          type: string
          maxLength: 255
        patronymic:
          type: string
          maxLength: 255
        role:
          type: string
        phone:
          type: string
        email:
          type: string
        messengerName:
          type: string
        messengerUsername:
          type: string
        note:
          type: string

    ContactResponse:
      description: >-
        One card of the owner's contact book (ADR 0054): a person useful for
        a property — not a service user. propertyId null means «без
        объекта». Deleting the property deletes its bound cards (FK CASCADE,
        ADR 0054 §2 as amended 2026-10-02); null-bound cards survive in the
        owner's book.
      type: object
      required: [id, firstName, lastName, patronymic, role, phone, email, messengerName, messengerUsername, note, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
        propertyName:
          type: string
          nullable: true
          description: >-
            The display name of the bound property; null for an unbound card.
            A list projection only — the card read resolves the property by
            its id.
        firstName:
          type: string
        lastName:
          type: string
        patronymic:
          type: string
        role:
          type: string
        phone:
          type: string
        email:
          type: string
        messengerName:
          type: string
        messengerUsername:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContactsResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContactResponse'
        nextCursor:
          type: string
          nullable: true
          description: >
            The opaque continuation cursor of the keyset window (ticket
            #600): pass it back as the cursor query parameter to fetch the
            next page. null — the matches are exhausted.

    Recurrence:
      description: >-
        The schedule anchor of a payment rule, discriminated by kind. The
        anchor lives in the recurrence itself; the lower bound of generation
        is the rule's server-set since date. Weekdays are 0=Sunday..6=Saturday.
        Day 31 clamps to the month's last day; Feb 29 clamps in non-leap
        years — the schedule never drifts.
      oneOf:
        - $ref: '#/components/schemas/RecurrenceDaily'
        - $ref: '#/components/schemas/RecurrenceWeekly'
        - $ref: '#/components/schemas/RecurrenceMonthly'
        - $ref: '#/components/schemas/RecurrenceYearly'
      discriminator:
        propertyName: kind
        mapping:
          daily: '#/components/schemas/RecurrenceDaily'
          weekly: '#/components/schemas/RecurrenceWeekly'
          monthly: '#/components/schemas/RecurrenceMonthly'
          yearly: '#/components/schemas/RecurrenceYearly'

    RecurrenceDaily:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [daily]

    RecurrenceWeekly:
      type: object
      required: [kind, weekdays]
      properties:
        kind:
          type: string
          enum: [weekly]
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 6

    RecurrenceMonthly:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [monthly]
        daysOfMonth:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 30
        lastDay:
          type: boolean
          description: >-
            Дополнительно срабатывать в последний день месяца (в коротких
            месяцах — в его фактический последний день).
      description: >-
        Хотя бы одно из daysOfMonth и lastDay обязательно (проверяется
        доменом). День 1..30 в коротких месяцах зажимается на последний день
        месяца без сдвига расписания.

    RecurrenceYearly:
      type: object
      required: [kind, month, day]
      properties:
        kind:
          type: string
          enum: [yearly]
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31

    PaymentCreateRequest:
      description: >-
        A payment rule on a property. The since date is server-set (today in
        the property owner's timezone) and never accepted from the client;
        backdated occurrences are not generated.
      type: object
      required: [type, title, amountKopecks, recurrence, categorySlug]
      properties:
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
          minLength: 1
          maxLength: 255
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        categorySlug:
          type: string
          description: Slug of the default category catalog (user categories arrive in a later slice).
        endDate:
          type: string
          format: date
          nullable: true
          description: >
            Окончание правила. Не раньше первого вхождения графика
            (recurrence от since): иначе правило не создало бы ни одной
            операции — 400 «Дата окончания не может быть раньше первого
            платежа» (тикет #1154). Конец на самом первом вхождении валиден.
        autoPay:
          type: boolean
          default: false
        reminderOffsetDays:
          type: integer
          nullable: true
          enum: [1, 3, 7]
          description: >-
            За сколько дней предупреждать о вхождении («Напоминание о
            платеже», карта #822): 1, 3 или 7. Null/omitted — напоминаний нет
            (выбор опционален). Напоминание живёт независимо от autoPay.

    PaymentUpdateRequest:
      description: >-
        Partial payment update: an omitted field is left unchanged. endDate is
        tri-state — omitted keeps it, null clears it (open-ended), a date sets
        it. The since date is not editable.
      type: object
      properties:
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
          minLength: 1
          maxLength: 255
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        categorySlug:
          type: string
        endDate:
          type: string
          format: date
          nullable: true
          description: >
            Tri-state: omitted keeps the value, null clears it (open-ended),
            a date sets it. Окно графика (тикет #1154): слитое правило —
            после применения патча — не может остаться с концом раньше
            первого вхождения (смена recurrence при стоящей дате
            перепроверяет её): 400 «Дата окончания не может быть раньше
            первого платежа». Правки, не трогающие расписание и конец,
            окно не перепроверяют.
        autoPay:
          type: boolean
        reminderOffsetDays:
          type: integer
          nullable: true
          enum: [1, 3, 7]
          description: >
            Tri-state lead time of the payment reminder («Напоминание о
            платеже»): omitted keeps the current value, null turns reminders
            off, 1/3/7 sets the lead time.

    CategoryView:
      description: >-
        The payment's category reference resolved by the server: a default
        catalog slug (label from the code catalog; a slug removed from the
        catalog falls back to the label «Прочее») or a user category. Icon and
        color are frontend catalog metadata keyed by slug.
      type: object
      required: [source, label]
      properties:
        source:
          type: string
          enum: [default, custom]
        slug:
          type: string
        id:
          type: string
          format: uuid
        label:
          type: string

    PauseIntervalView:
      description: One pause interval [fromDate, toDate); a null toDate is the active open-ended pause.
      type: object
      required: [fromDate]
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
          nullable: true

    PaymentResponse:
      type: object
      required: [id, propertyId, type, title, amountKopecks, recurrence, since, autoPay, category, isFavorite, isCompleted, nearestDate, isRentalManaged, isRentalCompleted, pauses, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
        amountKopecks:
          type: integer
          format: int64
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        since:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        autoPay:
          type: boolean
        category:
          $ref: '#/components/schemas/CategoryView'
        reminderOffsetDays:
          type: integer
          nullable: true
          enum: [1, 3, 7]
          description: >-
            The payment reminder's lead time in days (карта #822); null —
            напоминаний нет. Живёт независимо от autoPay.
        isFavorite:
          type: boolean
          description: The rule's favorite star (PUT favorite); returned in the reads and the lists.
        isCompleted:
          type: boolean
          description: >-
            Server-computed settlement view of the rule (CONTEXT.md,
            «Завершённый платёж»): no planned operations — overdue included —
            and no occurrence beyond the last materialized date of any
            status. Never stored, never written by the client; derived on
            every read like the operation's overdue.
        nearestDate:
          type: string
          format: date
          nullable: true
          description: >-
            «Следующая дата оплаты» (ticket #991, CONTEXT.md): the earliest
            stored planned operation on or after the owner's today (ADR
            0048), else the rule's projection. Null when the schedule has no
            next occurrence — an open pause or a settled rule. The object
            payments list resolves it on every row; the single-rule reads do
            not compute it and always carry null.
        isRentalManaged:
          type: boolean
          description: >-
            The rule is the rental's managed rent payment (ADR 0053, ticket
            #818): a rental row references it, any rental state — a completed
            rental is final and its payment is final with it. The rental is
            the source of truth for the amount, the payment day, the
            auto-pay and the planned end, so the rule mutations (pause,
            resume, patch, delete) answer 409; the payment facts («Оплатить»)
            and the favorite star stay open. The reads carry the flag so the
            client hides the mutation actions instead of learning the 409
            live.
        isRentalCompleted:
          type: boolean
          description: >-
            The managing rental is completed («Завершена» — финал: чтение,
            Итоги, Удаление; ticket #1158). The payment screen's «Изменить
            аренду» lives only while the rental is unfinished — the read-side
            state of the #818 gate: the mutation gate stays state-blind (any
            rental row finalizes its payment), this flag carries the rental
            state machine onto the payment surfaces so every surface shows
            the same action set.
        pauses:
          type: array
          items:
            $ref: '#/components/schemas/PauseIntervalView'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponse'

    PaymentGlobalItem:
      description: >
        One payment rule of the actor's visible merged feed (ticket #575) —
        the global «Платежи» card's data: the rule, its property label, the
        nearest schedule date and the overdue aggregates.
      type: object
      required: [id, propertyId, propertyName, title, amountKopecks, type, category, autoPay, isFavorite, favoriteOrder, today, nearestDate, overdueOperationCount, overdueDays, oldestOverdueOperationId]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        propertyName:
          type: string
          description: The display name of the bound property — the global screen's row label.
        title:
          type: string
        amountKopecks:
          type: integer
          format: int64
        type:
          type: string
          enum: [income, expense]
        category:
          $ref: '#/components/schemas/CategoryView'
        autoPay:
          type: boolean
        isFavorite:
          type: boolean
          description: The rule's favorite star (PUT favorite).
        favoriteOrder:
          type: integer
          nullable: true
          description: >
            The rule's manual favorite order (ticket #576): the 1-based
            position the favorites edit mode's save assigned. Null when the
            rule has never been in a saved order — the favorites screens
            sort by favoriteOrder with nulls last (the
            new-favorite-at-the-end rule); the feed's own order is
            unchanged.
        today:
          type: string
          format: date
          description: >
            The property owner's calendar date (ADR 0048) the row's schedule
            math ran against — the client renders «Сегодня»/«Завтра» against
            it instead of knowing the owner's timezone.
        nearestDate:
          type: string
          format: date
          nullable: true
          description: >
            «Ближайший»: the earliest stored planned operation on or after
            today, else the rule's projection — a bare schedule order without
            a view status. Null when the schedule has no next occurrence
            (an open pause or a settled rule).
        overdueOperationCount:
          type: integer
          description: >
            The rule's overdue operations (planned with the date before
            today); 0 when the rule has none.
        overdueDays:
          type: integer
          nullable: true
          description: >
            The age of the oldest overdue operation in days (today minus its
            date, at least 1) — the «N дней» line; null when the rule has no
            overdue operations.
        oldestOverdueOperationId:
          type: string
          format: uuid
          nullable: true
          description: >
            The oldest overdue operation's id (the same operation the
            overdueDays age speaks of) — the overdue card's link target on
            the global main screen (ticket #578); null when the rule has no
            overdue operations.

    PaymentsGlobalResponse:
      description: >
        The global «Платежи» feed (ticket #575) with the main screen's
        counters. Money is integer kopecks (ADR 0008).
      type: object
      required: [items, favoriteCount, overdueOperationsCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentGlobalItem'
        favoriteCount:
          type: integer
          description: >
            The favorite rules of the whole visible scope — the «Все
            избранные (N)» card; never narrowed by a search.
        overdueOperationsCount:
          type: integer
          description: >
            The overdue operations summed across the whole visible scope —
            the «Все просроченные (N)» card; never narrowed by a search.

    PaymentsFavoriteOrderUpdate:
      description: >
        The favorites edit mode's save request (ticket #576): the actor's
        visible favorite rules in their new order — the complete list as
        the edit screen shows it.
      type: object
      required: [paymentIds]
      properties:
        paymentIds:
          type: array
          description: >
            The favorite rules in their new order; the server assigns dense
            1-based positions in this order (ticket #576).
          items:
            type: string
            format: uuid

    PaymentsSearchGlobalResponse:
      description: >
        The global payment rules search (ticket #575): the matched rows plus
        the matched-category chips and the whole scope's match count.
      type: object
      required: [items, matchedCategories, nextCursor, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentGlobalItem'
        matchedCategories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryView'
        nextCursor:
          type: string
          nullable: true
          description: >
            The opaque continuation cursor of the keyset window (ticket
            #597): pass it back as the cursor query parameter to fetch the
            next page. null — the matches are exhausted.
        total:
          type: integer
          format: int64
          description: >
            The whole scope's match count under the query and the chip
            filter (ticket #599) — «найдено N»: the same predicate as the
            rows, independent of the window, identical on every walked
            page.

    PaymentObjectKey:
      description: >
        One key of a property's stack (ticket #575): the rule behind it and
        its overdue flag — the red dot.
      type: object
      required: [paymentId, hasOverdue]
      properties:
        paymentId:
          type: string
          format: uuid
        hasOverdue:
          type: boolean

    PaymentObjectItem:
      description: >
        One visible property with its payment stacks (ticket #575): the keys
        grouped into the auto-pay group and the rest.
      type: object
      required: [propertyId, name, address, autoPayRules, otherRules, pinnedAt, photoUrl]
      properties:
        propertyId:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        pinnedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            The object's global pin (ticket #577): null — not pinned, a
            moment — pinned since then. The cards order the pinned first.
        photoUrl:
          type: string
          nullable: true
          description: >
            The card avatar's photo — the object's first (oldest) photo
            (ticket #582); null when the object has no photos.
        autoPayRules:
          type: array
          description: The «Автоплатежи» group — the object's auto-pay rules.
          items:
            $ref: '#/components/schemas/PaymentObjectKey'
        otherRules:
          type: array
          description: The «Платежи» group — the object's non-auto-pay rules.
          items:
            $ref: '#/components/schemas/PaymentObjectKey'

    PaymentObjectsGlobalResponse:
      description: >-
        The global «Объекты» screen of the payments map (ticket #575).
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentObjectItem'

    FavoriteUpdateRequest:
      description: >-
        The favorite toggle body of PUT favorite (an atomic UPDATE on the
        server — never a read-modify-write PATCH).
      type: object
      required: [favorite]
      properties:
        favorite:
          type: boolean

    PinnedUpdateRequest:
      description: >-
        The pin toggle body of PUT pin (ticket #577, the favorite toggle's
        canon): an atomic UPDATE on the server — never a read-modify-write
        PATCH. Pinning an already-pinned object keeps its original pin time
        (the PUT's idempotency — the order among the pinned never shifts).
      type: object
      required: [pinned]
      properties:
        pinned:
          type: boolean
    CreateOperationRequest:
      description: >-
        The body of the manual operation creation (ticket #569). The date is
        server-set — today in the property owner's timezone — and the fact is
        born paid; no payment form exists behind a manual fact.
      type: object
      required: [type, title, amountKopecks, categorySlug]
      properties:
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
          minLength: 1
          maxLength: 255
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        categorySlug:
          type: string
          description: Slug of the default category catalog; frozen as the operation's snapshot.
    OperationResponse:
      description: >-
        One operation of the Payments context: a payment occurrence or a
        manual fact. status carries overdue as a server-computed view status
        (planned with the date already past in the property owner's timezone).
      type: object
      required: [id, propertyId, paymentId, date, paidDate, status, type, title, amountKopecks, categoryLabel, categorySlug]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        propertyName:
          type: string
          nullable: true
          description: >
            The display name of the bound property — the global screen's row
            label (list projection only, filled on the global listing; null
            elsewhere — the property screen resolves the property by its id).
        paymentId:
          type: string
          format: uuid
          nullable: true
          description: The originating rule; null marks it deleted or the fact manual.
        date:
          type: string
          format: date
        paidDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [planned, paid, overdue]
        type:
          type: string
          enum: [income, expense]
        title:
          type: string
        amountKopecks:
          type: integer
          format: int64
        categoryLabel:
          type: string
          description: Category label snapshot frozen at materialization time.
        categorySlug:
          type: string
          nullable: true
          description: Default-catalog slug snapshot for icon rendering; null when absent.

    OperationsResponse:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationResponse'
        nextCursor:
          type: string
          nullable: true
          description: >
            The opaque continuation cursor of the keyset window (ticket
            #597): pass it back as the cursor query parameter to fetch the
            next page. null — the feed is exhausted.
        total:
          type: integer
          format: int64
          description: >
            The whole scope's paid count under the query's filters (ticket
            #599) — «найдено N»: the same predicate as the rows,
            independent of the window, identical on every walked page. The
            global feed's field (GET /operations): the property-scoped
            listings sharing this schema omit it.

    OperationsSummaryCategory:
      description: >-
        One category's total over the summarized scope. Rows without a
        category snapshot never appear here — their amounts still count in
        the totals.
      type: object
      required: [categorySlug, categoryLabel, type, totalKopecks]
      properties:
        categorySlug:
          type: string
        categoryLabel:
          type: string
        type:
          type: string
          enum: [income, expense]
        totalKopecks:
          type: integer
          format: int64

    OperationsSummaryResponse:
      description: >-
        The operations summary behind the «Операции объекта» screens: the
        period totals by direction and the per-category breakdown. Money is
        integer kopecks (ADR 0008).
      type: object
      required: [incomeTotalKopecks, expenseTotalKopecks, categories]
      properties:
        incomeTotalKopecks:
          type: integer
          format: int64
        expenseTotalKopecks:
          type: integer
          format: int64
        categories:
          type: array
          items:
            $ref: '#/components/schemas/OperationsSummaryCategory'

    TaskRepeat:
      type: string
      enum: [once, daily, weekly, monthly, yearly]
      description: >
        How often the rule produces tasks. Parameters (weekday sets,
        day-of-month lists) do not exist in v1 — the anchor date alone drives
        the schedule: weekly keeps the anchor's weekday, monthly/yearly clamp
        to the month's length (the 31st → 28/29, February 29 → 28).

    TaskTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Wall-clock time HH:MM at minute precision; seconds never enter the system.

    TaskRuleCreateRequest:
      description: >
        The task rule create payload. The date is optional — an undated rule
        (only once) produces a single dateless task («Без срока») that
        materializes immediately; the time requires the date; a repeat other
        than once requires the date.
      type: object
      required: [title, repeat]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        comment:
          type: string
          maxLength: 1000
        dueDate:
          type: string
          format: date
        dueTime:
          $ref: '#/components/schemas/TaskTime'
        repeat:
          $ref: '#/components/schemas/TaskRepeat'

    TaskRuleUpdateRequest:
      description: >
        Partial rule update: an omitted field is left unchanged; comment,
        dueDate and dueTime are tri-state — null clears them.
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        comment:
          type: string
          maxLength: 1000
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        # nullable рядом с $ref генераторы OpenAPI игнорируют — оборачиваем
        # в allOf, чтобы три-стейт dueTime дошёл до клиентов (#502).
        dueTime:
          allOf:
            - $ref: '#/components/schemas/TaskTime'
          nullable: true
        repeat:
          $ref: '#/components/schemas/TaskRepeat'

    TaskRuleResponse:
      description: >
        One task rule: the setting that produces tasks. It is never itself
        completed, overdue or undated — those are states of its tasks.
        propertyId null marks the property-less slice (ADR 0052): the rule
        lives in the owner's own book.
      type: object
      required: [id, propertyId, title, comment, dueDate, dueTime, repeat, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: The bound property; null = the rule without a property (ADR 0052).
        title:
          type: string
        comment:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
          description: The rule's anchor — the first occurrence date; null = undated (once only).
        dueTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          nullable: true
          description: Wall-clock time HH:MM at minute precision; null = the date only.
        repeat:
          $ref: '#/components/schemas/TaskRepeat'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskResponse:
      description: >
        One task — a rule occurrence and the unit that gets completed by
        hand. title/comment/dueDate/dueTime are snapshots taken at
        materialization; status is the server-computed view bucket (active,
        overdue — from the due minute inclusive, or from the end of the day
        for a date-only task; undated; completed).
      type: object
      required: [id, propertyId, ruleId, dueDate, dueTime, title, comment, repeat, completedDate, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
          nullable: true
          description: The bound property, snapshotted at materialization; null = the task without a property (ADR 0052).
        propertyName:
          type: string
          nullable: true
          description: >
            The display name of the bound property — the global screen's row
            label (list projection only, filled on the global listing; null
            elsewhere — the property screen resolves the property by its id).
        ruleId:
          type: string
          format: uuid
          nullable: true
          description: The producing rule; null marks it deleted (the journal row is read-only).
        dueDate:
          type: string
          format: date
          nullable: true
        dueTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          nullable: true
          description: Snapshot of the rule's due time; null = the date only.
        title:
          type: string
        comment:
          type: string
          nullable: true
        repeat:
          allOf:
            - $ref: '#/components/schemas/TaskRepeat'
          nullable: true
          description: >
            The producing rule's repeat as of the read — the screen's ↻ mark.
            Read through the live rule, not snapshotted: null once the rule
            is deleted (the journal row keeps its content snapshots, not the
            rule's settings).
        completedDate:
          type: string
          format: date
          nullable: true
          description: The completion fact; it may differ from the due date.
        status:
          type: string
          enum: [active, overdue, undated, completed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TasksResponse:
      description: >
        One tasks page: the items of the requested bucket, its total count
        (the «Выполненные N» counter) and the data owner's today — the day
        boundary for the «Сегодня»/«Завтра» sections.
      type: object
      required: [items, total, today]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskResponse'
        total:
          type: integer
          description: The total count of the same bucket (not the page).
        today:
          type: string
          format: date
          description: The data owner's current date (ADR 0048).

    PropertyAccessMemberRole:
      type: string
      enum: [owner, full_access, viewer]
      description: >
        The participant's role on a property. `owner` is the object owner
        (synthesized, never stored as a membership); `full_access` and
        `viewer` are granted memberships.

    PropertyAccessMemberResponse:
      type: object
      required: [user_id, role, is_owner, status]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: >
            Membership id; null for the synthesized owner row. For a pending
            invitation row this is the invitation id.
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Participant user id; null for a pending invitation row.
        email:
          type: string
          format: email
          nullable: true
          description: >
            The participant's email address. Filled on every row the reader
            may see — registered participants and pending invitations alike
            (owner decision 2026-09-20, #758: nothing is hidden from
            viewers); null when the address did not resolve.
        role:
          $ref: '#/components/schemas/PropertyAccessMemberRole'
        is_owner:
          type: boolean
        display_name:
          type: string
          description: >
            Participant display name (name and surname, or the anonymous
            label «Пользователь» — карта #1105, аменд #1123). Never a phone,
            never an email.
        status:
          type: string
          enum: [active, suspended, pending]
          description: >
            Membership lifecycle status. "suspended" means the recipient's
            tariff slot was exceeded, so the object is hidden from the
            recipient's list and grants no access until a slot frees up.
            "pending" is an email invitation waiting for the invitee to
            register.
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: When the membership was suspended; null when active.
        last_sent_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the invite email was last sent; filled only on pending
            invitation rows.

    PropertyAccessMembersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyAccessMemberResponse'

    PropertyAccessMemberCreateRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
          description: Registered user to grant access to.
        role:
          type: string
          enum: [full_access, viewer]

    PropertyAccessInvitationCreateRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          description: >
            Invitee email. A registered email activates the membership
            instantly; an unregistered email becomes a pending invitation.
        role:
          type: string
          enum: [full_access, viewer]

    ParticipantsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantResponse'

    ParticipantResponse:
      type: object
      required: [id, aggregate_status, accessible_properties_count, properties]
      properties:
        id:
          type: string
          description: >
            The stable person identifier to address this aggregate by: the
            registered user's uuid, or the invitee email for a pending row.
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Registered user id; null for a pending email row.
        email:
          type: string
          format: email
          nullable: true
          description: >
            The invitee email of a pending row; for a registered user, their
            email resolved for display (null when the user has none).
        display_name:
          type: string
          nullable: true
          description: >
            The person's display name (name and surname, or the anonymous
            label «Пользователь» — карта #1105, аменд #1123);
            null for a pending row (the email is the label).
        aggregate_status:
          type: string
          enum: [all_properties, partial, limit_exceeded]
          description: >
            The aggregate badge (issue #693): "all_properties" — active access
            to every property in the reading scope; "partial" — active access
            to accessible_properties_count of them; "limit_exceeded" — at
            least one suspended membership (the recipient's tariff limit was
            hit). Display copy: «Доступ ко всем объектам» / «Доступно N
            объектов» / «Превышен лимит объектов».
        accessible_properties_count:
          type: integer
          description: The number of properties with active access.
        properties:
          type: array
          description: The person's access legs on the reading scope's properties.
          items:
            $ref: '#/components/schemas/ParticipantPropertyResponse'

    ParticipantPropertyResponse:
      type: object
      required: [property_id, title, role, status]
      properties:
        property_id:
          type: string
          format: uuid
        title:
          type: string
        role:
          type: string
          enum: [full_access, viewer]
        status:
          type: string
          enum: [active, suspended, pending]
          description: >
            The access lifecycle on this property: "active"/"suspended"
            memberships, "pending" email invitation.

    ParticipantsSummaryResponse:
      type: object
      required: [participants_count, accessible_properties_count]
      properties:
        participants_count:
          type: integer
          description: The reading actor's participants across their scope.
        accessible_properties_count:
          type: integer
          description: >
            Other people's objects the reading actor has active access to
            (the recipient tariff-slot counter; issue #163).

    PropertyAccessMemberUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [full_access, viewer]

    ParticipantInviteRequest:
      type: object
      required: [email, role, property_ids]
      properties:
        email:
          type: string
          format: email
          description: >
            Invitee email. A registered email activates memberships instantly;
            an unregistered email becomes pending invitations plus one invite
            email listing the objects. The actor's own email is rejected.
        role:
          type: string
          enum: [full_access, viewer]
        property_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: >
            The objects to grant access to — a snapshot chosen at invite
            time. Duplicate ids collapse to the first occurrence.

    ParticipantPropertiesAddRequest:
      type: object
      required: [role, property_ids]
      properties:
        role:
          type: string
          enum: [full_access, viewer]
        property_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: >
            The objects to add to the participant's existing access — a
            snapshot chosen at grant time. Duplicate ids collapse to the
            first occurrence.

    ParticipantGrantOutcome:
      type: string
      enum: [active, suspended, pending, skipped_duplicate, skipped_archived, skipped_owner, skipped_unavailable]
      description: >
        The per-property result of a participant grant. "active"/"suspended"
        — a membership was created (the recipient's tariff slot was free /
        exhausted); "pending" — an invitation was stored and the invite email
        will be sent; "skipped_duplicate" — the person already holds access
        or a pending invitation on the property; "skipped_archived" — the
        property is archived (granting new access is forbidden); 
        "skipped_owner" — the target is the property's owner themself;
        "skipped_unavailable" — the property is not in the reading actor's
        manage scope (unknown, foreign, or otherwise unmanageable).

    ParticipantGrantResult:
      type: object
      required: [property_id, outcome]
      properties:
        property_id:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/ParticipantGrantOutcome'
        membership_id:
          type: string
          format: uuid
          nullable: true
          description: The created membership id; set only for active/suspended.
        invitation_id:
          type: string
          format: uuid
          nullable: true
          description: The created invitation id; set only for pending.

    ParticipantGrantResultsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantGrantResult'

    PropertiesResponse:
      type: object
      required: [items, today]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyResponse'
        today:
          type: string
          format: date
          description: >
            The reading actor's calendar date (ADR 0048) — the «today» the
            client counts the «Осталось N месяцев» rental badge against
            (ticket #586; the tasks feed's today rule, #521).
        suspended_shared:
          type: array
          description: >
            The reading actor's suspended shared memberships, FIFO order
            (ticket #702): shared objects hidden from them by a tariff slot
            shortage, returned as blur-card placeholders («Объект
            недоступен») instead of the hidden_shared_count footnote they
            replace. Empty for owners and recipients within their limit.
          items:
            $ref: '#/components/schemas/SuspendedSharedProperty'

    SuspendedSharedProperty:
      description: >
        A suspended shared membership of the reading actor (ticket #702): the
        blur-card of an object temporarily unavailable because the actor's
        tariff limit is exceeded. The card renders for real under the blur
        (Figma 2213-99113) — the payload carries the object's own title and
        address plus the owner contact the reason sheet renders (Figma
        2229-100002).
      type: object
      required: [property_id, access_role, name, address, owner_name, owner_email]
      properties:
        property_id:
          type: string
          format: uuid
        access_role:
          type: string
          enum: [full_access, viewer]
          description: The recipient's role on the suspended access.
        name:
          type: string
          description: The object's title — the blurred card renders it.
        address:
          type: string
          description: The object's address — the blurred card renders it.
        owner_name:
          type: string
          description: >
            The owner's public display name («Имя Фамилия» or the anonymous
            label «Пользователь» — карта #1105, аменд #1123).
        owner_email:
          type: string
          description: >
            The owner's account email for the reason sheet's contact row — a
            deliberate exposure for this surface (Figma 2229-100002): the
            recipient needs the contact to resolve the suspension with the
            owner. Empty when the owner has no email.

    PropertiesSearchResponse:
      description: >
        The properties search page (ticket #601): the matched cards in the
        keyset window's order.
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PropertyResponse'
        nextCursor:
          type: string
          nullable: true
          description: >
            The opaque continuation cursor of the keyset window (ticket
            #601): pass it back as the cursor query parameter to fetch the
            next page. null — the matches are exhausted.

    PropertyType:
      type: string
      enum: [apartment, room, apartments, studio, house, commercial, office, warehouse, garage, parking, land]

    PropertyStatus:
      type: string
      enum: [active, maintenance, archived]

    SubscriptionStatus:
      type: string
      enum: [active, grace, cancelled]

    SubscriptionPaymentStatus:
      type: string
      enum: [pending, succeeded, failed, refunded, refunding]
      description: >-
        Lifecycle states of a subscription payment. Refunds are full-amount
        only (ADR 0037): the legacy partial_refunded is not part of the
        vocabulary, refunding is the internal reservation shown to the user
        as pending.

    AdminSubscriptionPaymentPeriod:
      type: string
      enum: [month, year]

    TariffName:
      type: string
      enum: [basic, pro, business]

    VapidPublicKeyResponse:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The application server's VAPID P-256 public key, base64url without padding (RFC 8292). Pass this to `pushManager.subscribe({ applicationServerKey })`.

    PushSubscriptionCreateRequest:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
          description: The push endpoint URL issued by the browser push service.
          maxLength: 2048
        p256dh:
          type: string
          description: The client ECDH P-256 public key, base64url (RFC 8291).
          maxLength: 512
        auth:
          type: string
          description: The per-subscription auth secret, base64url (RFC 8291).
          maxLength: 512
        expiration_time:
          type: string
          format: date-time
          nullable: true
          description: Optional subscription expiration instant reported by the browser (RFC 8030).
        categories:
          $ref: '#/components/schemas/NotificationCategoryPreferences'

    PushSubscriptionDeleteRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string
          description: The push endpoint URL to unregister (same value sent on subscribe).
          maxLength: 2048

    PushSubscriptionResponse:
      type: object
      required: [id, endpoint, created_at, updated_at, categories]
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          type: string
        categories:
          $ref: '#/components/schemas/NotificationCategoryPreferences'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PushPreferencesRequest:
      type: object
      required: [endpoint, categories]
      properties:
        endpoint:
          type: string
          description: Push endpoint URL устройства (тот же, что при подписке).
          maxLength: 2048
        categories:
          $ref: '#/components/schemas/NotificationCategoryPreferences'

    PushPreferencesResponse:
      type: object
      description: >-
        Состояние устройства (спека #1028): категорийные флаги подписки;
        сам факт 200 = подписка есть = мастер-тумблер устройства включён
        («строка есть = включено»), 404 = выключено.
      required: [endpoint, categories]
      properties:
        endpoint:
          type: string
        categories:
          $ref: '#/components/schemas/NotificationCategoryPreferences'

    NotificationCategoryPreferences:
      type: object
      description: >-
        Флаги четырёх настраиваемых категорий одного канала (решение #738) —
        email держит копию на аккаунте, push — на устройстве. Тариф и
        Системные всегда включены и здесь не хранятся.
      required: [rental, payments_operations, tasks, shared_access]
      properties:
        rental:
          type: boolean
        payments_operations:
          type: boolean
        tasks:
          type: boolean
        shared_access:
          type: boolean

    NotificationPreferencesRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/NotificationCategoryPreferences'

    NotificationPreferencesResponse:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/NotificationCategoryPreferences'

    NotificationItem:
      type: object
      description: >-
        Строка ленты одного получателя (решение #737): снимок текста,
        payload-ссылки, личные флаги.
      required: [id, event_type, category, title, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
          description: |
            Тип события каталога v1 (решение #737).
          example: payment_due
        category:
          type: string
          description: Категория уведомлений (группа настроек и иконка).
          example: payments_operations
        title:
          type: string
        body:
          type: string
        context_label:
          type: string
          nullable: true
          description: |
            Строка над заголовком — имя объекта/тарифа или «Системные уведомления».
        created_at:
          type: string
          format: date-time
          description: |
            Момент события, UTC instant; группировка «Сегодня/Вчера» — дело экрана.
        read_at:
          type: string
          format: date-time
          nullable: true

    NotificationDetailResponse:
      type: object
      required: [id, event_type, category, title, body, payload, actions, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        category:
          type: string
        title:
          type: string
        body:
          type: string
        context_label:
          type: string
          nullable: true
        payload:
          type: object
          description: |
            Payload-ссылки и снимки имён (решение #737): property {id, name,
            address}, actor {id, name, email}, rental_id, payment_id, payment_date,
            task_id, task_rule_id, membership_id, tariff {slug,
            period, amount_kopecks, active_until}. address и email — снимки
            карточек (решение владельца 19.09.2026, #745): строка карточки,
            которой нет в снимке, просто не рендерится. payment_id — id правила,
            payment_date — дата операции (решение #737: payment = правило +
            дата операции, #749). task_rule_id — правило задачи: экран задачи —
            экран её правила, переход ведёт по нему (#750). События доступа
            (#751) несут membership_id — сущность перехода, переживающую
            снесённое приглашение.
            Все поля опциональны; суммы — BIGINT копейки.
        actions:
          type: array
          description: |
            Действия, доступные этому читателю сейчас (вычислены при чтении, решение #737).
          items:
            $ref: '#/components/schemas/NotificationAction'
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true

    NotificationAction:
      type: string
      description: |
        Кнопка-переход на экран сущности, никогда не мутация (решение #737).
      enum:
        - rental_extend
        - rental_complete
        - open_payment
        - open_task
        - open_property
        - open_property_members
        - open_tariffs
        - open_payment_methods

    NotificationsPageResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        next_cursor:
          type: string
          description: |
            Непрозрачный курсор следующей страницы; отсутствует в конце ленты.

    HistoryPageResponse:
      type: object
      description: Страница ленты «История действий» (двусторонний keyset, ADR 0061 §7).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        next_cursor:
          type: string
          description: |
            Непрозрачный курсор страницы СТАРШЕ (в before_cursor следующего
            запроса): продолжение ленты в прошлое. Отсутствует на пустой или
            неполной странице — дальше старше ничего нет.
        prev_cursor:
          type: string
          description: |
            Непрозрачный курсор страницы МОЛОЖЕ (в after_cursor следующего
            запроса): prepend записей, появившихся после загрузки видимых.
            Отсутствует только на пустой странице.

    HistoryItem:
      type: object
      description: |
        Одна строка ленты — снимок действия при записи (ADR 0061 §3–§6).
        Переименования и удаления сущность-строку не меняют; у удалённой
        сущности сегмент остаётся без ссылки. Отдельного эндпоинта деталей
        нет — payload строки полон, «детали» = существующие страницы сущностей
        по ссылкам сегментов (тикет #713).
      required:
        - id
        - property_id
        - property_name
        - actor_name
        - actor_email
        - actor_role
        - kind
        - action
        - base_action
        - segments
        - context
        - created_at
      properties:
        id:
          type: string
          format: uuid
        property_id:
          type: string
          format: uuid
        property_name:
          type: string
          description: Название объекта для шапки группы ленты (снимок живого названия — читается при чтении).
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Актёр действия; null — пользователь удалён (запись обезличена,
            снимки при этом остаются). Под фильтр actor_ids такие записи не
            попадают.
        actor_name:
          type: string
          description: Снимок отображаемого имени актёра на момент действия.
        actor_email:
          type: string
          description: Снимок почты актёра (видна всем участникам, решение 2026-09-20); '' — почты не было.
        actor_role:
          type: string
          enum: [owner, full_access, viewer]
          description: Роль актёра на объекте в момент действия (снимок, ADR 0061 §4).
        kind:
          type: string
          enum: [property, rental, payment, operation, contact, task, member]
          description: Вид действия — группа чекбоксов фильтра и маршрутизатор ссылок сегментов.
        action:
          type: string
          description: Стабильный точечный id действия (ADR 0061 §4), например property.renamed, operation.paid.
          example: operation.paid
        base_action:
          type: string
          enum: [added, changed, completed, deleted]
          description: Основное действие — группа фильтра, иконка и цвет строки.
        segments:
          type: array
          description: |
            Текст строки, собранный сервером при записи (ADR 0061 §6): экран
            рендерит фрагменты дословно, склеивая в одно предложение, и
            оборачивает связанные; дословность — про строки после стрипа,
            у записанных до него экран при маппинге срезает легаси голые
            хвосты дат (аудит #876). Актёра в тексте нет — он поле записи.
          items:
            $ref: '#/components/schemas/HistorySegment'
        context:
          type: object
          description: |
            Структурные дополнения действия (ADR 0061 §5): суммы — BIGINT
            копейки, даты, old/new значения; ключи зависят от действия.
            Текстом строки не является и в поиске не участвует.
        created_at:
          type: string
          format: date-time
          description: Момент действия, UTC instant; группировка «Сегодня/Вчера» — дело экрана.

    HistorySegment:
      type: object
      description: |
        Один фрагмент текста строки; видимое предложение — точная склейка
        текстов; дословность — про строки после стрипа, у записанных до
        него экран при маппинге срезает легаси голые хвосты дат (аудит #876).
      required: [text]
      properties:
        text:
          type: string
        link:
          $ref: '#/components/schemas/HistorySegmentLink'

    HistorySegmentLink:
      type: object
      description: |
        Ссылка фрагмента на страницу сущности (синие переходы, тикет #713);
        отсутствует у несвязанных фрагментов и у строк удалённых сущностей.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [property, rental, payment, operation, contact, task, member]
        id:
          type: string
          format: uuid

    HistoryFiltersResponse:
      type: object
      description: Опции шита фильтров «Истории действий» в области чтения (ADR 0061 §7).
      required: [participants, objects]
      properties:
        participants:
          type: array
          description: |
            Владелец и текущие участники области ∪ все актёры журнала области
            (отозванные остаются фильтруемыми). Именованные пользователи — по
            алфавиту имени, затем фамилии; безымянные (name — полный
            телефон) — в конце списка: сортировка по исходным колонкам, а не
            по отображаемому имени.
          items:
            $ref: '#/components/schemas/HistoryParticipant'
        objects:
          type: array
          description: Объекты области с фото-аватаром; отсортированы по названию.
          items:
            $ref: '#/components/schemas/HistoryObject'

    HistoryParticipant:
      type: object
      description: |
        Участник-вариант фильтра. name — канон отображаемого имени платформы
        («Имя Фамилия», иначе «Пользователь» — карта #1105, аменд #1123); email — текущая
        почта пользователя; first_name — имя без фамилии для строки «(Вы)»;
        is_owner — замок владельца объектов (макет 2067-163528); role —
        иконка роли строки (макет 2184-94261): максимальный доступ в области,
        живое членство сильнее снимка журнала отозванного участника.
      required: [id, name, email, first_name, is_owner, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          description: Текущая почта; '' — почты нет.
        first_name:
          type: string
          description: Имя без фамилии; '' — имени нет (тогда name — «Пользователь»).
        is_owner:
          type: boolean
          description: Пользователь владеет хотя бы одним объектом области чтения.
        role:
          type: string
          enum: [owner, full_access, viewer]
          description: Максимальная роль в области чтения (owner совпадает с is_owner по построению).

    HistoryObject:
      type: object
      description: "Объект-вариант фильтра с фото-аватаром карточки (первое по времени фото, #582)."
      required: [id, name, address, photo_url]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        photo_url:
          type: string
          description: URL первого по времени фото; '' — фото нет.

    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64

    PendingPopupsResponse:
      type: object
      required: [popups]
      properties:
        popups:
          type: array
          items:
            type: string

    ClientErrorReport:
      type: object
      required: [app, message]
      properties:
        app:
          type: string
          enum: [frontend, admin, landing]
          description: Application that reported the error
        message:
          type: string
          maxLength: 500
          description: Error message reported by the browser
        stack:
          type: string
          maxLength: 4000
          description: Optional stack trace
        url:
          type: string
          maxLength: 500
          description: Page URL where the error occurred

    FeedbackRequest:
      type: object
      required: [email, message]
      properties:
        email:
          type: string
          maxLength: 254
          description: Reply address of the sender
        message:
          type: string
          maxLength: 1000
          description: Feedback question text

    RentalPaymentDay:
      description: >-
        День оплаты аренды: число месяца 1–31 или строка "last" — «последний
        день месяца». «31-е число» и "last" — одно поведение: в коротком
        месяце прижимается к последнему дню (ADR 0053 §4).
      oneOf:
        - type: integer
          minimum: 1
          maximum: 31
        - type: string
          enum: [last]

    RentalCreateRequest:
      description: >-
        Создание аренды (= атомарное создание её Платежа арендной платы).
        Начало — сегодня или позже по TZ собственника (задним числом аренда
        не создаётся); плановое окончание — строго позже начала.
      type: object
      required: [amountKopecks, paymentDay, startDate, utilities, autoPay]
      properties:
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        paymentDay:
          $ref: '#/components/schemas/RentalPaymentDay'
        startDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
          nullable: true
          description: >
            Null/omitted — бессрочная аренда. Не раньше первого вхождения
            платежа аренды (monthly по дню оплаты от старта, тикет #1154):
            такой срок держал бы ноль платежей.
        utilities:
          type: string
          enum: [included, meters_only, full_receipt]
        depositKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          nullable: true
        commissionKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          nullable: true
        contactId:
          type: string
          format: uuid
          nullable: true
          description: Арендатор — контакт из книги владельца скоупа.
        comment:
          type: string
          maxLength: 2000
        autoPay:
          type: boolean
        reminderOffsetDays:
          type: integer
          nullable: true
          enum: [1, 3, 7]
          description: >-
            За сколько дней предупреждать о платеже арендной платы
            («Напоминание о платеже», карта #822): 1, 3 или 7. Null/omitted —
            напоминаний нет. Аренда ставит его вместе с автоплатежом; по
            макетам дефолт выбора на экране — «За 1 день» (решение #823).

    RentalUpdateRequest:
      description: >-
        Частичная правка условий аренды. Начало не правится. Nullable-поля
        (plannedEndDate, depositKopecks, commissionKopecks, contactId, comment)
        — tri-state: omitted оставляет значение, явный null очищает. Сумма,
        день оплаты, автоплатёж и плановое окончание синхронно правят Платёж
        арендной платы. Завершённая аренда — 409.
      type: object
      properties:
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
        paymentDay:
          $ref: '#/components/schemas/RentalPaymentDay'
        autoPay:
          type: boolean
        plannedEndDate:
          type: string
          format: date
          nullable: true
          description: >
            Явный null — аренда становится бессрочной; не в прошлое
            (≥ today, > начала). Окно графика (тикет #1154): слитая пара
            «день оплаты + плановое окончание» целиком — смена дня
            перепроверяет стоящее окончание, смена окончания сверяется с
            хранящимся днём; раньше первого вхождения дня оплаты — 400.
        utilities:
          type: string
          enum: [included, meters_only, full_receipt]
        depositKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          nullable: true
        commissionKopecks:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          nullable: true
        contactId:
          type: string
          format: uuid
          nullable: true
          description: Явный null — «Контакта нет».
        comment:
          type: string
          maxLength: 2000
          nullable: true

    RentalCompleteRequest:
      description: >-
        Завершение аренды: фактическая дата (начало ≤ дата ≤ сегодня; «По
        плану» подставляет клиент) и опциональный возврат залога.
      type: object
      required: [completedDate]
      properties:
        completedDate:
          type: string
          format: date
        depositReturn:
          type: object
          required: [amountKopecks]
          properties:
            amountKopecks:
              type: integer
              format: int64
              minimum: 0
              maximum: 1000000000
              description: 0 валиден — «не вернул».
            comment:
              type: string
              description: Только при сумме.

    TenantView:
      description: >-
        Встроенный арендатор — поля карточки контакта. После удаления контакта
        — null без пометки: UI пишет «Контакта нет» (решение #528).
      type: object
      required: [contactId, firstName, lastName, phone]
      properties:
        contactId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string

    RentalNextPayment:
      description: Единственное будущее planned-вхождение Платежа арендной платы.
      type: object
      required: [operationId, date, amountKopecks, daysUntil]
      properties:
        operationId:
          type: string
          format: uuid
          description: Цель существующего «Оплатить платёж» — POST /properties/{propertyId}/operations/{operationId}/pay.
        date:
          type: string
          format: date
        amountKopecks:
          type: integer
          format: int64
        daysUntil:
          type: integer
          description: date − today по TZ собственника.

    RentalProgress:
      description: >-
        Прогресс «Оплачено N из M месяцев» (ADR 0053 §2): paidMonths — число
        paid-операций Платежа; totalMonths и monthsRemaining — только у
        срочной аренды (null у бессрочной). overdueMonths — серверная
        просрочка Платежа арендной платы (#817): число planned-вхождений
        раньше «сегодня» собственника (платёжные месяцы, не календарные);
        null — просрочки нет.
      type: object
      required: [paidMonths, totalMonths, monthsRemaining, overdueMonths]
      properties:
        paidMonths:
          type: integer
        totalMonths:
          type: integer
          nullable: true
        monthsRemaining:
          type: integer
          nullable: true
        overdueMonths:
          type: integer
          nullable: true

    RentalPaymentView:
      description: >-
        Состояние Платежа арендной платы: рендер читается из платежа — дня
        оплаты на аренде нет (решение №5). paymentId — переход на экран
        платежа с детализации аренды (#531): платеж не ищется слагом
        категории, на объекте бывают и другие платежи rent. Ревизия #1161:
        у завершённой аренды платёж удалён — paymentId null, а сумма и день
        оплаты приходят из Архива условий на аренде; nextPayment всегда null.
      type: object
      required: [paymentId, amountKopecks, paymentDay, autoPay]
      properties:
        paymentId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Управляемый арендой Платёж — связь 1:1 (ADR 0053 §1); null у
            завершённой аренды — платёж удалён при Завершении (ревизия #1161).
        amountKopecks:
          type: integer
          format: int64
        paymentDay:
          $ref: '#/components/schemas/RentalPaymentDay'
        autoPay:
          type: boolean
        reminderOffsetDays:
          type: integer
          nullable: true
          enum: [1, 3, 7]
          description: >-
            Lead time of the managed payment's reminder (карта #822); null —
            напоминаний нет.
        nextPayment:
          $ref: '#/components/schemas/RentalNextPayment'
          nullable: true
          description: Null, когда будущего вхождения нет (после планового окончания, у завершённой).

    RentalResponse:
      description: >-
        Аренда с вычисляемым сервером состоянием: статус, прогресс, будущее
        плановое вхождение и today — клиент пояса не знает (ADR 0053 §2).
      type: object
      required: [id, propertyId, status, startDate, completedDate, utilities,
                 depositKopecks, commissionKopecks, depositReturnKopecks,
                 depositReturnComment, comment, rentPayment, progress,
                 today, createdAt]
      properties:
        id:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        status:
          type: string
          enum: [upcoming, active, needs_attention, completed]
        startDate:
          type: string
          format: date
        plannedEndDate:
          type: string
          format: date
          nullable: true
        completedDate:
          type: string
          format: date
          nullable: true
        utilities:
          type: string
          enum: [included, meters_only, full_receipt]
        depositKopecks:
          type: integer
          format: int64
          nullable: true
        commissionKopecks:
          type: integer
          format: int64
          nullable: true
        depositReturnKopecks:
          type: integer
          format: int64
          nullable: true
        depositReturnComment:
          type: string
          nullable: true
        tenant:
          $ref: '#/components/schemas/TenantView'
          nullable: true
        comment:
          type: string
        rentPayment:
          $ref: '#/components/schemas/RentalPaymentView'
        progress:
          $ref: '#/components/schemas/RentalProgress'
        today:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    RentalsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RentalResponse'

    RentalSummaryResponse:
      description: >-
        Итоги аренды (решение №13): все paid-операции объекта — любого
        платежа и ручные — с датой вхождения в периоде [startDate, until];
        период — по дате вхождения. Прибыль = доходы − расходы, может быть
        отрицательной.
      type: object
      required: [from, until, incomeKopecks, expenseKopecks, profitKopecks]
      properties:
        from:
          type: string
          format: date
        until:
          type: string
          format: date
        incomeKopecks:
          type: integer
          format: int64
        expenseKopecks:
          type: integer
          format: int64
        profitKopecks:
          type: integer
          format: int64

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          description: Seconds to wait before retrying the request
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: Gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    SubscriptionBlocked:
      description: Subscription is blocked; renew to continue mutating data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    SubscriptionConflict:
      description: >-
        Conflict. `pending_payment_exists` — a live pending payment holds the
        user's tariff decision (issue #616): the tariff change, the
        cancellation and the resume stay locked until the payment resolves or
        expires. `invalid_keep_property` — the cancellation's keepPropertyId
        is not one of the owner's active properties (issue #617).
        `resume_not_available` — the resume endpoint was called on a
        subscription that is not cancelled or whose paid period has already
        expired: restoration of an expired period goes through paying for a
        tariff (issue #617). `resume_required` — the tariff change asked a
        cancelled subscription with a live paid remainder to pay for the
        tariff and period it is already on: the paid remainder is kept only
        through the free resume (issue #691).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    MembershipSuspended:
      description: >-
        Access to the property is suspended because the recipient's tariff
        active-property limit is exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: "Доступ к объекту приостановлен: превышен лимит объектов по тарифу"
            code: membership_suspended
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
