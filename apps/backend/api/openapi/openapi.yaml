      security:
        - sessionCookie: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task reopened (status is the server-computed view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /operations:
    get:
      operationId: listOperations
      summary: List the actor's visible paid operations (the global «Операции» screen)
      description: >
        The global read side of the operations context (ticket #540). The
        response is the actor's visible merged feed: the paid operations of
        their own properties plus those of the properties they can view
        (ADR 0028; an actor-scoped cross-property read — the visibility
        predicate lives in the store's SQL, the tasks global feed's rule).
        The feed is paid-only: planned and overdue occurrences are the
        property screens' vocabulary, cancelled operations do not exist for
        reads. The operations of archived properties are not in the feed
        unless includeArchived lifts the cut (#549).
        The propertyIds filter narrows the feed to the listed properties,
        each resolved through its view gate — an unknown or non-visible id
        is the privacy 404. Every row carries propertyName, the bound
        property's display name. The period, search, type and category
        vocabulary is the property listing's; the window is keyset
        pagination over the listing's sort key and id (ticket #597): rows
        shifting between loads never duplicate or drop — pass the previous
        page's nextCursor back as cursor (the cursor is bound to the sort
        it was issued under). Reads never tick.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OperationsPropertyIdsFilter'
        - $ref: '#/components/parameters/OperationsDateFrom'
        - $ref: '#/components/parameters/OperationsDateTo'
        - $ref: '#/components/parameters/OperationsSearch'
        - $ref: '#/components/parameters/OperationsTypeFilter'
        - $ref: '#/components/parameters/OperationsIncludeArchived'
        - $ref: '#/components/parameters/OperationsCategoriesFilter'
        - $ref: '#/components/parameters/OperationsSort'
        - $ref: '#/components/parameters/OperationsOrder'
        - $ref: '#/components/parameters/OperationsLimit'
        - $ref: '#/components/parameters/OperationsCursor'
      responses:
        '200':
          description: >
            Paid operations page. status is always paid (the feed's only
            view status); propertyName is the bound property's display name;
            nextCursor carries the next page's continuation (null — the feed
            is exhausted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /operations/summary:
    get:
      operationId: summarizeOperations
      summary: Summarize the actor's visible paid operations (the global «Операции» screen)
      description: >
        The global twin of the property operations summary (ticket #540) over
        the same visible merged feed as GET /operations: paid operations of
        the actor's own properties plus the properties they can view, the
        archived ones excluded. The propertyIds filter and the period narrow
        the whole scope — totals and the category breakdown alike; the type
        filter narrows only the categories array, the totals always report
        both directions; the category filter narrows the whole scope too —
        the totals and the breakdown alike, the card mirroring the filtered
        list (решение владельца 01.10). Search is the listing's predicate —
        the summary of the searched scope stays consistent with its list.
        The period reads the listing's date key (see sort).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OperationsPropertyIdsFilter'
        - $ref: '#/components/parameters/OperationsDateFrom'
        - $ref: '#/components/parameters/OperationsDateTo'
        - $ref: '#/components/parameters/OperationsSort'
        - $ref: '#/components/parameters/OperationsSearch'
        - $ref: '#/components/parameters/OperationsTypeFilter'
        - $ref: '#/components/parameters/OperationsIncludeArchived'
        - $ref: '#/components/parameters/OperationsCategoriesFilter'
      responses:
        '200':
          description: >-
            Period totals of the visible paid operations by direction plus the
            per-category breakdown. The totals always report both directions —
            the summary cards read them together — while the type and category
            filters narrow only the categories array. Categories with no
            operations in scope are absent; the array is ordered by total,
            largest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments:
    get:
      operationId: listGlobalPayments
      summary: List the actor's visible payment rules (the global «Платежи» screen)
      description: >
        The global read side of the payment rules (ticket #575). The response
        is the actor's visible merged feed: every rule of their own properties
        plus the rules of the properties they can view with an active
        membership (ADR 0028; an actor-scoped cross-property read — the
        visibility predicate lives in the store's SQL, the tasks global
        feed's rule, ticket #521). The rules of archived properties are not
        in the feed. Every row carries the bound property's display name, the
        nearest schedule date («Ближайший»: the earliest stored planned
        operation on or after the owner's today, else the rule's projection —
        a bare schedule order, no view status) and the overdue aggregates:
        the count of the rule's overdue operations and the age of the oldest
        one in days, both computed against the property owner's today
        (ADR 0048) and carried in today so the client renders
        «Сегодня»/«Завтра» without knowing the owner's timezone. favoriteCount
        counts the favorite rules of the whole visible scope and
        overdueOperationsCount sums the overdue operations across it — the
        «Все избранные (N)» and «Все просроченные (N)» cards of the main
        screen; neither depends on a search. Reminders and «На оплату» do not
        exist in this contract (out of scope of map #573). Reads never tick.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: >
            The visible rules feed with the main screen's counters. Paused or
            settled rules travel with a null nearestDate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsGlobalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payments/search:
    get:
      operationId: searchGlobalPayments
      summary: Search the actor's visible payment rules (the global «Платежи» search)
      description: >
        The global feed narrowed by the search query (ticket #575): a
        case-insensitive substring over the rule title and the category — the
        default catalog label of the rule's slug or the user category's
        current name. The row composition is GET /payments's, the counters
        are not part of the search contract. matchedCategories lists the
        distinct categories of the matched rules — the search screen's
        category chips — one row per category (ticket #602), the largest
        match count first. An empty query degenerates to the unfiltered
        feed with every category of the scope. The list runs in pages of 50
        the search
        category of the scope. The list runs in pages of 50 the search
        screen's infinite scroll walks (map #573 rework); the window is
        keyset pagination over (created_at, id) (ticket #597) — the feed's
        own order, stable under renames and creations: rows shifting between
        loads never duplicate or drop, the previous page's nextCursor comes
        back as cursor. Under the
        category/type chip filter the page narrows to the chip's rules while
        matchedCategories always describe the whole matched scope — the
        chips never shrink (the operations' canon).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PaymentsSearchQuery'
        - $ref: '#/components/parameters/PaymentsCategoryFilter'
        - $ref: '#/components/parameters/PaymentsTypeFilter'
        - $ref: '#/components/parameters/PaymentsLimit'
        - $ref: '#/components/parameters/PaymentsCursor'
      responses:
        '200':
          description: >
            The matched rules with their matched-category chips; nextCursor
            carries the next page's continuation (null — the matches are
            exhausted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsSearchGlobalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payments/objects:
    get:
      operationId: listGlobalPaymentObjects
      summary: List the actor's visible properties with their payment stacks (the global «Объекты» screen)
      description: >
        The object cut of the global payments read (ticket #575): the actor's
        visible non-archived properties — own plus shared with an active
        membership — each with its rules grouped into the two stack groups,
        the auto-pay group first, then the rest, every key carrying the
        group's rule id and its overdue flag (the red dot; the property
        owner's today, ADR 0048). The search query filters the objects by a
        case-insensitive substring over the name or the address; the stacks
        always carry the object's every rule whatever the query matched. An
        object without rules yields empty groups. Reads never tick.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PaymentsSearchQuery'
      responses:
        '200':
          description: The visible properties with their rule stacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentObjectsGlobalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /payments/favorites/order:
    put:
      operationId: saveGlobalPaymentFavoritesOrder
      summary: Save the manual order of the actor's favorite payment rules
      description: >
        The favorites edit mode's «Сохранить» (map #573, ticket #576): the
        request lists the actor's visible favorite rules in their new order
        and the server rebuilds the stored positions in one transaction —
        dense 1-based positions in the list order. The save is a full
        replacement: favorites outside the list lose their positions and
        fall to the end of the reading order, so an empty list resets the
        whole order. Every listed id must be a favorite rule visible to the
        actor (own plus active-membership properties, archived excluded):
        an unknown, foreign or otherwise invisible id is the
        privacy-preserving 404, a visible non-favorite or a duplicate id is
        a 400. The write capability is the favorite star's (PUT favorite,
        Full Access and Owner) — a viewer's 403. A rule without a position
        — new and legacy favorites, their favoriteOrder is null — sorts
        last (new-favorite-at-the-end), and PUT favorite maintains that
        invariant atomically: unfavoriting clears the position,
        re-favoriting lands at the end. The manual order is the favorites
        screens' sort key (the feed's own order is unchanged); a pure order
        write — nothing ticks.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentsFavoriteOrderUpdate'
      responses:
        '204':
          description: The order is saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/tasks:
    get:
      operationId: listPropertyTasks
      summary: List the property's tasks (active ones or the completed journal)
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: completed
          in: query
          required: false
          description: >
            The bucket selector: false (default) — the active tasks (the
            screen's Просроченные/Сегодня/даты/Без даты sections), true — the
            completed journal (the collapsible «Выполненные» section). total
            always counts the same bucket.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/TasksLimit'
        - $ref: '#/components/parameters/TasksOffset'
      responses:
        '200':
          description: >
            Tasks page. status is the server-computed view bucket (active,
            overdue, undated, completed) — the client never needs the owner's
            timezone; today is the data owner's current date for the
            «Сегодня»/«Завтра» sections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/tasks/rules:
    post:
      operationId: createTaskRule
      summary: Create a task rule (creating a task is creating a rule)
      description: >
        The first materialization happens in the same call: the undated task
        of an undated rule, every occurrence due today, and the single future
        one. The due date must be today or later in the property owner's
        timezone — backdated rules are rejected.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRuleCreateRequest'
      responses:
        '201':
          description: Task rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /properties/{propertyId}/tasks/rules/{ruleId}:
    get:
      operationId: getTaskRule
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTaskRule
      summary: Partial task rule update
      description: >
        Omitted fields stay unchanged; comment, dueDate and dueTime are
        tri-state (null clears). The edit invalidates the not-yet-due
        uncompleted tasks (the undated and strictly future ones) — the tick
        stands the single future again with fresh snapshots; already due and
        completed tasks keep their frozen snapshots. A newly set due date must
        be today or later.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRuleUpdateRequest'
      responses:
        '200':
          description: Task rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRuleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteTaskRule
      summary: Delete the task rule (hard; not covered by the v1 UI)
      description: >
        Every uncompleted task of the rule — planned, overdue, today's and the
        single future — is physically removed; the completed journal stays
        with its snapshots (ruleId set to null). There is no keep_overdue
        analogue: у задач нет долга.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Task rule deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/tasks/completed:
    delete:
      operationId: deleteCompletedTasks
      summary: «Удалить все выполненные» — clear the completed journal
      description: >
        Removes every completed task of the property forever — the
        deleted-rule journal and the live rules' completed rows alike; rules
        and active tasks are untouched. Each live rule losing rows gets its
        history horizon raised to max(deleted due)+1, so the cleared
        occurrences never materialize again (ADR 0051 as amended 2026-10-01).
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Completed journal cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /properties/{propertyId}/tasks/{taskId}/complete:
    post:
      operationId: completeTask
      summary: «Выполнить» the task
      description: >
        The completion fact is stamped with today in the property owner's
        timezone; a repeated completion is a 409. The rule's schedule is not
        touched.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task completed (status is the server-computed view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /properties/{propertyId}/tasks/{taskId}/uncomplete:
    post:
      operationId: uncompleteTask
      summary: «Отменить выполнение» the task
      description: >
        The completion fact is cleared and the task returns to the active
        ones; the rule's schedule is untouched. Possible only while the rule
        lives — a journal row of a deleted rule is a 409.
      security:
        - sessionCookie: []
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task reopened (status is the server-computed view)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /properties/{propertyId}/access/members:
