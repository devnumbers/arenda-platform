name: arenda-e2e

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: arenda
      POSTGRES_USER: arenda
      POSTGRES_PASSWORD: arenda
    ports:
      # 5436: 5433 занят локальной dev-базой, 5435 — тестовой (compose-проект
      # arenda-test); e2e-среда экранных тестов фронта получает свой порт.
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenda -d arenda"]
      interval: 5s
      timeout: 3s
      retries: 20
