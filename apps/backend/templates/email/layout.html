{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Аренда Платформа</title>
  <style>
    .button:hover {
      background-color: #2175f5 !important;
    }
    @media (max-width: 480px) {
      .card {
        padding: 24px !important;
        border-radius: 10px !important;
      }
      .title {
        font-size: 18px !important;
      }
      .body {
        font-size: 15px !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f3f6; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1e1e1e; -webkit-font-smoothing: antialiased;">
  <div class="wrapper" style="width: 100%; padding: 40px 16px; box-sizing: border-box;">
    <div class="container" style="max-width: 600px; margin: 0 auto;">
      <div class="card" style="background-color: #ffffff; border-radius: 16px; padding: 32px; box-shadow: 0 1px 2px rgba(30, 30, 30, 0.04);">
        {{template "content" .}}
      </div>
      <div class="footer" style="margin-top: 24px; font-size: 12px; line-height: 1.4; color: rgba(30, 30, 30, 0.4); text-align: center;">
        Аренда Платформа
      </div>
    </div>
  </div>
</body>
</html>
{{end}}
