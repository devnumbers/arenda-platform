version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - gocheckcompilerdirectives
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - unconvert
    - wastedassign
  settings:
    depguard:
      rules:
        domain-clean:
          list-mode: lax
          files:
            - internal/**/domain/*.go
            - "!**/*_test.go"
          deny:
            - pkg: database/sql
              desc: domain must stay persistence agnostic
            - pkg: net/http
              desc: domain must stay transport agnostic
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: domain must stay external-service agnostic
            - pkg: github.com/jackc/pgx
              desc: domain must stay persistence agnostic
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/platform
              desc: domain must not depend on platform infrastructure
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/billing/adapters
              desc: domain must not depend on adapters
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/identity/adapters
              desc: domain must not depend on adapters
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/properties/adapters
              desc: domain must not depend on adapters
        application-clean:
          list-mode: lax
          files:
            - internal/**/application/*.go
            - "!**/*_test.go"
          deny:
            - pkg: database/sql
              desc: application layer must use ports instead of concrete persistence
            - pkg: net/http
              desc: application layer must stay transport agnostic
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: application layer must use ports instead of concrete external clients
            - pkg: github.com/jackc/pgx
              desc: application layer must use ports instead of concrete persistence
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/platform
              desc: application layer must not depend on platform infrastructure
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/billing/adapters
              desc: application layer must not depend on adapters
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/identity/adapters
              desc: application layer must not depend on adapters
            - pkg: github.com/nambers/arenda-platform/apps/backend/internal/properties/adapters
              desc: application layer must not depend on adapters
    modernize:
      disable:
        - any
        - fmtappendf
        - forvar
        - mapsloop
        - minmax
        - omitzero
        - plusbuild
        - rangeint
        - reflecttypefor
        - slicescontains
        - slicessort
        - stditerators
        - stringscut
        - stringscutprefix
        - stringsseq
        - stringsbuilder
        - testingcontext
        - unsafefuncs
        - waitgroup
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: strict
    paths:
      - internal/platform/database/db/.*
      - internal/platform/openapi/generated.gen.go
run:
  go: "1.26.0"
  timeout: 5m
