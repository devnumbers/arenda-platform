    AddCardRequest:
      type: object
      required:
        - TerminalKey
        - CustomerKey
        - Token
      properties:
        TerminalKey:
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          type: string
          maxLength: 64
          example: TBankTest
        CustomerKey:
          description: |
            Идентификатор покупателя в системе мерчанта.
          type: string
          maxLength: 255
          example: testCustomer1234
        Token:
          description: |
            Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
          type: string
          example: 30797e66108934dfa3d841b856fdad227c6b9c46d6a39296e02dc800d86d181e
        CheckType:
          description: |
            Если `CheckType` не передается, автоматически проставляется значение `NO`.


             * `NO` — сохранить карту без проверок. `RebillID` для рекуррентных платежей не возвращается.
             * `HOLD` — при сохранении сделать списание на 0 руб. `RebillID` возвращается для терминалов без поддержки 3DS.
             * `3DS` — при сохранении карты выполнить проверку 3DS и выполнить списание на 0 р. `RebillID` будет возвращаться только для карт с поддержкой 3DS. Карты, которые не поддерживают 3DS, привязаны не будут.
             * `3DSHOLD` – при привязке карты выполнить проверку, поддерживает карта 3DS или нет. Если карта не поддерживает 3DS, выполняется списание на 0 руб.
          type: string
          enum:
            - 'NO'
            - HOLD
            - 3DS
            - 3DSHOLD
        IP:
          type: string
          description: |
            IP-адрес покупателя.
          example: 10.100.10.10
        ResidentState:
          description: |
            Признак резидентности добавляемой карты:

            * `true` — карта РФ;
            * `false` — карта не РФ;
            * `null` — универсальная карта, не специфицируется.
          type: boolean
