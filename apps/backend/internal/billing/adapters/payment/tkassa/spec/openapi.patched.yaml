          type: integer
          format: int64
          example: 100000
        OrderId:
          description: |
            Идентификатор заказа в системе мерчанта. Должен быть уникальным для каждой операции.
          type: string
          maxLength: 36
          example: '21050'
        Success:
          description: |
            Успешность прохождения запроса — `true`/`false`.
          type: boolean
          example: true
        Status:
          description: |
            Статус платежа. Возвращается один из трех статусов:
            * `CONFIRMED` — если платеж выполнен;
            * `REJECTED` — если платеж не выполнен;
            * `FORM SHOWED` — если был совершен переход на платежную форму, но покупатель еще не успел провести оплату.
          type: string
          maxLength: 20
          enum:
            - CONFIRMED
            - REJECTED
            - FORM SHOWED
        PaymentId:
          description: |
            Идентификатор платежа в системе Т‑Бизнес.
          type: string
          maxLength: 20
          example: '13660'
        ErrorCode:
          description: |
            Код ошибки.
          type: string
          maxLength: 20
          example: '0'
        Message:
          description: |
            Краткое описание ошибки.
          type: string
          maxLength: 255
          example: Неверные параметры
        Details:
          description: |
            Подробное описание ошибки.
          type: string
        Currency:
          type: string
          description: Код валюты по `ISO 4217`.
          example: '643'
    SbpPayTestRequest:
