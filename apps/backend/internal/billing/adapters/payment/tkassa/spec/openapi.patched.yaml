          example: true
        ErrorCode:
          description: |
            Код ошибки.
          type: string
          maxLength: 20
          example: '0'
        Message:
          description: |
            Краткое описание ошибки.
          type: string
          maxLength: 255
          example: OK
        AccountTokens:
          description: |
            Список счетов покупателя, которые привязаны к магазину.
