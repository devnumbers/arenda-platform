      properties:
        TerminalKey:
          type: string
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          example: TBankTest
        Description:
          type: string
          description: Подробное описание деталей заказа.
        DataType:
          type: string
          description: |
            Тип возвращаемых данных:
            * `PAYLOAD` — в ответе возвращается только Payload;
            * `IMAGE` — в ответе возвращается SVG-изображение QR.

            Значение по умолчанию — `PAYLOAD`.
          default: PAYLOAD
          enum:
            - PAYLOAD
            - IMAGE
          example: PAYLOAD
        BankId:
          type: string
          description: |
            Внутренний идентификатор банка, который выбран для оплаты.   


            Список доступных `BankId` можно получить через метод [Получить список банков-участников СБП для платежа](/eacq/api/get-qr-bank-list).   
            Если передается, в ответе в параметре `Data` вместо функциональной платежной ссылки (payload) возвращается deeplink.   


            `BankId` передается только для `DataType = PAYLOAD` или `null`. 
          example: bank100000000004
        Data:
          type: object
          description: |
            JSON-объект, который содержит дополнительные параметры в виде `ключ`:`значение`. Эти параметры будут
            переданы на страницу оплаты, если она кастомизирована. 


            Максимальная длина для каждого передаваемого параметра:
              * ключ — 20 знаков;
              * значение — 100 знаков.


            Максимальное количество пар `ключ`:`значение` — не больше 20.


            Если ключи или значения содержат в себе специальные символы, 
            получившееся значение должно быть закодировано функцией `urlencode`.
          additionalProperties:
            type: string
        RedirectDueDate:
          type: string
          format: date-time
          description: |
            Срок жизни ссылки или динамического QR-кода СБП, если выбран этот способ оплаты.<br><br>

            Если дата в параметре меньше текущей, оплата по ссылке и QR будет недоступна.

            * Минимальное значение — 1 минута от текущей даты.
            * Максимальное значение — 90 дней от текущей даты.
            * Формат даты — `YYYY-MM-DDTHH24:MI:SS+GMT`.


            Пример даты — `2016-08-31T12:28:00+03:00`.


            Если параметр не был передан, проверяется настроечный параметр терминала `REDIRECT_TIMEOUT`, который содержит значение срока жизни ссылки в часах. <br>Если его значение:

            * больше нуля — оно будет установлено в качестве срока жизни ссылки или динамического QR-кода;
            * меньше нуля — устанавливается значение по умолчанию: 1440 мин. (1 сутки).
          example: '2016-08-31T12:28:00+03:00'
        Token:
          type: string
          description: Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
          example: 871199b37f207f0c4f721a37cdcc71dfcea880b4a4b85e3cf852c5dc1e99a8d6
