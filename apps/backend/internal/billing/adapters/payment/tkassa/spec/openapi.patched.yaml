    AttachCardRequest:
      type: object
      required:
        - TerminalKey
        - RequestKey
        - CardData
        - deviceChannel
        - Token
      properties:
        TerminalKey:
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          type: string
          maxLength: 20
          example: TBankTest
        RequestKey:
          description: |
            Идентификатор запроса на привязку карты.
          type: string
          format: uuid
          example: 13021e10-a3ed-4f14-bcd1-823b5ac37390
        CardData:
          description: |
            Зашифрованные данные карты в формате `PAN=4300000000000777;ExpDate=0519;CardHolder=IVAN PETROV;CVV=111`.
          type: string
          example: U5jDbwqOVx+2vDApxe/rfACMt+rfWXzPdJ8ZXxNFVIiZaLZrOW72bGe9cKZdIDnekW0nqm88YxRD↵jyfa5Ru0kY5cQV alU+juS1u1zpamSDtaGFeb8sRZfhj72yGw+io+qHGSBeorcfgoKStyKGuBPWfG↵d0PLHuyBE6QgZyIAM1XfdmNlV0UAxOnkTGDsskL pIt3AWhw2e8KOar0vwbgCTDjznDB1/DLgOW01↵Aj/bXyLJoG1BkOrPBm9JURs+f+uyFae0hkRicNKNgXoN5pJTSQxOEauOi6ylsVJ B3WK5MNYXtj6x↵GlxcmTk/LD9kvHcjTeojcAlDzRZ87GdWeY8wgg==
        deviceChannel:
          type: string
          description: |
            Канал устройства.
            Поддерживаются следующие каналы:
            * `01` — Application (APP);
            * `02` — Browser (BRW).
          example: '02'
          default: '02'
        DATA:
          description: |
            JSON-объект с дополнительными параметрами по операции и настройками в формате `ключ:значение`.

            Максимальная длина ключа — 20 знаков, значения — 100 знаков. 

            Максимальное количество пар `ключ:значение` — не больше 20.

            Если ключи или значения содержат в себе специальные символы, получившееся значение должно быть закодировано функцией `urlencode`. 

            Для 3DS v2.1 в `DATA` нужно передавать параметры, которые описаны в объекте `ThreeDSv2`. В `HttpHeaders` запроса обязательны заголовки `User-Agent` и `Accept`.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - $ref: '#/components/schemas/ThreeDSv2'
        Token:
          description: |
            Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
          type: string
          example: 7241ac8307f349afb7bb9dda760717721bbb45950b97c67289f23d8c69cc7b96
    AttachCardResponse:
      type: object
      required:
        - TerminalKey
        - CustomerKey
        - RequestKey
        - Success
        - ErrorCode
      properties:
        TerminalKey:
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала
          type: string
          maxLength: 20
          example: testRegress
        CustomerKey:
          description: |
            Идентификатор покупателя в системе мерчанта.
          type: string
          example: testCustomerKey
        RequestKey:
          description: |
            Идентификатор запроса на привязку карты.
          type: string
          format: uuid
          example: 8de92934-26c9-474c-a4ce-424f2021d24d
        CardId:
          description: |
            Идентификатор платежного средства в системе Т‑Бизнес. 

            Для сценария 3D Secure Authentication Challenge `CardId` можно получить после успешного прохождения 3DS.
          type: string
          example: '5555'
        Success:
          description: |
            Успешность прохождения запроса — `true`/`false`.
          type: boolean
          example: true
        ErrorCode:
          description: |
            Код ошибки.
          type: string
          maxLength: 20
          example: '0'
        Status:
          description: |
            Статус привязки карты:
            * `NEW` — новая сессия привязки карты;
            * `FORM_SHOWED` — показ формы привязки карты;
            * `3DS_CHECKING` — отправка покупателя на проверку 3DS;
            * `3DS_CHECKED` — покупатель успешно прошел проверку 3DS;
            * `AUTHORIZING` — отправка платежа на 0 руб.;
            * `AUTHORIZED` — платеж на 0 руб. прошел успешно;
            * `COMPLETED` — карта успешно привязана;
            * `REJECTED` — привязать карту не удалось.
          enum:
            - NEW
            - FORM_SHOWED
            - 3DS_CHECKING
            - 3DS_CHECKED
            - AUTHORIZING
            - AUTHORIZED
            - COMPLETED
            - REJECTED
          type: string
          maxLength: 20
        RebillId:
          description: |
            Уникальный идентификатор сохраненных платежных реквизитов покупателя.
          type: string
          example: '130799909'
        Message:
          description: |
            Краткое описание ошибки.
          type: string
          maxLength: 255
          example: Неверные параметры
        Details:
          description: |
            Подробное описание ошибки.
          type: string
        ACSUrl:
          description: |
            Адрес сервера управления доступом для проверки 3DS.

            Возвращается в ответе для статуса `3DS_CHECKING`.
          type: string
          format: uri
          example: https://secure.tcsbank.ru/acs/auth/start.do
        MD:
          description: |
            Идентификатор платежа в системе Т‑Бизнес.

            Возвращается в ответе для статуса `3DS_CHECKING`.
          type: string
          example: ACQT-563587431
        PaReq:
          description: |
            Результат аутентификации 3D Secure.

            Возвращается в ответе для статуса `3DS_CHECKING`.
          type: string
          example: eJxVUl1TwjAQ/CtM30s+KLTDHGHQwsiogFh09C2kp1RpC2nLh7/eBAtqnnYvN3ubvUD/kK4bO9RFkmc9hzWp08BM5XGSvfecRT RyA6cvIFppxPARVaVRwD0WhXzHRhL3HMUU73itwKVtyl1Pcs8Nli3pymUQK+z2Sww6joDZYI5bAfUgYeY0OZAzNYparWRWCpBqe zWeiDZnLe3BqSmkqMeh4PRy2p02BfJThkymKCIsSiAnCCqvslIfhXEG5Eyg0muxKstN0SVkv983yyT7zN/emroiQOwlkF8js8qiwogdk lg8rEfT5WK0jj6G7D4cepNo8TWNBmwSDXtAbAfEskTjkPk0oF6DeV3a6jLj8VQHmVoXglFTqTFs7IjBn4u/BTBZa7OK8yPODPCwyT M0HSbACwby6/f6xsaoSpNMMN89+uHdV/iUPz2nyat/uxrPXz5nuX/c2nBPTVYxMflwzthJ0hIgVobUeyP1yg469xW+AedOuuM=
    AcsUrlv1Request:
      title: Параметры запроса для 3DS v1.0
      type: object
      required:
        - MD
        - PaReq
        - TermUrl
      properties:
        MD:
          type: string
          description: Идентификатор платежа в ACS из ответа метода [Подтвердить платеж](/eacq/api/finish-authorize).
        PaReq:
          type: string
          description: Результат 3D Secure аутентификации в ACS из ответа метода [Подтвердить платеж](/eacq/api/finish-authorize).
        TermUrl:
          type: string
          description: Адрес перенаправления после 3D Secure аутентификации — URL обработчик на стороне мерчанта, принимающий результаты прохождения 3D Secure.
    AcsUrlv2Request:
      title: Параметры запроса для 3DS v2.1
      type: object
      required:
        - creq
      properties:
        creq:
          title: Challenge Request (CReq)
          type: object
          required:
            - threeDSServerTransID
            - acsTransID
            - challengeWindowSize
            - messageType
            - messageVersion
          description: JSON-объект с параметрами в форматe `Base64`.
          properties:
            threeDSServerTransID:
              type: string
              description: Идентификатор платежа из ответа метода [Проверить версию 3DS](/eacq/api/check-3-ds-version). Генерируется 3DS Server.
            acsTransID:
              type: string
              description: Идентификатор платежа из ответа метода [Подтвердить платеж](/eacq/api/finish-authorize). Назначается ACS.
            challengeWindowSize:
              type: string
              description: |
                Разрешение экрана в пикселях, на котором открыта страница ACS:

                  * `01` — 250 x 400;
                  * `02` — 390 x 400;
                  * `03`— 500 x 600;
                  * `04` — 600 x 400;
                  * `05` — Fullscreen.
            messageType:
              type: string
              description: Фиксированное значение `CReq`.
            messageVersion:
              type: string
              description: Версия 3DS из ответа метода [Проверить версию 3DS](/eacq/api/check-3-ds-version).
    AcsUrlv1Response:
      title: Ответ на запрос 3DS v1.0
      type: object
      required:
        - MD
        - PaRes
      properties:
        MD:
          type: string
          description: Идентификатор платежа в ACS из ответа метода [Подтвердить платеж](/eacq/api/finish-authorize).
          example: MD_TEST
        PaRes:
          type: string
          description: Результат 3D Secure аутентификации.
          example: PaRes_TEST
        FallbackOnTdsV1:
          type: string
          description: Если аутентификация по 3DS v2.1 невозможна, выполняется переход на 3DS v1.0 и параметр устанавливается в значение `true`, иначе параметр не передается в ответе.
    AcsUrlv2Response:
      title: Ответ на запрос 3DS v2.1
      type: object
      required:
        - cres
      properties:
        cres:
          title: Challenge Request (CReq)
          type: object
          required:
            - threeDSServerTransID
            - acsTransID
            - messageType
            - messageVersion
            - transStatus
          description: JSON/JWE-объект с параметрами, закодированный в формат `Base64`. Ответ отправляется на URL, который был указан в методе [Подтвердить платеж](/eacq/api/finish-authorize). После получения на `NotificationUrl` ответа ACS (CRes) с результатами прохождения 3DS v2.1 нужно отправить запрос через метод [Подтвердить прохождение 3DS v2.1](/eacq/api/submit-3-ds-authorization-v-2).
          properties:
            threeDSServerTransID:
              type: string
              description: Идентификатор платежа из ответа метода [Проверить версию 3DS](/eacq/api/check-3-ds-version). Генерируется 3DS Server.
            acsTransID:
              type: string
              description: Идентификатор платежа из ответа метода [Подтвердить платеж](/eacq/api/finish-authorize). Назначается ACS.
            transStatus:
              type: string
              description: |
                Результат выполнения Challenge Flow:
                * `Y` — аутентификация выполнена успешна;
                * `N` — аутентификация не пройдена, покупатель отказался или ввел неверные данные. 
            messageType:
              type: string
              description: Фиксированное значение `CRes`.
            messageVersion:
              type: string
              description: Версия 3DS из ответа метода [Проверить версию 3DS](/eacq/api/check-3-ds-version).
