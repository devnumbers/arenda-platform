  /v2/Charge:
    post:
      operationId: Charge
      x-front:
        usage-scenario:
          - name: Платежи по сохраненным реквизитам
            link: /eacq/scenarios/payments/nonPCI/autopay/
          - name: Платежи по сохраненным реквизитам через свою платежную форму
            link: /eacq/scenarios/payments/PCI_DSS/autopay/
      tags:
        - Проведение платежа по сохраненным реквизитам
      summary: Провести платеж по сохраненным реквизитам
      description: |-
        Метод используется для проведения COF-операции с использованием ранее сохраненных 
        платежных реквизитов. Выполняет безакцептное списание средств со счета покупателя на основании сохраненных реквизитов и параметра `RebillId`.

        Подробнее про платежи по сохраненным реквизитам при интеграции:
        - [с платежной формой банка](/eacq/scenarios/payments/nonPCI/autopay/);
        - [со своей платежной формой](/eacq/scenarios/payments/PCI_DSS/autopay/).
             
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
            example:
              TerminalKey: TBankTest
              PaymentId: '700001702044'
              RebillId: '145919'
              Token: f5a3be479324a6d3a4d9efa0d02880b77d04a91758deddcbd9e752a6df97cab5
              IP: 2011:0db8:85a3:0101:0101:8a2e:0370:7334
              SendEmail: true
              InfoEmail: customer@test.com
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - TerminalKey
                      - Amount
                      - OrderId
                      - Success
                      - PaymentId
                      - ErrorCode
                      - Status
                    properties:
                      TerminalKey:
                        description: |
                          Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
                        type: string
                        maxLength: 20
                        example: TBankTest
                      Amount:
                        description: |
                          Сумма в копейках.
                        type: integer
                        format: int64
                        example: 100000
                      OrderId:
                        description: |
                          Идентификатор заказа в системе мерчанта. Должен быть уникальным для каждой операции.
                        type: string
                        maxLength: 36
                        example: '21050'
                      Success:
                        description: |
                          Успешность прохождения запроса — `true`/`false`.
                        type: boolean
                        example: true
                      Status:
                        description: |
                          Статус платежа. 

                          Возвращается один из статусов:
                          * `CONFIRMED` — если платеж выполнен;
                          * `REJECTED` — если платеж не выполнен.
                        type: string
                        maxLength: 20
                        example: CONFIRMED
                      PaymentId:
                        description: |
                          Идентификатор платежа в системе Т‑Бизнес.
                        type: string
                        maxLength: 20
                        example: '13660'
                      ErrorCode:
                        description: |
                          Код ошибки.
                        type: string
                        maxLength: 20
                        example: '0'
                      Message:
                        description: |
                          Краткое описание ошибки.
                        type: string
                      Details:
                        description: |
                          Подробное описание ошибки.
                        type: string
                  - $ref: '#/components/schemas/ErrorResponse'
              example:
                TerminalKey: TBankTest
                Amount: 100000
                OrderId: '21050'
                Success: true
                Status: CONFIRMED
                PaymentId: '13660'
                ErrorCode: '0'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
              example:
                Success: false
                ErrorCode: '9999'
                Message: Внутренняя ошибка системы.
                Causes:
                  - Internal Service Error.
