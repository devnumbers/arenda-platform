openapi: 3.0.2
info:
  version: '1.27'
  title: Прием платежей
  description: |-
    ## Правила работы

    Прием платежей происходит с помощью вызова методов — параметры передаются через метод POST в формате JSON. Все методы и передаваемые параметры чувствительны к регистру. Для POST-запроса в заголовке должен быть `Content-Type: application/json`. Для корректной работы с API-методами используйте TLS протокол версии 1.2 и выше.

    Для большинства методов нужно использовать [подпись запроса](/eacq/intro/developer/token).

    Для нашего интернет-эквайринга оплата проходит только в рублях. Если мерчанту нужна оплата в валюте, он самостоятельно реализовывает логику конвертации суммы в запросе на своей стороне.
  contact:
    url: https://www.tbank.ru/kassa/
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: /kassa/dev/assets/img/logo.svg
servers:
  - url: https://securepay.tinkoff.ru
    description: production
  - url: https://rest-api-test.tinkoff.ru
    description: test
security: []
tags:
  - name: Проведение платежа
  - name: Прием платежей по карте
  - name: Методы для работы с 3DS
    x-parent-tag: Прием платежей по карте
  - name: Другие способы приема платежей
    description: СБП, T‑Pay, SberPay, Mir Pay, цифровой рубль.
  - name: СБП
    x-parent-tag: Другие способы приема платежей
  - name: T‑Pay
    x-parent-tag: Другие способы приема платежей
  - name: SberPay
    x-parent-tag: Другие способы приема платежей
  - name: Mir Pay
    x-parent-tag: Другие способы приема платежей
  - name: Alfa Pay
    x-parent-tag: Другие способы приема платежей
  - name: Цифровой рубль
    x-parent-tag: Другие способы приема платежей
  - name: Привязка карты
    description: Методы для работы с покупателями и картами.
  - name: Методы работы с покупателями
    x-parent-tag: Привязка карты
  - name: Методы работы с картами
    x-parent-tag: Привязка карты
  - name: Проведение платежа по сохраненным реквизитам
  - name: Отмена платежа
  - name: Статус платежа или заказа
  - name: Справка по операции
  - name: Методы работы с чеками
paths:
  /v2/Init:
    post:
      operationId: Init
      tags:
        - Проведение платежа
      summary: Инициировать платеж
      x-front:
        usage-scenario:
          - name: Прием платежей на платежной форме банка
            link: /eacq/scenarios/payments/nonPCI/
          - name: Прием платежей на своей платежной форме
            link: /eacq/scenarios/payments/PCI_DSS/
      description: |
        Метод инициирует платеж.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitRequest'
            example:
              TerminalKey: TBankTest
              Amount: 140000
              OrderId: '21090'
              Description: Подарочная карта на 1000 рублей
              Token: 68711168852240a2f34b6a8b19d2cfbd296c7d2a6dff8b23eda6278985959346
              DATA:
                Phone: '+71234567890'
                Email: a@test.com
              Receipt:
                Email: a@test.ru
                Phone: '+79031234567'
                Taxation: osn
                Items:
                  - Name: Наименование товара 1
                    Price: 10000
                    Quantity: 1
                    Amount: 10000
                    Tax: vat10
                    Ean13: '303130323930303030630333435'
                  - Name: Наименование товара 2
                    Price: 20000
                    Quantity: 2
                    Amount: 40000
                    Tax: vat20
                  - Name: Наименование товара 3
                    Price: 30000
                    Quantity: 3
                    Amount: 90000
                    Tax: vat10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InitResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                Success:
                  value:
                    Success: true
                    ErrorCode: '0'
                    TerminalKey: TBankTest
                    Status: NEW
                    PaymentId: '3093639567'
                    OrderId: '21090'
                    Amount: 140000
                    PaymentURL: https://pay.tbank.ru/new/fU1ppgqa
                Failed:
                  value:
                    Success: false
                    ErrorCode: '501'
                    Message: Неверные параметры
                    Details: Терминал не найден.
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
              example:
                Success: false
                ErrorCode: '9999'
                Message: Внутренняя ошибка системы.
                Causes:
                  - Internal Service Error.
  /v2/Check3dsVersion:
    post:
      operationId: Check3dsVersion
      x-front:
        usage-scenario:
          - name: Оплата картой на своей платежной форме
            link: /eacq/scenarios/payments/PCI_DSS/card
          - name: Привязка карты на своей форме привязки
            link: /eacq/scenarios/payments/PCI_DSS/card/#работа-с-картами-и-покупателями
      tags:
        - Методы для работы с 3DS
      summary: Проверить версию 3DS
      description: |

        >Для мерчантов c собственной платежной формой

        Метод возвращает версию протокола 3DS, по которому может аутентифицироваться карта.

        Если 3DS v2.1, можно получить данные для прохождения дополнительного метода [Пройти этап 3DS Method](/eacq/api/three-ds-method). Он позволяет эмитенту собрать данные браузера покупателя — это может быть полезно при принятии решения в пользу Frictionless Flow (аутентификация покупателя без редиректа на страницу ACS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - PaymentId
                - TerminalKey
                - CardData
                - Token
              properties:
                PaymentId:
                  description: |
                    Идентификатор платежа в системе Т‑Бизнес.
                  type: string
                  maxLength: 20
                TerminalKey:
                  description: |
                    Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
                  type: string
                  maxLength: 20
                CardData:
                  description: |
                    Зашифрованные данные карты в формате: 
                      ```
                      PAN=4300000000000777;ExpDate=0519;CardHolder=IVAN PETROV;CVV=111
                      ```
                  type: string
                Token:
                  description: |
                    Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
                  type: string
            example:
              PaymentId: 13660
              TerminalKey: TBankTest
              CardData: U5jDbwqOVx+2vDApxe/rfACMt+rfWXzPdJ8ZXxNFVIiZaLZrOW72bGe9cKZdIDnekW0nqm88YxRD↵jyfa5Ru0kY5cQV alU+juS1u1zpamSDtaGFeb8sRZfhj72yGw+io+qHGSBeorcfgoKStyKGuBPWfG↵d0PLHuyBE6QgZyIAM1XfdmNlV0UAxOnkTGDsskL pIt3AWhw2e8KOar0vwbgCTDjznDB1/DLgOW01↵Aj/bXyLJoG1BkOrPBm9JURs+f+uyFae0hkRicNKNgXoN5pJTSQxOEauOi6ylsVJ B3WK5MNYXtj6x↵GlxcmTk/LD9kvHcjTeojcAlDzRZ87GdWeY8wgg==
              Token: 30797e66108934dfa3d841b856fdad227c6b9c46d6a39296e02dc800d86d181e
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - Version
                      - PaymentSystem
                      - Success
                      - ErrorCode
                    properties:
                      Version:
                        description: |
                          Версия протокола 3DS. 
                          Примеры:
                          * `1.0.0` — первая версия,
                          * `2.1.0` — вторая версия.
                        type: string
                      TdsServerTransID:
                        description: |
                          Идентификатор платежа, который генерируется 3DS Server. Параметр обязательный для 3DS v2.1.
                        type: string
                      ThreeDSMethodURL:
                        description: |
                          Дополнительный параметр для 3DS v2.1, который позволяет пройти этап по сбору данных браузера ACS-ом.
                        type: string
                        format: uri
                      PaymentSystem:
                        description: |
                          Платежная система карты.
                        type: string
                      Success:
                        description: |
                          Успешность прохождения запроса — `true`/`false`.
                        type: boolean
                      ErrorCode:
                        description: |
                          Код ошибки.
                        type: string
                        maxLength: 20
                      Message:
                        description: |
                          Краткое описание ошибки.
                        type: string
                      Details:
                        description: |
                          Подробное описание ошибки.
                        type: string
                  - $ref: '#/components/schemas/ErrorResponse'
              example:
                Version: 2.1.0
                TdsServerTransID: 17d3791b-5cfa-4318-bc23-3d949e8c4b7e
                ThreeDSMethodURL: https://acs.vendorcert.mirconnect.ru/ds/6300
                PaymentSystem: mir
                Success: true
                ErrorCode: '0'
                Message: None
                Details: None
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
              example:
                Success: false
                ErrorCode: '9999'
                Message: Внутренняя ошибка системы.
                Causes:
                  - Internal Service Error.
  /v2/ThreeDSMethod:
    post:
      tags:
        - Методы для работы с 3DS
      description: |

        >Для мерчантов c собственной платежной формой

        Метод для сбора информации ACS-ом о девайсе. Обязателен, если для 3DS v2.1 в ответе метода [Проверить версию 3DS](/eacq/api/check-3-ds-version) был получен параметр `ThreeDSMethodURL`.

        Условия выполнения:

          * в скрытом iframe на стороне браузера;
          * с таймаутом ожидания ответа на запрос — 10 секунд.
      summary: Пройти этап 3DS Method
      servers:
        - url: https://acs.vendorcert.mirconnect.ru/ds/6300
          description: production
      operationId: ThreeDSMethod
      x-front:
        usage-scenario:
          - name: Оплата картой на своей платежной форме
            link: /eacq/scenarios/payments/PCI_DSS/card
          - name: Привязка карты на своей форме привязки
            link: /eacq/scenarios/payments/PCI_DSS/card/#работа-с-картами-и-покупателями
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ThreeDSMethodRequest'
      x-codeSamples:
        - lang: Пример запроса на 3DS Method Url
          source: |
            <body onload="document.form.submit()">
            <form name="form" action="{ThreeDSMethodURL}" method="post">
              <input type="hidden" name="threeDSMethodData" value="eyJ0aHJlZURTU2VydmVyVHJhbnNJRCI6IjU2ZTcxMmE1LTE5MGEtNDU4OC05MWJjLWUwODYyNmU3N2M0NCIsInRocmVlRFNNZXRob2ROb3RpZmljYXRpb25VUkwiOiJodHRwczovL3Jlc3QtYXBpLXRlc3QudGlua29mZi5ydS92Mi9Db21wbGV0ZTNEU01ldGhvZHYyIn0">
            </form>
            </body>
        - lang: Пример декодированного значения threeDSMethodData
          source: |
            {
            "threeDSServerTransID":"56e712a5-190a-4588-91bc-e08626e77c44",
            "threeDSMethodNotificationURL":https://rest-api-test.tinkoff.ru/v2/CompleteThreeDSMethodv2
            }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ThreeDSMethodResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
              example:
                Success: false
                ErrorCode: '9999'
                Message: Внутренняя ошибка системы.
                Causes:
                  - Internal Service Error.
  /v2/FinishAuthorize:
    post:
      operationId: FinishAuthorize
      x-front:
        usage-scenario:
          - name: Прием платежей на своей платежной форме
            link: /eacq/scenarios/payments/PCI_DSS/
      tags:
        - Проведение платежа
      summary: Подтвердить платеж
      description: |

        >Для мерчантов c собственной платежной формой

        Метод подтверждает платеж:

        * при одностадийной оплате —  списывает деньги за покупку сразу после завершения оплаты;
        * при двухстадийной — блокирует деньги за покупку на счете покупателя и только потом списывает их. 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishAuthorizeRequest'
            example:
              TerminalKey: TBankTest
              PaymentId: '700001702044'
              Token: f5a3be479324a6d3a4d9efa0d02880b77d04a91758deddcbd9e752a6df97cab5
              IP: 2011:0db8:85a3:0101:0101:8a2e:0370:7334
              SendEmail: true
              deviceChannel: '02'
              Source: cards
