              - Status
            type: object
            properties:
              RequestKey:
                description: |
                  Идентификатор запроса на привязку счета. 
                type: string
                format: uuid
                example: 8de92934-26c9-474c-a4ce-424f2021d24d
              Status:
                description: |
                  Статус привязки карты:
                  * `NEW` — получен запрос на привязку счета;
                  * `PROCESSING` — запрос в обработке;
                  * `ACTIVE` — привязка счета успешна;
                  * `INACTIVE` — привязка счета неуспешна или деактивирована.
                enum:
                  - NEW
                  - PROCESSING
                  - ACTIVE
                  - INACTIVE
                type: string
                maxLength: 20
              AccountToken:
                description: |
                  Идентификатор привязки счета, который назначается банком плательщика.
                type: object
                example: 0b67f2cae19b41809f85d5674de30a1a
              BankMemberId:
                description: |
                  Идентификатор банка покупателя, который будет совершать оплату по привязанному счету. Параметр передается, если статус `ACTIVE` или `INACTIVE`.
                type: string
                example: '5555'
              BankMemberName:
                description: |
                  Наименование банка-эмитента. Заполнен, если передан `BankMemberId`.
                type: string
                example: T-Банк
    ChargeQrRequest:
