    WithThreeDSv2BRW:
      allOf:
        - $ref: '#/components/schemas/FinishAuthorizeResponse'
        - type: object
        - required:
            - TdsServerTransId
            - AcsTransId
          properties:
            TdsServerTransId:
              type: string
              description: |
                Идентификатор платежа, который генерируется 3DS Server. Обязательный параметр для 3DS v2.1.
              example: d7171a06-7159-4bdd-891a-a560fe9938d2
            AcsTransId:
              type: string
              description: |
                Идентификатор платежа, который назначается ACS.
              example: e176d5d3-2f19-40f5-8234-46d3464e0b08
            ACSUrl:
              type: string
              format: uri
              description: |
                Если в ответе метода [Подтвердить платеж](/eacq/api/finish-authorize) возвращается статус `3DS_CHECKING`, 
                мерчанту нужно сформировать запрос на URL ACS банка, который выпустил карту — параметр `ACSUrl` в ответе, и вместе с этим перенаправить покупателя на эту же страницу ACSUrl для прохождения 3DS.
              example: https://acs.vendorcert.mirconnect.ru/mdpayacs/creq
    ConfirmRequest:
      type: object
      required:
        - TerminalKey
        - PaymentId
        - Token
      properties:
        TerminalKey:
          type: string
          description: Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          example: TBankTest
        PaymentId:
          type: string
          description: Идентификатор платежа в системе Т‑Бизнес.
          maxLength: 20
          example: '2304882'
        Token:
          type: string
          description: Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
          example: c0ad1dfc4e94ed44715c5ed0e84f8ec439695b9ac219a7a19555a075a3c3ed24
        IP:
          type: string
          description: IP-адрес покупателя.
          example: 192.168.255.255
        Amount:
          type: integer
          format: int64
          description: Сумма в копейках. Если не передан, используется `Amount`, который был передан в методе [Инициировать платеж](/eacq/api/init).
          example: 19200
        Receipt:
          type: object
          description: JSON-объект с данными чека. Обязателен, если подключена онлайн-касса.
          oneOf:
            - $ref: '#/components/schemas/ReceiptFfd12'
            - $ref: '#/components/schemas/ReceiptFfd105'
        Shops:
          type: array
          description: JSON-объект с данными маркетплейса. Обязательный для маркетплейсов.
          items:
            $ref: '#/components/schemas/Shops'
        Route:
          type: string
          description: |
            Способ платежа.
          enum:
            - TCB
            - BNPL
          example: BNPL
        Source:
          type: string
          description: |
            Источник платежа.
          enum:
            - installment
            - BNPL
          example: BNPL
    ItemsParams:
      type: object
      description: Информация по способу оплаты или деталям для платежей в рассрочку.
      properties:
        Key:
          type: string
          description: |

            * `Route` — способ оплаты.
            * `Source` — источник платежа.
            * `CreditAmount` — сумма выданного кредита в копейках. Возвращается только для платежей в рассрочку.
            * `EndCoolingPeriod` — дата окончания периода охлаждения в формате `date-time`. Возвращается только для платежей через сервис «Долями».
            * `DrPaymentId` – идентификатор операции в ЦБ при оплате цифровым рублем.
            * `DrPaymentSettlementDate` — дата и время исполнения распоряжения от ЦБ.
            * `ParticipantWalletId` —  идентификатор счета цифрового рубля (СЦР) плательщика-физлица.
          enum:
            - Route
            - Source
            - CreditAmount
            - DrPaymentId
            - DrPaymentSettlementDate
            - ParticipantWalletId
        Value:
          type: string
          description: |

            * для `Route` — `ACQ`, `BNPL`, `TCB`, `SBER`, `QRDR`;
            * для `Source` — `BNPL`, `cards`, `Installment`, `MirPay`, `qrsbp`, `SberPay`, `TinkoffPay`, `YandexPay`, `qrdigitalruble`;
            * для `CreditAmount` — сумма в копейках.
            * для `DrPaymentId` — идентификатор операции в ЦБ при оплате цифровым рублем.
            * для `DrPaymentSettlementDate` — дата и время исполнения распоряжения в формате `date-time`.
            * для `ParticipantWalletId` — идентификатор СЦР.
          enum:
            - ACQ
            - BNPL
            - TCB
            - SBER
            - QRDR
            - cards
            - Installment
            - MirPay
            - qrsbp
            - SberPay
            - TinkoffPay
            - YandexPay
            - qrdigitalruble
    ConfirmResponse:
      type: object
      required:
        - TerminalKey
        - OrderId
        - Success
        - Status
        - PaymentId
        - ErrorCode
        - Message
      properties:
        TerminalKey:
          type: string
          description: Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          example: TBankTest
        OrderId:
          type: string
          description: Идентификатор заказа в системе мерчанта. Должен быть уникальным для каждой операции.
          example: '21057'
        Success:
          type: boolean
          description: Успешность прохождения запроса — `true`/`false`.
          example: true
        Status:
          type: string
          description: Статус транзакции.
          example: CONFIRMED
          enum:
            - NEW
            - AUTHORIZING
            - AUTHORIZED
            - AUTH_FAIL
            - CANCELED
            - CHECKING
            - CHECKED
            - COMPLETING
            - COMPLETED
            - CONFIRMING
            - CONFIRMED
            - DEADLINE_EXPIRED
            - FORM_SHOWED
            - PARTIAL_REFUNDED
            - PREAUTHORIZING
            - PROCESSING
            - 3DS_CHECKING
            - 3DS_CHECKED
            - REVERSING
            - REVERSED
            - REFUNDING
            - REFUNDED
            - REJECTED
            - UNKNOWN
        PaymentId:
          type: string
          description: Идентификатор платежа в системе Т‑Бизнес.
          example: '2304882'
        ErrorCode:
          type: string
          description: Код ошибки.
          example: '0'
        Message:
          type: string
          description: Краткое описание ошибки.
          example: OK
        Details:
          type: string
          description: Подробное описание ошибки.
          example: None
        Params:
          description: |
            Детали для платежей в рассрочку.
          type: array
          items:
            $ref: '#/components/schemas/ItemsParams'
    ShopsCancel:
      type: object
      description: JSON-объект с данными маркетплейса. Обязательный для маркетплейсов.
      required:
        - ShopCode
        - Amount
      properties:
        ShopCode:
          description: |
            Код магазина.
          type: string
          example: '700456'
        Amount:
          description: |
            Cумма в копейках, которая относится к
            указанному `ShopCode`.
          type: integer
          format: int64
          example: 10000
        Name:
          description: |
            Наименование товара.
          type: string
          maxLength: 128
          example: Товар
    CancelRequest:
      type: object
      required:
        - TerminalKey
        - PaymentId
        - Token
      properties:
        TerminalKey:
          type: string
          description: Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          example: TBankTest
        PaymentId:
          type: string
          description: Идентификатор платежа в системе Т‑Бизнес.
          example: '2304882'
        Token:
          type: string
          description: Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
          example: c0ad1dfc4e94ed44715c5ed0e84f8ec439695b9ac219a7a19555a075a3c3ed24
        IP:
          type: string
          description: IP-адрес покупателя.
          example: 192.168.255.255
        Amount:
          type: integer
          format: int64
          description: |
            Сумма в копейках. Если не передан, используется `Amount`, переданный в методе [Инициировать платеж](/eacq/api/init).


            При отмене операции в статусе `NEW` поле `Amount` игнорируется, даже если оно заполнено. Отмена проводится на полную сумму.
          example: 19200
        Receipt:
          type: object
          description: |
            JSON-объект с данными чека. Обязателен, если подключена онлайн-касса.

            При частичной отмене данные, которые передаются в этом запросе, могут отличаться от данных, которые были переданы в методе [Инициировать платеж](/eacq/api/init).


            При полной отмене структура чека не передается, при частичной — передаются товары, которые нужно отменить.
          oneOf:
            - $ref: '#/components/schemas/ReceiptFfd12'
            - $ref: '#/components/schemas/ReceiptFfd105'
        Shops:
          type: array
          description: JSON-объект с данными маркетплейса. Обязательный для маркетплейсов.
          items:
            $ref: '#/components/schemas/ShopsCancel'
        QrMemberId:
          type: string
          description: |-
            Код банка в классификации СБП, в который нужно выполнить возврат.

            Подробнее — в параметре `MemberId` метода [Получить список банков-пользователей QR](/eacq/api/qr-members-list).
          example: '77892'
        Route:
          type: string
          description: |
            Способ платежа.
          enum:
            - TCB
            - BNPL
          example: BNPL
        Source:
          type: string
          description: |
            Источник платежа.
          enum:
            - installment
            - BNPL
          example: BNPL
        ExternalRequestId:
          description: |
            Ключ [идемпотентости](/eacq/intro/developer/glossary) и идентификатор операции на стороне мерчанта. 

            Параметр обязательный для операций «Долями» и в рассрочку. 


            * Если поле не передано или пустое (""), запрос будет обработан без проверки ранее созданных возвратов.
            * Если поле заполнено, перед проведением возврата будет проверен запрос на отмену с таким `ExternalRequestId`.
            * Если такой запрос уже есть, в ответе вернется текущее состояние платежной операции, если нет — платеж будет отменен.
            * Для операций «Долями» при заполнении параметра нужно генерировать значение в формате `UUID v4`.
            * Для операций в рассрочку при заполнении параметра нужно генерировать значение с типом `string` — ограничение 100 символов.
            * Для способа оплаты AlfaPay при заполнении параметра `ExternalRequestId` длина значения не должна превышать 36 символов.
          type: string
          maxLength: 255
    CancelResponse:
