  /v2/AcsUrl:
    post:
      tags:
        - Методы для работы с 3DS
      description: |

        >Для мерчантов c собственной платежной формой

         `ACSUrl` возвращается в ответе метода [Подтвердить платеж](/eacq/api/finish-authorize).
         Если в ответе метода [Подтвердить платеж](/eacq/api/finish-authorize) возвращается статус `3DS_CHECKING`, 
         мерчанту нужно сформировать запрос на URL ACS банка, выпустившего карту, из параметра `ACSUrl`.
         
         **Для 3DS v2.1**: компонент ACS использует пары сообщений CReq и CRes для выполнения проверки (Challenge). В ответ на полученное сообщение CReq компонент ACS формирует сообщение CRes, которое запрашивает покупателя ввести данные для аутентификации.

         **Формат ответа**: cres, полученный по `NotificationUrl` из запроса метода [Подтвердить платеж](/eacq/api/finish-authorize).
         При успешном результате прохождения 3DS инициированный платеж подтверждается с помощью методов [Подтвердить прохождение 3DS v1.0](/eacq/api/submit-3-ds-authorization) или [Подтвердить прохождение 3DS v2.1](/eacq/api/submit-3-ds-authorization-v-2) в зависимости от версии 3DS.
         
         **URL**: ACSUrl, который возвращается в ответе метода [Подтвердить платеж](/eacq/api/finish-authorize).
      summary: Отправить запрос в банк-эмитент для прохождения 3DS
      servers:
        - url: https://acsSignedContent.com
          description: production
      operationId: AcsUrl
      x-front:
        usage-scenario:
          - name: Оплата картой на своей платежной форме
            link: /eacq/scenarios/payments/PCI_DSS/card
          - name: Привязка карты на своей форме привязки
            link: /eacq/scenarios/payments/PCI_DSS/card/#работа-с-картами-и-покупателями
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AcsUrlv1Request'
                - $ref: '#/components/schemas/AcsUrlv2Request'
      x-codeSamples:
        - lang: Payload 3DS v1.0
          source: |
            <body onload="document.form.submit()" >
            <form name="form" action="{AcsUrl}" method="post" >
              <input type="hidden" name="TermUrl" value="{TermUrl}" >
              <input type="hidden" name="MD" value="{MD}" >
              <input type="hidden" name="PaReq" value="{PaReq}" >
            </form>
            </body>
        - lang: Payload 3DS v2.1
          source: |
            <body onload="document.form.submit()">
            <form name="form" action="{AcsUrl}" method="post">
              <input type="hidden" name="creq" value="ewogICJhY3NUcmFuc0lEIjogImUxNzZkNWQzLTJmMTktNDBmNS04MjM0LTQ2ZDM0NjRlMGIwOCIsCiAgImNoYWxsZW5nZVdpbmRvd1NpemUiOiAiMDMiLAogICJtZXNzYWdlVHlwZSI6ICJDUmVxIiwKICAibWVzc2FnZVZlcnNpb24iOiAiMi4xLjAiLAogICJ0aHJlZURTU2VydmVyVHJhbnNJRCI6ICJkNzE3MWEwNi03MTU5LTRiZGQtODkxYS1hNTYwZmU5OTM4ZDIiCn0K">
