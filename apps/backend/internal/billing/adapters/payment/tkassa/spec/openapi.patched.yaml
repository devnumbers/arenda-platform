    LongPay:
      description: Расширенный набор параметров авиабилета передается при создании платежа (метод [Инициировать платеж](/eacq/api/init)) в параметре `DATA`.
      type: object
      properties:
        ticketParams:
          type: array
          $ref: '#/components/schemas/LongPay1'
        passengerParams:
          type: array
          $ref: '#/components/schemas/LongPay2'
        flightParams:
          type: array
          $ref: '#/components/schemas/LongPay3'
    AgentData:
      type: object
      description: |
        Данные агента. Параметр обязательный, если используется агентская схема.
      properties:
        AgentSign:
          description: |
            `Тег ФФД: 1222`

            Признак агента:

            * `bank_paying_agent` — банковский платежный агент;
            * `bank_paying_subagent` — банковский платежный субагент;
            * `paying_agent` — платежный агент;
            * `paying_subagent` — платежный субагент;
            * `attorney` — поверенный;
            * `commission_agent` — комиссионер;
            * `another` — другой тип агента.
          type: string
          enum:
            - bank_paying_agent
            - bank_paying_subagent
            - paying_agent
            - paying_subagent
            - attorney
            - commission_agent
            - another
          example: paying_agent
        OperationName:
          description: |
            `Тег ФФД: 1044`

            Наименование операции.

            Параметр обязательный, если в `AgentSign` передано `bank_paying_agent` или `bank_paying_subagent`.
          type: string
          maxLength: 24
          example: Позиция чека
        Phones:
          description: |
            `Тег ФФД: 1073`     

            Телефоны платежного агента в формате `+{Ц}`.

            Параметр обязательный, если в `AgentSign` передано одно из значений:

            * `bank_paying_agent`;
            * `bank_paying_subagent`;
            * `paying_agent`;
            * `paying_subagent`.
          type: array
          items:
            type: string
            maxLength: 19
          example:
            - '+790912312398'
        ReceiverPhones:
          description: |
            `Тег ФФД: 1074`    

            Телефоны оператора по приему платежей в формате `+{Ц}`.

            Параметр обязательный, если `AgentSign` передан в значениях `paying_agent` или `paying_subagent`.
          items:
            type: string
            maxLength: 19
          example:
            - '+79221210697'
            - '+79098561231'
        TransferPhones:
          description: |
            `Тег ФФД: 1075`     

            Телефоны оператора перевода в формате `+{Ц}`.

            Параметр обязательный, если `AgentSign` передан в значениях `bank_paying_agent` или `bank_paying_subagent`.
          items:
            type: string
            maxLength: 19
          example:
            - '+79221210697'
        OperatorName:
          description: |
            `Тег ФФД: 1026`

            Наименование оператора перевода.

            Параметр обязательный, если в `AgentSign` передано `bank_paying_agent` или `bank_paying_subagent`.
          type: string
          maxLength: 64
          example: TBank
        OperatorAddress:
          description: |
            `Тег ФФД: 1005`
             
            Адрес оператора перевода.

            Параметр обязательный, если в `AgentSign` передано `bank_paying_agent` или `bank_paying_subagent`.
          type: string
          maxLength: 243
          example: г. Тольятти
        OperatorInn:
          description: |
            `Тег ФФД: 1016`

            ИНН оператора перевода.
            Параметр обязательный, если в `AgentSign` передано `bank_paying_agent` или `bank_paying_subagent`.
          type: string
          maxLength: 12
          example: '7710140679'
    SupplierInfo:
      type: object
      description: |
        Данные поставщика платежного агента. 
        Параметр обязательный, если передается значение `AgentSign` в объекте `AgentData`.
      properties:
        Phones:
          description: |
            `Тег ФФД: 1171`  

            Телефоны поставщика в формате `+{Ц}`.
            Параметр обязательный, если передается значение `AgentSign`
            в объекте `AgentData`.
          type: array
          items:
            type: string
            maxLength: 19
          example:
            - '+79221210697'
            - '+79098561231'
        Name:
          description: |
            `Тег ФФД: 1225`

            Наименование поставщика.
            Параметр обязательный, если передается значение `AgentSign` 
            в объекте `AgentData`.
            Состоит из 239 символов, в которые включаются телефоны поставщика — + 4 символа на каждый телефон.
              
              
            Например, если передано два телефона поставщика длиной 12 и 14 символов, 
            максимальная длина наименования поставщика будет 
            239 – (12 + 4) – (14 + 4) = 205 символов.
          type: string
          maxLength: 239
          example: ООО Вендор товара
        Inn:
          description: |
            `Тег ФФД: 1226`

            ИНН поставщика в формате `ЦЦЦЦЦЦЦЦЦЦ`.
            Параметр обязательный, если передается значение `AgentSign` 
            в объекте `AgentData`.
          type: string
          minLength: 10
          maxLength: 12
          example: '7710140679'
    ItemsFfd105:
      type: object
      required:
        - Name
        - Price
        - Quantity
        - Amount
        - Tax
      properties:
        Name:
          description: |
            `Тег ФФД: 1030`

            Наименование товара.
          type: string
          maxLength: 128
          example: Наименование товара 1
        Price:
          description: |
            `Тег ФФД: 1078`

            Цена в копейках.
          type: integer
          format: int64
          example: 10000
        Quantity:
          description: |
            `Тег ФФД: 1023`

            Количество или вес товара. Максимальное количество символов — 11, где:
            * целая часть — не больше 5 знаков;
            * дробная — не больше 6 знаков.
          type: number
          example: 1
        Amount:
          description: |
            `Тег ФФД: 1043`

            Стоимость товара в копейках.
            Произведение `Quantity` и `Price`.
          type: integer
          format: int64
          example: 10000
        PaymentMethod:
          description: |
            `Тег ФФД: 1214`   

            Признак способа расчета:
            * `full_prepayment` — предоплата 100%;
            * `prepayment` — предоплата;
            * `advance` — аванс;
            * `full_payment` — полный расчет;
            * `partial_payment` — частичный расчет и кредит;
            * `credit` — передача в кредит;
            * `credit_payment` — оплата кредита.


            Если значение не передано, по умолчанию в онлайн-кассу
            отправляется признак предмета расчета `full_payment`. 
          type: string
          enum:
            - full_prepayment
            - prepayment
            - advance
            - full_payment
            - partial_payment
            - credit
            - credit_payment
          default: full_payment
        PaymentObject:
          description: |
            `Тег ФФД: 1212`
             
            Признак предмета расчета:
            * `commodity` — товар;
            * `excise` — подакцизный товар;
            * `job` — работа;
            * `service` — услуга;
            * `gambling_bet` — ставка азартной игры;
            * `gambling_prize` — выигрыш азартной игры;
            * `lottery` — лотерейный билет;
            * `lottery_prize` — выигрыш лотереи;
            * `intellectual_activity` — предоставление результатов интеллектуальной деятельности;
            * `payment` — платеж;
            * `agent_commission` — агентское вознаграждение;
            * `composite` — составной предмет расчета;
            * `another` — иной предмет расчета.     


            Если значение не передано, по умолчанию в онлайн-кассу
            отправляется признак предмета расчета `commodity`.
          type: string
          enum:
            - commodity
            - excise
            - job
            - service
            - gambling_bet
            - gambling_prize
            - lottery
            - lottery_prize
            - intellectual_activity
            - payment
            - agent_commission
            - composite
            - another
          default: commodity
        Tax:
          description: |
            `Тег ФФД: 1199`

            Ставка НДС:
            * `none` — без НДС,
            * `vat0` — НДС по ставке 0%;
            * `vat5` — НДС по ставке 5%;
            * `vat7` — НДС по ставке 7%;
            * `vat10` — НДС по ставке 10%;
            * `vat22` — НДС по ставке 22%;
            * `vat105` — НДС чека по расчетной ставке 5/105;
            * `vat107` — НДС чека по расчетной ставке 7/107;
            * `vat110` — НДС чека по расчетной ставке 10/110;
            * `vat122` — НДС чека по расчетной ставке 22/122.
          type: string
          enum:
            - none
            - vat0
            - vat5
            - vat7
            - vat10
            - vat22
            - vat105
            - vat107
            - vat110
            - vat122
          example: vat10
        Ean13:
          description: |
            `Тег ФФД: 1162`

            Штрихкод. В зависимости от типа кассы требования к штрихкоду могут отличаться:
            * АТОЛ Онлайн — шестнадцатеричное
            представление с пробелами. Максимальная
            длина — 32 байта (^[a-fA-F0-9]{2}$)|(^([afA-F0-9]{2}\\s){1,31}[a-fA-F0-9]{2}$).<br>
            Пример:
            `00 00 00 01 00 21 FA 41 00 23 05 41 00
            00 00 00 00 00 00 00 00 00 00 00 00 00
            00 00 12 00 AB 00`

            * CloudKassir — длина строки: четная, от 8 до
            150 байт. То есть от 16 до 300 ASCII символов
            ['0' - '9' , 'A' - 'F' ] шестнадцатеричного
            представления кода маркировки товара.<br>
            Пример:
            `303130323930303030630333435`

            * OrangeData — строка, содержащая `Base64`-
            кодированный массив от 8 до 32 байт.<br>
            Пример:
            `igQVAAADMTIzNDU2Nzg5MDEyMwAAAAAAAQ==`


            Если в запросе передается параметр `Ean13`, который не
            прошел валидацию, то вернется неуспешный
            ответ с текстом ошибки в параметре `message` =
            `Неверный параметр Ean13`.
          type: string
          maxLength: 300
          example: '0123456789'
        ShopCode:
          description: |
            Код магазина. Для параметра `ShopCode`
            нужно использовать значение параметра
            `Submerchant_ID`, который возвращается в ответе при
            регистрации магазинов через XML. Если XML не
            используется, передавать поле не нужно.
          type: string
          example: '12345'
        AgentData:
          description: |
            Данные агента.
            Параметр обязательный, если используется агентская схема.
          $ref: '#/components/schemas/AgentData'
        SupplierInfo:
          description: |
            Данные поставщика платежного агента.
            Параметр обязательный, если передается значение `AgentSign` в объекте `AgentData`.
          $ref: '#/components/schemas/SupplierInfo'
    Payments:
      type: object
      description: |
        Детали платежа.


        Если объект не передан, автоматически указывается итоговая сумма чека с видом оплаты «Безналичный». 
         
         
        Если передан объект `receipt.Payments`, значение в `Electronic` должно быть равно итоговому значению `Amount` в методе [Инициировать платеж](/eacq/api/init).
        При этом сумма введенных значений по всем видам оплат, включая `Electronic`, должна быть равна сумме (`Amount`) всех товаров, которые были переданы в объекте `receipt.Items`.
      required:
        - Electronic
      properties:
        Cash:
          description: |
            `Тег ФФД: 1031.`<br>

            Вид оплаты «Наличные».
            Сумма к оплате в копейках.

            Минимальное значение — 0.
          type: number
          example: 90000
        Electronic:
          description: |
            `Тег ФФД: 1081.`<br>

            Вид оплаты «Безналичный».

            Минимальное значение — 0.
          type: number
          example: 19200
        AdvancePayment:
          description: |
            `Тег ФФД: 1215.`<br>

            Вид оплаты «Предварительная оплата (Аванс)».

            Минимальное значение — 0.
          type: number
          example: 0
        Credit:
          description: |
            `Тег ФФД: 1216.`<br>

            Вид оплаты «Постоплата (Кредит)».

            Минимальное значение — 0.
          type: number
          example: 0
        Provision:
          description: |
            `Тег ФФД: 1217.`<br>

            Вид оплаты «Иная форма оплаты».

            Минимальное значение — 0.
          type: number
          example: 0
    AddUserProp:
      type: object
      description: |
        Дополнительный реквизит пользователя.
      required:
        - Name
        - Value
      properties:
        Name:
          description: |
            `Тег ФФД: 1085`

            Наименование дополнительного реквизита пользователя.
          type: string
          minLength: 1
          maxLength: 64
        Value:
          description: |
            `Тег ФФД: 1086`

            Значение дополнительного реквизита пользователя.
          type: string
          minLength: 1
          maxLength: 256
    ReceiptFfd105:
      type: object
      description: Объект с информацией о видах суммы платежа. Если объект не передан, автоматически указывается итоговая сумма чека с видом оплаты «Безналичная».
      required:
        - Items
        - Taxation
      properties:
        Items:
          description: Массив позиций чека с информацией о товарах. Количество товаров в чеке — не больше 100.
          type: array
          items:
            $ref: '#/components/schemas/ItemsFfd105'
        Email:
          description: |
            `Тег ФФД: 1008`

            Электронная почта покупателя.
            Параметр обязательный, если не передан `Phone`.
          type: string
          format: email
          maxLength: 64
          example: a@test.ru
        Phone:
          description: |
            `Тег ФФД: 1008`

            Телефон покупателя в формате `+{Ц}`.
            Параметр обязательный, если не передан `Email`.
          type: string
          maxLength: 64
          example: '+79031234567'
        Taxation:
          description: |
            `Тег ФФД: 1055`

            Система налогообложения:
            * `osn` — общая СН;
            * `usn_income` — упрощенная СН (доходы). Налоговая автоматически определит АУСН по ИНН и пробьет чеки с нужной СНО;
            * `usn_income_outcome` — упрощенная СН (доходы минус расходы). Налоговая автоматически определит АУСН по ИНН и пробьет чеки с нужной СНО;
            * `esn` — единый сельскохозяйственный налог;
            * `patent` — патентная СН.
          type: string
          enum:
            - osn
            - usn_income
            - usn_income_outcome
            - esn
            - patent
          example: osn
        Payments:
          description: |
            Детали платежа.


            Если объект не передан, автоматически указывается итоговая сумма чека с видом оплаты «Безналичный».


            Если передан объект `receipt.Payments`, значение в `Electronic`
            должно быть равно итоговому значению `Amount` в методе [Инициировать платеж](/eacq/api/init). 
            При этом сумма введенных значений по всем видам оплат, 
            включая `Electronic`, должна быть равна сумме (`Amount`) всех товаров, 
            которые были переданы в объекте `receipt.Items`.
          $ref: '#/components/schemas/Payments'
        AddUserProp:
          description: |
            `Тег ФФД: 1084`

            Дополнительный реквизит пользователя.
          $ref: '#/components/schemas/AddUserProp'
        additionalCheckProps:
          description: |
            `Тег ФФД: 1192`

            Дополнительный реквизит чека (БСО).
          type: string
          maxLength: 16
    ClientInfo:
      type: object
      description: |
        Информация о покупателе.
      properties:
        Birthdate:
          description: |
            `Тег ФФД: 1243`

            Дата рождения покупателя в формате `ДД.ММ.ГГГГ`.
          type: string
        Citizenship:
          description: |
            `Тег ФФД: 1244`

            Числовой код страны, гражданином которой является покупатель. Код страны указывается в соответствии с Общероссийским классификатором стран мира [ОКСМ](https://classifikators.ru/oksm).
          type: string
        DocumentCode:
          description: |
            `Тег ФФД: 1245`

            Числовой код вида документа, удостоверяющего личность.

            Может принимать только следующие значения:

            * `21` — паспорт гражданина Российской Федерации.
            * `22` — заграничный паспорт гражданина Российской Федерации.
            * `26` — временное удостоверение личности гражданина Российской Федерации.
            * `27` — свидетельство о рождении гражданина Российской Федерации в возрасте до 14 лет. 
            * `28` — иные внутренние документы, признаваемые документами, удостоверяющими личность гражданина Российской Федерации в соответствии с законодательством Российской Федерации.
            * `31` — паспорт иностранного гражданина.
            * `32` — иные документы, признаваемые документами, удостоверяющими личность иностранного гражданина в соответствии с законодательством Российской Федерации и международным договором Российской Федерации.
            * `33` — документ, выданный иностранным государством и признаваемый в соответствии с международным договором Российской Федерации в качестве документа, удостоверяющего личность лица безгражданства.
            * `34` — вид на жительство.
            * `35` - разрешение на временное проживание.
            * `36` — свидетельство о признании лица без гражданства беженцем на территории Российской Федерации.
            * `37` — удостоверение беженца.
            * `38` — иные документы, признаваемые документами, удостоверяющими личность лиц без гражданства в соответствии с законодательством Российской Федерации и международным договором Российской Федерации.
            * `40` — документ, удостоверяющий личность лица, не имеющего действительного документа, удостоверяющего личность, на период рассмотрения заявления о признании гражданином Российской Федерации или о приеме в гражданство Российской Федерации.
          type: string
          example: '21'
        DocumentData:
          description: |
            `Тег ФФД: 1246`

            Реквизиты документа, удостоверяющего личность. Например, серия и номер паспорта.
          type: string
        Address:
          description: |
            `Тег ФФД: 1254`

            Адрес покупателя-грузополучателя.
          type: string
          maxLength: 256
    MarkCode:
      type: object
      description: |
        Код маркировки. Предназначен 
        для нанесения на потребительскую упаковку, 
        товары или товарный ярлык.      
            
            
        Включается в чек, если предметом расчета является товар, который подлежит обязательной маркировке сканером — соответствующий код в поле `paymentObject`.
      required:
        - MarkCodeType
        - Value
      properties:
        MarkCodeType:
          description: |
            Тип штрихкода:
            * `UNKNOWN` — код товара, формат которого не
            идентифицирован, как один из реквизитов;
            * `EAN8` — код товара в формате EAN-8;
            * `EAN13` — код товара в формате EAN-13;
            * `ITF14` — код товара в формате ITF-14;
            * `GS10` — код товара в формате GS1,
            который нанесен на товар, не подлежащий
            маркировке;
            * `GS1M` — код товара в формате GS1,
            который нанесен на товар, подлежащий
            маркировке;
            * `SHORT` — код товара в формате короткого кода
            маркировки, который нанесен на товар;
            * `FUR` — контрольно-идентификационный знак
            мехового изделия;
            * `EGAIS20` — код товара в формате ЕГАИС-2.0;
            * `EGAIS30` — код товара в формате ЕГАИС-3.0;
            * `RAWCODE` — код маркировки, как он был прочитан сканером.
          type: string
          example: EAN8
        Value:
          description: |
            Код маркировки.
          type: string
          example: '12345678'
    MarkQuantity:
      type: object
      description: |
        Реквизит «Дробное количество маркированного товара». 
        Передается, только если расчет осуществляется 
        за маркированный товар — соответствующий код в поле 
        `paymentObject` и значение в поле `measurementUnit` 
        равно `0`.


        Пример: 
        ```
              {
              "numenator": "1"
              "denominator" "2"  
              }
        ```
      properties:
        Numerator:
          description: |
            `Тег ФФД: 1293`

            Числитель дробной части предмета расчета. 
            Значение должно быть строго меньше
            значения реквизита «знаменатель».
          type: number
          example: 1
        Denominator:
          description: |
            `Тег ФФД: 1294`  

            Знаменатель дробной части предмета расчета. 
            Значение равно количеству товара в партии (упаковке), 
            которая имет общий код маркировки товара.
          type: number
          example: 2
    SectoralItemProps:
      type: object
      description: |
        Отраслевой реквизит предмета расчета. Указывается только для товаров, которые подлежат обязательной маркировке сканером. Включение этого реквизита предусмотрено НПА отраслевого регулирования для
        соответствующей товарной группы.
      required:
        - FederalId
        - Date
        - Number
        - Value
      properties:
        FederalId:
          description: |
            `Тег ФФД: 1262`   

            Идентификатор ФОИВ — федеральный орган
            исполнительной власти.
          type: string
          example: '001'
        Date:
          description: |
            `Тег ФФД: 1263` 

            Дата нормативного акта ФОИВ.
          type: string
          format: date
          example: 21.11.2020
        Number:
          description: |
            `Тег ФФД: 1264`

            Номер нормативного акта ФОИВ.
          type: string
          maxLength: 32
          example: 123/43
        Value:
          description: |
            `Тег ФФД: 1265`    

            Состав значений, котрые определены нормативным актом ФОИВ.
          type: string
          maxLength: 256
          example: test value SectoralItemProps
    ItemsFfd12:
      type: object
      description: |
        Массив с информацией о товарах.  
         

        Параметры, предусмотренные в протоколе для отправки чеков по маркируемым товарам. Необязательные 
        для товаров без маркировки. 


        Если используется ФФД 1.2, но реализуемый товар не
        подлежит маркировке, поля можно не отправлять или отправить со значением `null`.
      required:
        - Name
        - Price
        - Quantity
        - Amount
        - Tax
        - PaymentMethod
        - PaymentObject
        - MeasurementUnit
      properties:
        AgentData:
          $ref: '#/components/schemas/AgentData'
        SupplierInfo:
          $ref: '#/components/schemas/SupplierInfo'
        Name:
          description: |
            `Тег ФФД: 1030` 

            Наименование товара.
          type: string
          maxLength: 128
          example: Наименование товара 1
        Price:
          description: |
            `Тег ФФД: 1079`

            Цена в копейках.
          type: integer
          format: int64
          example: 10000
        Quantity:
          description: |
            `Тег ФФД: 1023`
                  
            Количество или вес товара. Максимальное количество символов — 11, где:
            * целая часть — не больше 5 знаков, 
            * дробная — не больше 6 знаков.

            Для касс Ferma значение должно быть целым числом, если `MeasurementUnit=шт`.
          type: number
          example: 1
        Amount:
          description: |
            `Тег ФФД: 1043`

            Стоимость товара в копейках.
            Произведение `Quantity` и `Price`.
          type: integer
          format: int64
          example: 10000
        Tax:
          description: |
            `Тег ФФД: 1199`

            Ставка НДС:
            * `none` — без НДС;
            * `vat0` — НДС по ставке 0%;
            * `vat5` — НДС по ставке 5%;
            * `vat7` — НДС по ставке 7%;
            * `vat10` — НДС по ставке 10%;
            * `vat22` — НДС по ставке 22%;
            * `vat105` — НДС чека по расчетной ставке 5/105;
            * `vat107` — НДС чека по расчетной ставке 7/107;
            * `vat110` — НДС чека по расчетной ставке 10/110;
            * `vat122` — НДС чека по расчетной ставке 22/122. 
          type: string
          enum:
            - none
            - vat0
            - vat5
            - vat7
            - vat10
            - vat22
            - vat105
            - vat107
            - vat110
            - vat122
          example: vat10
        PaymentMethod:
          description: |
            `Тег ФФД: 1214`

            Признак способа расчета:
             * `full_prepayment` — предоплата 100%;
             * `prepayment` — предоплата;
             * `advance` — аванс;
             * `full_payment` — полный расчет;
             * `partial_payment` — частичный расчет и кредит;
             * `credit` — передача в кредит;
             * `credit_payment` — оплата кредита. 


            Если значение не передано, по умолчанию в онлайн-кассу
            отправляется признак предмета расчета `full_payment`. 
          type: string
          enum:
            - full_prepayment
            - prepayment
            - advance
            - full_payment
            - partial_payment
            - credit
            - credit_payment
          default: full_payment
          example: full_prepayment
        PaymentObject:
          description: |
            `Тег ФФД: 1212`

            Значения реквизита «Признак предмета расчета» — тег 1212, таблица 101:

            * `commodity` — товар;
            * `excise` — подакцизный товар;
            * `job` — работа;
            * `service` — услуга;
            * `gambling_bet` — ставка азартной игры;
            * `gambling_prize` — выигрыш азартной игры;
            * `lottery` — лотерейный билет;
            * `lottery_prize` — выигрыш лотереи;
            * `intellectual_activity` — предоставление результатов интеллектуальной деятельности;
            * `payment` — платеж;
            * `agent_commission` — агентское
              вознаграждение;
            * `contribution` — выплата;
            * `property_rights` — имущественное право;
            * `unrealization` — внереализационный доход;
            * `tax_reduction` — иные платежи и взносы;
            * `trade_fee` — торговый сбор;
            * `resort_tax` — курортный сбор;
            * `pledge` — залог;
            * `income_decrease` — расход;
            * `ie_pension_insurance_without_payments` — взносы на ОПС ИП;
            * `ie_pension_insurance_with_payments` — взносы на ОПС;
            * `ie_medical_insurance_without_payments` — взносы на ОМС ИП;
            * `ie_medical_insurance_with_payments` — взносы на ОМС;
            * `social_insurance` — взносы на ОСС;
            * `casino_chips` — платеж казино;
            * `agent_payment` — выдача ДС;
            * `excisable_goods_without_marking_code` — АТНМ;
            * `excisable_goods_with_marking_code` — АТМ;
            * `goods_without_marking_code` — ТНМ;
            * `goods_with_marking_code` — ТМ;
            * `another` — иной предмет расчета.
          type: string
          enum:
            - commodity
            - excise
            - job
            - service
            - gambling_bet
            - gambling_prize
            - lottery
            - lottery_prize
            - intellectual_activity
            - payment
            - agent_commission
            - contribution
            - property_rights
            - unrealization
            - tax_reduction
            - trade_fee
            - resort_tax
            - pledge
            - income_decrease
            - ie_pension_insurance_without_payments
            - ie_pension_insurance_with_payments
            - ie_medical_insurance_without_payments
            - ie_medical_insurance_with_payments
            - social_insurance
            - casino_chips
            - agent_payment
            - excisable_goods_without_marking_code
            - excisable_goods_with_marking_code
            - goods_without_marking_code
            - goods_with_marking_code
            - another
          example: goods_with_marking_code
        UserData:
          description: |
            `Тег ФФД: 1191`


            Дополнительный реквизит предмета расчета.
          type: string
          maxLength: 64
          example: Данные пользователя ext.test.qa@tbank.ru
        Excise:
          description: |
            `Тег ФФД: 1229` 

            Сумма акциза в рублях с учетом копеек, которая включена в стоимость предмета расчета:
            * целая часть — не больше 8 знаков;
            * дробная часть — не больше 2 знаков;
            * значение не может быть отрицательным.

            Максимальное значение — 1 000 000 копеек.
          type: number
          example: 12.2
        CountryCode:
          description: |
            `Тег ФФД: 1230`

            Цифровой код страны происхождения товара в
            соответствии с Общероссийским
            классификатором стран мира — 3 цифры.
          type: string
          maxLength: 3
          example: '056'
        DeclarationNumber:
          description: |
            `Тег ФФД: 1231`
             
            Номер таможенной декларации.
          type: string
          maxLength: 32
          example: '12345678901'
        MeasurementUnit:
          description: |
            `Тег ФФД: 2108`  

            Единицы измерения: 
            * `шт` — применяется для предметов расчета, которые могут быть реализованы поштучно или единицами;
            * `г` — грамм;
            * `кг` — килограмм;
            * `т` — тонна;
            * `см` — сантиметр;
            * `дм` — дециметр;
            * `м` — метр;
            * `см2` — квадратный сантиметр;
            * `дм2` — квадратный дециметр;
            * `м2` — квадратный метр;
            * `мл` — миллиметр;
            * `л` — литр; 
            * `м3` — кубический метр;
            * `кВт*ч` — киловатт/час;
            * `Гкал` — гигакалория;
            * `сут` или `дн` — сутки или день;
            * `ч` — час;
            * `мин` — минута;
            * `с` — секунда;
            * `Кбайт` — килобайт;
            * `Мбайт` — мегабайт;
            * `Гбайт` — гигабайт;
            * `Тбайт` — терабайт;
            * `—` — применяется при использовании иных единиц измерения


            Также возможна передача произвольных значений.


            Параметр обязательный, если версия ФФД онлайн-кассы — `1.2`.
          type: string
          maxLength: 16
          example: шт
        MarkProcessingMode:
          description: |
            `Тег ФФД: 2102`

            Режим обработки кода маркировки.
            Должен принимать значение, равное `0`.


            Включается в чек, если предметом расчета 
            является товар, который подлежит обязательной
            маркировке сканером — соответствующий код в поле `paymentObject`.
          type: string
        MarkCode:
          type: object
          description: |
            `Тег ФФД: 1163`

            Код маркировки. Предназначен для нанесения на потребительскую упаковку, товары или товарный ярлык.


            Включается в чек, если предметом расчета является товар, который подлежит обязательной маркировке сканером — соответствующий код в поле `paymentObject`.


            С **01.09.2025** для чеков с маркированными товарами обязательно передается часовая зона места расчета (тег 1011). По умолчанию — Москва. Для изменения напишите на <a href="mailto:acq_help@tbank.ru">acq_help@tbank.ru</a>.
          $ref: '#/components/schemas/MarkCode'
        MarkQuantity:
          $ref: '#/components/schemas/MarkQuantity'
        SectoralItemProps:
          description: |
            Отраслевой реквизит предмета расчета. Указывается только для товаров, которые подлежат обязательной маркировке сканером. Включение этого реквизита предусмотрено НПА отраслевого регулирования для
            соответствующей товарной группы.
          items:
            $ref: '#/components/schemas/SectoralItemProps'
    OperatingCheckProps:
      type: object
      description: |
        Операционный реквизит чека.
      required:
        - Name
        - Value
        - Timestamp
      properties:
        Name:
          description: |
            Идентификатор операции.
          type: string
          maxLength: 1
        Value:
          description: |
            Данные операции.
          type: string
          maxLength: 64
        Timestamp:
          description: |
            Дата и время операции.
            Значение в формате `dd.mm.yyyy HH:MM:SS`.
          type: string
    SectoralCheckProps:
      type: object
      description: |
        Отраслевой реквизит чека.
      required:
        - FederalId
        - Date
        - Number
        - Value
      properties:
        FederalId:
          description: |
            `Тег ФФД: 1262`

            Идентификатор федерального органа исполнительной власти (ФОИВ).

            Может принимать значения от `001` до `072`.
          type: string
          minLength: 1
          maxLength: 3
        Date:
          description: |
            Дата нормативного акта федерального органа исполнительной власти (ФОИВ), регламентирующего порядок заполнения значения отраслевого реквизита.

            Значение в формате `DD.MM.YYYY`.
          type: string
          minLength: 10
          maxLength: 10
        Number:
          description: |
            Номер нормативного акта федерального органа исполнительной власти (ФОИВ), регламентирующего порядок заполнения значения отраслевого реквизита.
          type: string
          minLength: 1
          maxLength: 32
        Value:
          description: |
            Состав значений, определенных нормативным актом федерального органа исполнительной власти (ФОИВ).
          type: string
          minLength: 1
          maxLength: 256
    ReceiptFfd12:
      type: object
      description: Объект с информацией о видах суммы платежа. Если не передан, автоматически указывается итоговая сумма чека с видом оплаты «Безналичная».
      required:
        - Taxation
        - Items
      properties:
        ClientInfo:
          $ref: '#/components/schemas/ClientInfo'
        Taxation:
          description: |
            `Тег ФФД: 1055`

            Система налогообложения:
            * `osn` — общая СН;
            * `usn_income` — упрощенная СН (доходы). Налоговая автоматически определит АУСН по ИНН и пробьет чеки с нужной СНО;
            * `usn_income_outcome` — упрощенная СН (доходы минус расходы). Налоговая автоматически определит АУСН по ИНН и пробьет чеки с нужной СНО;
            * `esn` — единый сельскохозяйственный налог;
            * `patent` — патентная СН.
          type: string
          enum:
            - osn
            - usn_income
            - usn_income_outcome
            - esn
            - patent
          example: osn
        Email:
          description: |
            `Тег ФФД: 1008`
                
            Электронная почта покупателя.
            Параметр обязательный, если не передан `Phone`.
          type: string
          format: email
          maxLength: 64
          example: a@test.ru
        Phone:
          description: |
            `Тег ФФД: 1008`
                 
            Телефон покупателя в формате `+{Ц}`.
            Параметр обязательный, если не передан `Email`.
          type: string
          maxLength: 64
          example: '+79031234567'
        Customer:
          description: |
            `Тег ФФД: 1227`
                
            Идентификатор/имя покупателя. 


            В параметре можно передавать только email или номер телефона.
          type: string
          example: '78894325'
        CustomerInn:
          description: |
            `Тег ФФД: 1228`

            ИНН покупателя.
          type: string
          example: '788621292'
        Items:
          description: |
            Массив с информацией о товарах. Количество товаров в чеке — не больше 100.


            Параметры, которые предусмотрены в протоколе для отправки чеков по маркируемым товарам, не являются обязательными для товаров без маркировки. 


            Если используется ФФД 1.2, но реализуемый товар не подлежит маркировке, поля можно не отправлять или отправить со значением `null`.
          items:
            $ref: '#/components/schemas/ItemsFfd12'
        Payments:
          description: |
            Детали платежа.


            Если объект не передан, автоматически указывается итоговая сумма чека с видом оплаты «Безналичный».


            Если передан объект `receipt.Payments`, значение в `Electronic` должно быть равно итоговому значению `Amount` в методе [Инициировать платеж](/eacq/api/init).
            При этом сумма введенных значений по всем видам оплат, включая `Electronic`, должна быть равна сумме (`Amount`) всех товаров, которые были переданы в объекте `receipt.Items`
          type: object
          $ref: '#/components/schemas/Payments'
        OperatingCheckProps:
          description: |
            `Тег ФФД: 1270`

            Операционный реквизит чека.
          type: object
          $ref: '#/components/schemas/OperatingCheckProps'
        SectoralCheckProps:
          description: |
            `Тег ФФД: 1261`

            Отраслевой реквизит чека.
          items:
            $ref: '#/components/schemas/SectoralCheckProps'
        AddUserProp:
          description: |
            `Тег ФФД: 1084`

            Дополнительный реквизит пользователя.
          type: object
          $ref: '#/components/schemas/AddUserProp'
        AdditionalCheckProps:
          description: |
            `Тег ФФД: 1192`

            Дополнительный реквизит чека (БСО).
          type: string
          minLength: 1
          maxLength: 16
    Shops:
      type: object
      description: JSON-объект с данными маркетплейса. Обязательный для маркетплейсов.
      required:
        - ShopCode
        - Amount
      properties:
        ShopCode:
          description: |
            Код магазина.
          type: string
          example: '700456'
        Amount:
          description: |
            Сумма в копейках, которая относится к указанному `ShopCode`.
          type: integer
          format: int64
          example: 10000
        Name:
          description: |
            Наименование товара.
          type: string
          maxLength: 128
          example: Товар
        Fee:
          description: |
            Сумма комиссии в копейках, которая удерживается из возмещения партнера в пользу маркетплейса.
            Если параметр не передан, используется комиссия, которая была указана при регистрации.
          type: string
          example: '500'
    InitRequest:
      type: object
      required:
        - TerminalKey
        - Token
        - Amount
        - OrderId
      properties:
        TerminalKey:
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          type: string
          maxLength: 64
          example: TBankTest
        Amount:
          description: |
            * Сумма в копейках. Например, 3 руб. 12коп. — это число 312.
            * Параметр должен быть равен сумме всех параметров `Amount`, переданных в объекте `Items`.
            * Минимальная сумма операции с помощью СБП составляет 10 руб.
          type: integer
          format: int64
          example: 140000
        OrderId:
          description: Идентификатор заказа в системе мерчанта. Должен быть уникальным для каждой операции.
          type: string
          maxLength: 50
          example: '21050'
        Token:
          description: Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
          type: string
          example: 7241ac8307f349afb7bb9dda760717721bbb45950b97c67289f23d8c69cc7b96
        Description:
          description: |
            Описание заказа.
            Значение параметра будет отображено на платежной форме.

            Максимальная длина при оплате картой — 250 символов.

            Параметр обязательный при привязке и одновременной оплате через СБП. При оплате через СБП текст из этого параметра отобразится в мобильном банке покупателя.

            Максимальная длина при оплате через СБП и платежах по сохраненным реквизитам - 140 символов.
          type: string
          maxLength: 140
          example: Подарочная карта на 1400.00 рублей
        CustomerKey:
          description: |
            Идентификатор покупателя в системе мерчанта. Нужен для сохранения карт на платежной форме — платежи в один клик.


            Параметр обязательный, если передан параметр `Recurrent`=`Y` и автоплатеж проводится по карте.


            Если передан, в уведомлении будут указаны `CustomerKey` и его `CardId`. Подробнее — в методе [Получить список карт покупателя](/eacq/api/get-card-list).
          type: string
          maxLength: 255
        Recurrent:
          description: |
            Признак родительского CC-платежа. Обязателен для проведения операции с сохранением реквизитов карты покупателя. 


            Если передается и установлен в `Y`, при платеже будут сохранены реквизиты карты покупателя. 
            В этом случае после оплаты в уведомлении на `AUTHORIZED` будет передан параметр `RebillId` для использования в методе [Провести платеж по сохраненным реквизитам](/eacq/api/charge).
            Для привязки и одновременной оплаты по СБП передавайте `Y`.
          type: string
          maxLength: 1
          example: 'Y'
          enum:
            - 'Y'
        PayType:
          description: |
            Определяет тип проведения платежа:

            * `O` — одностадийная оплата;
            * `T` — двухстадийная оплата. 


            Если параметр передан, используется его значение, если нет — значение из настроек терминала.
          type: string
          enum:
            - O
            - T
        Language:
          description: |
            Язык платежной формы:

            * `ru` — русский;
            * `en` — английский. 


            Если параметр не передан, форма откроется на русском языке.
          type: string
          maxLength: 2
          example: ru
          default: ru
        NotificationURL:
          description: |
            URL на веб-сайте мерчанта, куда будет отправлен POST-запрос о статусе выполнения вызываемых методов — настраивается в личном кабинете.


            Если параметр передан, используется его значение, если нет — значение из настроек терминала.


            [Подробнее](/eacq/intro/developer/notification)
          type: string
          format: uri
        SuccessURL:
          description: |
            URL на веб-сайте мерчанта, куда будет переведен покупатель в случае успешной оплаты — настраивается в личном кабинете.


            Если параметр передан, используется его значение, если нет — значение из настроек терминала.
          type: string
          format: uri
        FailURL:
          description: |
            URL на веб-сайте мерчанта, куда будет переведен покупатель в случае неуспешной оплаты — настраивается в личном кабинете.


            Если параметр передан, используется его значение, если нет — значение из настроек терминала.
          type: string
          format: uri
        RedirectDueDate:
          description: |
            Срок жизни ссылки или динамического QR-кода СБП, если выбран этот способ оплаты.


            Если дата в параметре меньше текущей, оплата по ссылке и QR будет недоступна.

            * Минимальное значение — 1 минута от текущей даты.
            * Максимальное значение — 90 дней от текущей даты.
            * Формат даты — `YYYY-MM-DDTHH24:MI:SS+GMT`.


            Пример даты — `2016-08-31T12:28:00+03:00`.


            Если параметр не был передан, проверяется настроечный параметр терминала `REDIRECT_TIMEOUT`, который содержит значение срока жизни ссылки в часах. Если его значение:
            * больше нуля — оно будет установлено в качестве срока жизни ссылки или динамического QR-кода;
            * меньше нуля — устанавливается значение по умолчанию: 1440 мин. (1 сутки).
          type: string
          format: date-time
        DATA:
          description: |
            JSON-объект с дополнительными параметрами по операции и настройками в формате `ключ:значение`.


            Максимальная длина ключа — 20 знаков, значения — 100 знаков. 


            Максимальное количество пар `ключ:значение` — не больше 20.


            Если ключи или значения содержат в себе специальные символы, получившееся значение должно быть закодировано функцией `urlencode`. 

            <!--
            Параметр `notificationEnableSource` позволяет отправлять уведомлении, только если Source платежа входит в перечень указанных в параметре — он также есть в параметрах сессии — `T‑Pay`, `sbpqr`.
            Пример: `notificationEnableSource=T‑Pay`. 
            -->
          oneOf:
            - $ref: '#/components/schemas/Common'
            - $ref: '#/components/schemas/TPay'
            - $ref: '#/components/schemas/LongPay'
        Receipt:
          description: JSON-объект с данными чека. Обязателен, если подключена онлайн-касса.
          oneOf:
            - $ref: '#/components/schemas/ReceiptFfd105'
            - $ref: '#/components/schemas/ReceiptFfd12'
        Shops:
          type: array
          description: JSON-объект с данными маркетплейса. Параметр обязательный для маркетплейсов.
          items:
            $ref: '#/components/schemas/Shops'
    SessionStatusEnum:
      type: string
      description: |
        Статус транзакции:
        * `NEW` — платеж создан;
        * `AUTHORIZED` — платеж авторизован;
        * `CONFIRMED` — платеж подтверждён;
        * `REVERSED` — платеж отменён;
        * `REFUNDED` — возврат выполнен;
        * `PARTIAL_REFUNDED` — частичный возврат;
        * `REJECTED` — платеж отклонён;
        * `DEADLINE_EXPIRED` — срок жизни платежа истёк;
        * `3DS_CHECKING` — идёт проверка 3DS;
        * `3DS_CHECKED` — проверка 3DS завершена;
        * `FORM_SHOWED` — форма показана;
      enum:
        - NEW
        - AUTHORIZED
        - CONFIRMED
        - REVERSED
        - REFUNDED
        - PARTIAL_REFUNDED
        - REJECTED
        - DEADLINE_EXPIRED
        - 3DS_CHECKING
        - 3DS_CHECKED
        - FORM_SHOWED
    InitResponse:
      type: object
      required:
        - TerminalKey
        - Amount
        - OrderId
        - Success
        - PaymentId
        - ErrorCode
        - Status
      properties:
        TerminalKey:
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          type: string
          maxLength: 20
          example: TBankTest
        Amount:
          description: |
            Сумма в копейках.
          type: integer
          format: int64
          example: 100000
        OrderId:
          description: |
            Идентификатор заказа в системе мерчанта. Должен быть уникальным для каждой операции.
          type: string
          maxLength: 36
          example: '21050'
        Success:
          description: |
            Успешность прохождения запроса — `true`/`false`.
          type: boolean
          example: true
        Status:
          description: |
            Статус транзакции.
          allOf:
            - $ref: '#/components/schemas/SessionStatusEnum'
        PaymentId:
          description: |
            Идентификатор платежа в системе Т‑Бизнес.
          type: string
          maxLength: 20
          example: '13660'
        ErrorCode:
          description: |
            Код ошибки.
          type: string
          maxLength: 20
          example: '0'
        PaymentURL:
          description: |
            Ссылка на платежную форму. Параметр возвращается только для мерчантов, которые используют платежную форму Т-Банка.
          type: string
          format: uri
          maxLength: 100
          example: https://pay.tbank.ru/new/fU1ppgqa
        Message:
          description: |
            Краткое описание ошибки.
          type: string
          maxLength: 255
          example: Неверные параметры
        Details:
          description: |
            Подробное описание ошибки.
          type: string
          example: '0'
    ErrorResponse:
      type: object
      description: Стандартная модель ошибки
      properties:
        Success:
          type: boolean
          description: Успешность прохождения запроса — `true`/`false`.
          default: false
        ErrorCode:
          type: string
          description: Код ошибки.
          example: '1051'
        Message:
          type: string
          description: Краткое описание ошибки.
          example: Неверные параметры
        Details:
          type: string
          description: Детальное описание ошибки.
          example: Параметр "PaymentId" не может быть пустым
    Causes:
      type: array
      description: Подробное описание причины ошибки.
      items:
        type: string
      example:
        - Internal Service Error.
    ThreeDSMethodRequest:
      title: Запрос
      type: object
      required:
        - threeDSMethodData
      properties:
        threeDSMethodData:
          type: string
          description: |
            JSON-объект, закодированный в формат `Base64` с параметрами:

            * `threeDSMethodNotificationURL` — обратный адрес, на который будет отправлен запрос после прохождения threeDSMethod;
            * `threeDSServerTransID` — идентификатор платежа из ответа метода [Проверить версию 3DS](/eacq/api/check-3-ds-version). Генерируется 3DS Server.
          example: eyJ0aHJlZURTU2VydmVyVHJhbnNJRCI6IjU2ZTcxMmE1LTE5MGEtNDU4OC05MWJjLWUwODYyNmU3N2M0NCIsInRocmVlRFNNZXRob2ROb3RpZmljYXRpb25VUkwiOiJodHRwczovL3Jlc3QtYXBpLXRlc3QudGlua29mZi5ydS92Mi9Db21wbGV0ZTNEU01ldGhvZHYyIn0
    ThreeDSMethodResponse:
      type: object
      required:
        - threeDSServerTransID
      properties:
        threeDSServerTransID:
          description: |
            Идентификатор платежа, который генерируется 3DS Server.
          type: string
          maxLength: 36
          example: string
    ThreeDSv2:
      type: object
      required:
        - threeDSCompInd
        - language
        - timezone
        - screen_height
        - screen_width
        - cresCallbackUrl
      properties:
        threeDSCompInd:
          type: string
          description: |
            `deviceChannel 02 — BRW`


            Идентификатор выполнения метода [Пройти этап 3DS Method](/eacq/api/three-ds-method):
            * `Y` — выполнение метода успешно завершено;
            * `N` — выполнение метода завершено неуспешно или метод не выполнялся;
            * `U` — в ответе метода [Проверить версию 3DS](/eacq/api/check-3-ds-version) не вернулось значение `threeDSMethodURL`.
          example: 'Y'
        language:
          type: string
          description: |
            `deviceChannel 02 — BRW`


            Язык браузера в формате `IETF BCP47`.
            Рекомендуем получать значение в браузере из глобального объекта `navigator` — `navigator.language`.
          example: RU
        timezone:
          type: string
          description: |
            `deviceChannel 02 — BRW`


            Часовой пояс пользователя в минутах.
            Рекомендуем получать значение в браузере через вызов метода **getTimezoneOffset()**.
          example: '-300'
        screen_height:
          type: string
          description: |
            `deviceChannel 02 — BRW`


            Высота экрана в пикселях.
            Рекомендуем получать значение в браузере из глобального объекта `screen` — `screen.height`.
          example: '1024'
        screen_width:
          type: string
          description: |
            `deviceChannel 02 — BRW`


            Ширина экрана в пикселях.
            Рекомендуем получать значение в браузере из глобального объекта `screen` — `screen.width`.
          example: '967'
        cresCallbackUrl:
          type: string
          description: |
            `deviceChannel 02 — BRW`


            URL, который будет использоваться для получения результата (CRES) после завершения Challenge Flow 
            — аутентификации с дополнительным переходом на страницу ACS.
          maxLength: 256
          example: www.callbackurl.ru
        colorDepth:
          type: string
          description: |
            `deviceChannel 02 — BRW`


            Глубина цвета в битах.


            Допустимые значения — 1/4/8/15/16/24/32/48.


            Рекомендуем получать значение в браузере из глобального объекта `screen` — `screen.colorDepth`.
          default: '48'
          example: '48'
        javaEnabled:
          type: boolean
          description: |
            `deviceChannel 02 — BRW`

            Поддержка Java браузером пользователя: 
            * `true`,
            * `false`. 


            Значение по умолчанию — `false`.
          default: false
          example: false
    FinishAuthorizeRequest:
      type: object
      required:
        - TerminalKey
        - PaymentId
        - CardData
        - Token
      properties:
        TerminalKey:
          type: string
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          example: TBankTest
        PaymentId:
          type: string
          description: |
            Идентификатор платежа в системе Т‑Бизнес.
          maxLength: 20
          example: '700001702044'
        Token:
          type: string
          description: |
            Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
          example: f5a3be479324a6d3a4d9efa0d02880b77d04a91758deddcbd9e752a6df97cab5
        IP:
          type: string
          description: |
            IP-адрес покупателя в формате IPv4 и IPv6. DS платежной системы требует передавать IPv6 в полном формате — 8 групп по 4 символа.


            Параметр обязательный для 3DS второй версии.
          example: 2011:0db8:85a3:0101:0101:8a2e:0370:7334
        SendEmail:
          type: boolean
          description: |
            Отправка уведомлений об оплате на почту покупателя:

            * `true` — отправлять;
            * `false` — не отправлять.
        Source:
          type: string
          description: |
            Источник платежа.
            Значение параметра зависит от параметра `Route`:
            - `ACQ` — `cards` или `Cards`;
            - `MC` — `beeline`, `mts`, `tele2`, `megafon`;
            - `EINV` — `einvoicing`;
            - `WM` — `webmoney`.
          enum:
            - cards
            - beeline
            - mts
            - tele2
            - megafon
            - einvoicing
            - webmoney
          example: cards
        DATA:
          type: object
          description: |
            JSON-объект, который содержит дополнительные
            параметры в виде `ключ:значение`. Эти параметры будут переданы на страницу
            оплаты, если она кастомизирована.


            Максимальная длина для каждого передаваемого параметра:

            * ключ — 20 знаков;
            * значение — 100 знаков. 


            Максимальное количество пар `ключ`:`значение` — не больше 20.


            Если ключи или значения содержат в себе специальные символы, получившееся значение должно быть закодировано функцией `urlencode`.
          oneOf:
            - $ref: '#/components/schemas/ThreeDSv2'
            - type: object
              additionalProperties:
                type: string
                example: '11111'
        InfoEmail:
          type: string
          format: email
          description: |
            Адрес почты покупателя.
            Параметр обязательный, если передан `SendEmail=true`.
          example: qwerty@test.com
        EncryptedPaymentData:
          type: string
          description: |
            Данные карты.
            Параметр обязательный только для ApplePay или GooglePay.
        CardData:
          type: string
          description: "Объект `CardData` собирается в виде списка `ключ=значение` (разделитель `;`) и зашифровывается открытым ключом — X509 RSA 2048. Бинарное значение кодируется в `Base64`.\n\nОткрытый ключ генерируется в Т‑Бизнес и выдается при регистрации терминала. \nКлюч доступен в личном кабинете Интернет-эквайринга в разделе **Магазины**.\n\nОбязательные параметры с типом данных `number`:\n\n* `PAN` — номер платежного средства;\n* `ExpDate` —\_месяц и год срока действия платежного средства в формате MMYY.\n\nНеобязательные параметры с типом данных `string`:\n\n* `CardHolder` — имя и фамилия покупателя.\n* `CVV` — код защиты с обратной стороны платежного средства. Параметр необязательный для платежей через Apple Pay с расшифровкой токена на своей стороне.\n* `ECI` — Electronic Commerce Indicator. Индикатор, который показывает степень защиты, применяемой при предоставлении покупателя своих данных ТСП.\n* `CAVV`\_— Cardholder Authentication Verification Value или Accountholder Authentication Value.\n\n\nПример значения элемента формы `CardData`:\n\n```\nPAN=4300000000000777;ExpDate=0519;CardHolder=IVAN PETROV;CVV=111\n```\n\n[Как получить платежный токен для MirPay при интеграции с НСПК](/eacq/scenarios/payments/PCI_DSS/mirpay/#метод-подтвердить-платеж)\n\nЕсли мерчант интегрируется только с банком для проведения платежа по MirPay,\nметод не вызывается. Эквайер самостоятельно получает платежный токен и инициирует авторизацию\nвместо мерчанта.\n\nПри получении `CAVV` в `CardData` оплата будет проводиться как оплата токеном — иначе прохождение 3DS будет регулироваться стандартными настройками терминала или платежа.\n\nПараметр не используется, если передается `EncryptedPaymentData`."
          example: eyJzaWduYXR1cmUiOiJNRVVDSVFEdjNJS1A5WG9nWml4RytUUm9zZWFDK0RGd3RKd2FtMHVEcm91RUVGZVB6Z0lnYXBFbHhxQ3AwQWtZcVVmTFVMaVNhUjBKWkVQNmg 4THFqYks5YkJKQnM5d1x1MDAzZCIsInByb3RvY29sVmVyc2lvbiI6IkVDdjEiLCJzaWduZWRNZXNzYWdlIjoie1wiZW5jcnlwdGVkTWVzc2FnZVwiOlwiQW11dm5OYUIralBsa3VKTitrMUZLSDZFcm1VK2lTY052 L05rR3FFaXIxOHZmSWxkVFJ5L2U4cW5zMXkyanFtcm1acU1JSWNYMUhyTHBxRURpaXkvS3B6SUhNZFllcXRkSVVNOU1tRjNpejU2d2NTZUVVaXU2ODI3QThGcitaYm8xRWtWRjY1TUxRYVY3NlBOUFRndH UvQ1BodW5HUk0rN25KdVhDczVtbkVvOHFma0RNVk8xWktGWDQ4TnVEL2FKcDJQdVVIY2puSnBTZ0pTSDB4U21YSnAzU1MreXFDNm54N254WUEwN2h4YjYvSnp2R2s3ZExDU2hWWGU1Z2haUjNDaFQyV W8rRnpXTWJRRGZtSjBLQW9kc2VlR0xaaitqMzVqOUlKMkhJRFhIUUZZMWNuTW9YVUVoTjgvdEkvRkpqRnJiYVdFRkIzRDZwOFUzT2tkUmVaNHAyYi8yYURNZXVxR1ozSUtjc3R0R2lKMFhQQVhhZXYyQU8 o1M3RRQXVqQXRYdFlaekNTVjVBVXdXZS85T1VcXHUwMDNkXCJ9In0=
        Amount:
          type: integer
          format: int64
          description: |
            Сумма в копейках.
          example: 10000
        deviceChannel:
          type: string
          description: |
            Канал устройства.
            Поддерживаются следующие каналы:
            * `01` — Application (APP);
            * `02` — Browser (BRW).


            Не следует передавать параметр deviceChannel=02 — он установлен по умолчанию и подставляется автоматически.
            Если указать deviceChannel=02 явно, запрос завершится ошибкой:
            ErrorCode=204, Message=Неверные параметры, Details=Неверный токен. Проверьте пару TerminalKey/SecretKey.
          example: '02'
          default: '02'
        Route:
          type: string
          description: |
            Способ платежа.
            Параметр обязательный для ApplePay или GooglePay.
          enum:
            - ACQ
            - MC
            - EINV
            - WM
          example: ACQ
    FinishAuthorizeResponse:
      type: object
      required:
        - TerminalKey
        - Amount
        - OrderId
        - Success
        - ErrorCode
        - Status
      properties:
        TerminalKey:
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          type: string
          maxLength: 20
          example: TBankTest
        Amount:
          description: |
            Сумма в копейках.
          type: integer
          format: int64
          example: 100000
        OrderId:
          description: |
            Идентификатор заказа в системе мерчанта. Должен быть уникальным для каждой операции.
          type: string
          maxLength: 36
          example: '21050'
        Success:
          description: |
            Успешность прохождения запроса — `true`/`false`.
          type: boolean
          example: true
        Status:
          description: |
            Статус транзакции.
            Возвращается один из четырех статусов платежа:
              * `CONFIRMED` — при одностадийной оплате;
              * `AUTHORIZED` — при двухстадийной оплате;
              * `3DS_CHECKING` — когда нужно пройти проверку 3D Secure. Если используется своя платежная форма и платеж завис в этом статусе, нужно обратиться к эмитенту для устранения ошибок оплаты;
              * `REJECTED` — при неуспешном прохождении платежа.
          type: string
          maxLength: 20
          example: NEW
        PaymentId:
          description: |
            Идентификатор платежа в системе Т‑Бизнес.
          type: string
          maxLength: 20
          example: '13660'
        ErrorCode:
          description: |
            Код ошибки.
          type: string
          maxLength: 20
          example: '0'
        Message:
          description: |
            Краткое описание ошибки.
          type: string
          maxLength: 255
          example: Неверные параметры
        Details:
          description: |
            Подробное описание ошибки.
          type: string
          example: '0'
        RebillId:
          type: string
          description: Уникальный идентификатор сохраненных платежных реквизитов покупателя.
          example: '21813157'
        CardId:
          description: Идентификатор платежного средства в системе Т‑Бизнес.
          type: string
    WithoutThreeDS:
      allOf:
        - $ref: '#/components/schemas/FinishAuthorizeResponse'
        - type: object
          properties:
            CardId:
              type: string
              description: |
                Идентификатор платежного средства в системе Т‑Бизнес.
    WithThreeDS:
      allOf:
        - $ref: '#/components/schemas/FinishAuthorizeResponse'
        - type: object
          properties:
            MD:
              type: string
              description: |
                Идентификатор платежа, который возвращается в ответе от ACS.
              example: ACQT-563587431
            PaReq:
              type: string
              description: |
                Результат 3D Secure аутентификации, который возвращается в ответе от ACS.
              example: |
                "eJxVUl1TwjAQ/CtM30s+KLTDHGHQwsiogFh09C2kp1RpC2nLh7/eBAtqnnYvN3ubvUD/kK4bO9RFkmc9hzWp08BM5XGSvfecRTRyA6cvIFppxP
                ARVaVRwD0WhXzHRhL3HMUU73itwKVtyl1Pcs8Nli3pymUQK+z2Sww6joDZYI5bAfUgYeY0OZAzNYparWRWCpBqezWeiDZnLe3BqSmkqMeh4PRy2p
                02BfJThkymKCIsSiAnCCqvslIfhXEG5Eyg0muxKstN0SVkv983yyT7zN/emroiQOwlkF8js8qiwogdklg8rEfT5WK0jj6G7D4cepNo8TWNBmwSDXtAbAfEskTjkPk0
                oF6DeV3a6jLj8VQHmVoXglFTqTFs7IjBn4u/BTBZa7OK8yPODPCwyTM0HSbACwby6/f6xsaoSpNMMN89+uHdV/iUPz2nyat/uxrPXz5nuX/c2nBPTVYxMflwzthJ0hIgVobUeyP1yg469xW+AedOuuM="
            ACSUrl:
              type: string
              format: uri
              description: |
                Если в ответе метода [Подтвердить платеж](/eacq/api/finish-authorize) возвращается статус `3DS_CHECKING`, 
                мерчанту нужно сформировать запрос на URL ACS банка, который выпустил карту — параметр `ACSUrl` в ответе, и вместе с этим перенаправить покупателя на эту же страницу ACSUrl для прохождения 3DS.
              example: https://secure.tcsbank.ru/acs/auth/start.do
    WithThreeDSv2APP:
      allOf:
        - $ref: '#/components/schemas/FinishAuthorizeResponse'
        - type: object
        - required:
            - TdsServerTransId
            - AcsTransId
            - AcsReferenceNumber
            - SdkTransID
          properties:
            TdsServerTransId:
              type: string
              description: |
                Идентификатор платежа, который генерируется 3DS Server. Обязательный параметр для 3DS v2.1.
              example: d93f7c66-3ecf-4d10-ba62-46046e7b7596
            AcsTransId:
              type: string
              description: |
                Идентификатор платежа, который назначается ACS.
              example: aceca6af-56ee-43f0-80ef-ea8d30d5c5b0
            AcsInterface:
              type: string
              format: uri
              description: |
                Обязательное поле, если `Transaction Status` = `C`.`


                Тип пользовательского интерфейса ACS:
                  - `01` — Native UI,
                  - `02` — HTML UI.
              example: '02'
            AcsUiTemplate:
              type: string
              format: uri
              description: |
                Обязательное поле, если `Transaction Status` = `C`.`


                Формат шаблона пользовательского интерфейса ACS: 
                - `01` — Text;
                - `02` — Single Select;
                - `03` — Multi Select;
                - `04` — OOB;
                - `05` — HTML Other (valid only for HTML UI).
              example: '03'
            AcsSignedContent:
              type: string
              format: uri
              description: |
                Обязательное поле, если `Transaction Status` = `C`.


                 JWS-объект, который создан ACS для ARes. Содержит:
                   - ACS URL — 3DS SDK должен отправить Challenge Request на этот URL,
