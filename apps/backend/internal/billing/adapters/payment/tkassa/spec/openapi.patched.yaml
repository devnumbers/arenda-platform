          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
              example:
                Success: false
                ErrorCode: '9999'
                Message: Внутренняя ошибка системы.
                Causes:
                  - Internal Service Error.
  /v2/getConfirmOperation:
    post:
      operationId: GetConfirmOperation
      x-front:
        usage-scenario:
          - name: Получение данных о платеже
            link: /eacq/scenarios/notification/
      tags:
        - Справка по операции
      description: |
        Метод генерирует справку по конкретной операции. 

        Работает только для операций по карте, T‑Pay, СБП и Mir Pay.

        <a href="/eacq/scenarios/notification">Подробнее про способы получения данных о платеже</a>
      summary: Получить справку по операции
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ConfirmByUrlRequest'
                - $ref: '#/components/schemas/ConfirmByEmailRequest'
            examples:
              URL:
                value:
                  TerminalKey: TBankTest
                  CallbackUrl: http://www.tbank.ru
                  PaymentIdList:
                    - 1201206437
                    - 1201206442
                  Token: f2fdd7fec8225872590e1558b7ea258c75df8f300d808006c41ab540dd7514d9
              Email:
                value:
                  TerminalKey: TBankTest
                  PaymentIdList:
                    - 1201206437
                    - 1201206442
                  EmailList:
                    - test1@tbank.ru
                    - test2@tbank.ru
                  Token: f2fdd7fec8225872590e1558b7ea258c75df8f300d808006c41ab540dd7514d9
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConfirmByUrlResponse'
                  - $ref: '#/components/schemas/ConfirmByEmailResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                URL:
                  value:
                    Success: true
                    ErrorCode: 0
                    Message: OK
                    PaymentIdList:
                      - Success: true
                        ErrorCode: 0
                        Message: Запрос на отправку документа принят
                        PaymentId: '1201206442'
                Email:
                  value:
                    Success: true
                    ErrorCode: 0
                    Message: OK
                    PaymentIdList:
                      - Success: true
                        ErrorCode: 0
                        Message: Запрос на отправку документа принят
                        PaymentId: '1201206442'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
              example:
                Success: false
                ErrorCode: '9999'
                Message: Внутренняя ошибка системы.
                Causes:
                  - Internal Service Error.
components:
  schemas:
    '500':
      type: object
      required:
        - ErrorCode
        - Message
        - Causes
      properties:
        Success:
          type: boolean
          description: Успешность прохождения запроса — `true`/`false`.
          example: false
        ErrorCode:
          type: string
          description: Код ошибки.
          example: '9999'
        Message:
          type: string
          description: Описание ошибки.
          example: Внутренняя ошибка системы.
        Causes:
          $ref: '#/components/schemas/Causes'
        StackTrace:
          type: string
          description: Отчет об ошибке.
          example: 'javax.validation.ValidationException: HV000028: Unexpected exception during isValid call. <...>'
    Common:
      type: object
      additionalProperties:
        type: string
      properties:
        OperationInitiatorType:
          type: string
          description: |
            Признак инициатора операции для платежа. Параметр обязательный при создании 
            родительского CC-платежа при оплате картой.
             
            [Подробнее о признаке инициатора операции](/eacq/scenarios/payments/nonPCI/card/#передача-признака-инициатора-операции).

            - `0` — обычный платеж;
            - `1` — CIT CC;
            - `2` — CIT COF;
            - `R` — MIT COF Recurring;
            - `I` — MIT COF Installment;
            - `D` — MIT COF Delayed-Charge;
            - `N` — MIT COF No-Show.

            Если передавать значения параметров, которые не соответствуют таблице, MAPI вернет ошибку 1126 — несопоставимые 
            значения `rebillId` или `Recurrent` с переданным значением `OperationInitiatorType`.
          enum:
            - '0'
            - '1'
            - '2'
            - R
            - I
            - D
            - 'N'
    TPay:
      type: object
      properties:
        Device:
          description: |
            Тип устройства:
            * `SDK` — вызов из мобильного приложения,
            * `Desktop` — вызов из браузера с десктопа,
            * `Mobile` — вызов из браузера с мобильного устройства.
          type: string
          example: Desktop
