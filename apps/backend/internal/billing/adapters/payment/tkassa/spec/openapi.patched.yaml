        - Amount
        - OrderId
        - Success
        - PaymentId
        - ErrorCode
      properties:
        TerminalKey:
          description: |
            Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
          type: string
          maxLength: 20
          example: TBankTest
        Amount:
          description: |
