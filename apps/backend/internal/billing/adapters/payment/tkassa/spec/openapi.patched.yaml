  /v2/Submit3DSAuthorization:
    post:
      operationId: Submit3DSAuthorization
      x-front:
        usage-scenario:
          - name: Прием платежей по карте на своей платежной форме
            link: /eacq/scenarios/payments/PCI_DSS/card/
          - name: Привязка карты на своей форме привязки
            link: /eacq/scenarios/payments/PCI_DSS/card/#работа-с-картами-и-покупателями
      tags:
        - Методы для работы с 3DS
      summary: Подтвердить прохождение 3DS v1.0
      description: |

        >Для мерчантов c собственной платежной формой

        Проверяет результаты прохождения 3D Secure и при успешном прохождении
        подтверждает инициированный платеж.
        При использовании:
          * одностадийной оплаты — списывает денежные средства со счета покупателя
         покупателя;
          * двухстадийной оплаты — блокирует указанную сумму на счете покупателя.


         Формат запроса — `x-www-form-urlencoded`.


        После получения ответа ACS с результатами прохождения 3D Secure на `TermUrl` нужно отправить запрос для подтверждения прохождения 3DS первой версии.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - MD
                - PaRes
              properties:
                MD:
                  description: |
                    Идентификатор платежа, который возвращается в ответе от ACS.
                  type: string
                  example: '2561504'
                PaRes:
                  description: |
                    Результат 3D Secure аутентификации, который возвращается в ответе от ACS.
                  type: string
                  example: 
                PaymentId:
                  description: |
                    Идентификатор платежа в системе Т‑Бизнес.
                  type: string
                  example: '10063'
                TerminalKey:
                  description: |
                    Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
                  type: string
                  maxLength: 20
                  example: TBankTest
                Token:
                  description: |
                    Подпись запроса. [Как сформировать](/eacq/intro/developer/token).
                  type: string
                  example: 30797e66108934dfa3d841b856fdad227c6b9c46d6a39296e02dc800d86d181e
      x-codeSamples:
        - lang: Payload
          source: |
            <body onload="document.form.submit()">
            <form name="form" action="https://rest-api-test.tinkoff.ru/v2/Submit3DSAuthorization" method="post">
              <input type="hidden" name="MD" value="2561504">
              <input type="hidden" name="PaRes" value="">
              <input type="hidden" name="PaymentId" value="10063">
              <input type="hidden" name="TerminalKey" value="TBankTest">
              <input type="hidden" name="Token" value="871199b37f207f0c4f721a37cdcc71dfcea880b4a4b85e3cf852c5dc1e99a8d6" >
            </form>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - TerminalKey
                      - OrderId
                      - Success
                      - Status
                      - PaymentId
                      - ErrorCode
                    properties:
                      TerminalKey:
                        description: |
                          Идентификатор терминала. Выдается мерчанту в Т‑Бизнес при заведении терминала.
                        type: string
                      OrderId:
                        description: |
                          Идентификатор заказа в системе мерчанта. Должен быть уникальным для каждой операции.
                        type: string
                      Success:
                        description: |
                          Успешность прохождения запроса — `true`/`false`.
                        type: boolean
                      Status:
                        description: |
                          Статус транзакции:
                          - `CONFIRMED` — при успешном сценарии и одностадийном проведении платежа;
                          - `AUTHORIZED` — при успешном сценарии и двухстадийном проведении платежа; 
                          - `REJECTED` — при неуспешном сценарии.
                        type: string
                      PaymentId:
                        description: |
                          Идентификатор платежа в системе Т‑Бизнес.
                        type: string
                      ErrorCode:
                        description: |
                          Код ошибки.
                        type: string
                        maxLength: 20
                      Message:
                        description: |
                          Краткое описание ошибки.
                        type: string
                      Details:
                        description: |
                          Подробное описание ошибки.
                        type: string
                  - $ref: '#/components/schemas/ErrorResponse'
              example:
                TerminalKey: TBankTest
                OrderId: '21050'
                Success: true
                Status: CONFIRMED
                PaymentId: '10063'
                ErrorCode: '0'
                Message: string
                Details: string
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/500'
              example:
                Success: false
                ErrorCode: '9999'
                Message: Внутренняя ошибка системы.
                Causes:
                  - Internal Service Error.
