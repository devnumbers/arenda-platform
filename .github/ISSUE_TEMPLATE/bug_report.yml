name: "🐞 Баг"
description: "Что-то сломалось или работает не так — заполни форму, это ускорит триаж"
labels: ["needs-triage"]
type: "Bug"
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "Что случилось"
      description: "Одно-два предложения: что вы делали и что сломалось"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Шаги воспроизведения"
      description: "По шагам, начиная с открытия страницы"
      placeholder: |
        1. Открыть /objects/12
        2. Нажать «Добавить арендатора»
        3. Заполнить форму и нажать «Сохранить»
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Ожидаемое поведение"
      description: "Что должно было произойти"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Фактическое поведение"
      description: "Что произошло вместо этого. Текст ошибки копируй текстом, а не только скриншотом"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Где воспроизводится"
      options:
        - "Прод"
        - "Stage"
        - "И там, и там"
        - "Локально"
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: "Как часто воспроизводится"
      description: "Если баг плавающий — это важно для поиска причины"
      options:
        - "Всегда"
        - "Часто (примерно каждый второй раз)"
        - "Иногда (1 раз из нескольких)"
        - "Редко (1 раз из многих)"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: "Браузер / устройство"
      placeholder: "Chrome 126, macOS / iPhone, Safari"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "Скриншоты / логи"
      description: "Скриншот с ошибкой лучше абзаца текста. Можно перетащить файл прямо в поле"
    validations:
      required: false
