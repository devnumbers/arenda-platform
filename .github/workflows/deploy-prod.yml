name: Deploy Prod

# Push to main: CI -> build/push/scan/sign images to GHCR -> deploy by digest.
# workflow_dispatch: deploy arbitrary digest refs (manual deploy / rollback).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_image:
        description: "Полный digest-ref (ghcr.io/devnumbers/arenda-planform-backend@sha256:...) для ручного деплоя/отката"
        required: false
        type: string
      frontend_image:
        description: "Полный digest-ref (ghcr.io/devnumbers/arenda-planform-frontend@sha256:...) для ручного деплоя/отката"
        required: false
        type: string
      admin_image:
        description: "Полный digest-ref (ghcr.io/devnumbers/arenda-planform-admin@sha256:...) для ручного деплоя/отката"
        required: false
        type: string
      landing_image:
        description: "Полный digest-ref (ghcr.io/devnumbers/arenda-planform-landing@sha256:...) для ручного деплоя/отката"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  images:
    name: Build & push ${{ matrix.service }}
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, admin, landing]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The backend image bakes the monthly DB-IP City Lite GeoIP database
      # (ticket #728); passing the month as a build-arg busts its layer cache
      # exactly once a month.
      - name: Compute DB-IP month
        if: matrix.service == 'backend'
        run: echo "DBIP_MONTH=$(date +%Y-%m)" >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/devnumbers/arenda-planform-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}
            ${{ matrix.service == 'backend' && format('DBIP_MONTH={0}', env.DBIP_MONTH) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # same pin as ci.yml
        with:
          image-ref: ghcr.io/devnumbers/arenda-planform-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      - name: Resolve and validate digest
        id: digest
        env:
          SERVICE: ${{ matrix.service }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="ghcr.io/devnumbers/arenda-planform-${SERVICE}@${BUILD_DIGEST}"
          if ! grep -qE "^ghcr\.io/devnumbers/arenda-planform-${SERVICE}@sha256:[0-9a-f]{64}$" <<<"${ref}"; then
            echo "Unexpected image digest ref: ${ref}" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "${ref}" > "${RUNNER_TEMP}/${SERVICE}.txt"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Подпись — сразу после скана и до любых артефактных шагов: упавший
      # upload не должен оставлять подписанный релиз неподписанным (находка
      # пуша 29.09: квота артефактов рвала джобу до Sign, деплой-гейт верно
      # отвергал образы «no signatures found»).
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.digest.outputs.ref }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.txt
          if-no-files-found: error
          retention-days: 7

      # SBOM of the release image (CycloneDX 1.7, vulnerabilities-free inventory:
      # OS + language packages of what actually ships) — deploy forensics "which
      # package version shipped on date X" (dependency contour, #331/#389).
      # Generated by the same pinned trivy-action as the image scan above.
      # Последний шаг джобы: его падение (например, квота артефактов) не рвёт
      # подпись и digest-цепочку выше.
      - name: Generate SBOM (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # same pin as ci.yml
        with:
          image-ref: ghcr.io/devnumbers/arenda-planform-${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx
          output: ${{ runner.temp }}/sbom-${{ matrix.service }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}
          path: ${{ runner.temp }}/sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error
          retention-days: 90

  collect:
    name: Collect image digests
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.read.outputs.backend_digest }}
      frontend_digest: ${{ steps.read.outputs.frontend_digest }}
      admin_digest: ${{ steps.read.outputs.admin_digest }}
      landing_digest: ${{ steps.read.outputs.landing_digest }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Read digests into outputs
        id: read
        run: |
          set -euo pipefail
          for svc in backend frontend admin landing; do
            file="${{ runner.temp }}/digests/${svc}.txt"
            if [ ! -s "${file}" ]; then
              echo "Missing digest file for ${svc}: ${file}" >&2
              exit 1
            fi
            ref="$(tr -d '[:space:]' < "${file}")"
            if ! grep -qE "^ghcr\.io/devnumbers/arenda-planform-${svc}@sha256:[0-9a-f]{64}$" <<<"${ref}"; then
              echo "Invalid digest ref for ${svc}: ${ref}" >&2
              exit 1
            fi
            echo "${svc}_digest=${ref}" >> "${GITHUB_OUTPUT}"
          done

  deploy:
    name: Deploy
    needs: collect
    # !cancelled() обязателен: без него GitHub скипает джобу вместе со
    # скипнутым needs (на dispatch collect скипается по design) ДО вычисления
    # выражения — ручной деплой/откат не работал ни разу (все dispatch-прогоны
    # в истории со скипнутым Deploy; находка пуша dev 29.09, фикс зеркален
    # deploy-stage.yml).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.collect.result == 'success') }}
    uses: ./.github/workflows/_deploy.yml
    # Deliberate `secrets: inherit` (triaged in #318): the reusable workflow
    # resolves environment-scoped secrets (ENV_FILE, SSH_*, GHCR_*) itself via
    # `environment:` on its deploy job. Passing them explicitly from this call
    # site would evaluate them OUTSIDE any environment context and hand the
    # callee empty strings (ADR 0024: environment values live in GitHub
    # Environments, one ENV_FILE per stage/production).
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    with:
      environment: production
      compose_env: prod
      base_url: https://rentlee.ru
      admin_url: https://admin.rentlee.ru
      backend_image: ${{ inputs.backend_image || needs.collect.outputs.backend_digest }}
      frontend_image: ${{ inputs.frontend_image || needs.collect.outputs.frontend_digest }}
      admin_image: ${{ inputs.admin_image || needs.collect.outputs.admin_digest }}
      landing_image: ${{ inputs.landing_image || needs.collect.outputs.landing_digest }}
