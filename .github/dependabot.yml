# Dependabot: security updates (default branch) + grouped weekly version
# updates targeting dev (PR flow: dev → main). Replaces the osv-scanner job
# formerly in security.yml; Go vulns are additionally covered by govulncheck
# in ci.yml.
# Every entry assigns Ivan-ee (the CI/CD owner per CODEOWNERS) so update PRs
# never sit unreviewed (dependency contour, map #326 / decision #331).
# cooldown (7 days on every entry, semgrep p/ci dependabot-missing-cooldown,
# #318): a freshly published release sits out a week before Dependabot can
# propose it, so a malicious pull-the-package attack has time to be caught.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/backend
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /apps/frontend
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/admin
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/landing
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /apps/backend
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /apps/frontend
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /apps/admin
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /apps/landing
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    assignees:
      - Ivan-ee
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
