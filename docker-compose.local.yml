name: arenda-local

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: arenda
      POSTGRES_USER: arenda
      POSTGRES_PASSWORD: arenda
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arenda -d arenda"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
