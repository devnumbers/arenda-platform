name: arenda-stage

x-env-file: &stage-env-file
  - path: .env.stage
    required: false

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=0
    logging: *default-logging
    env_file: *stage-env-file
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - arenda-stage

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    logging: *default-logging
    env_file: *stage-env-file
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:28080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - arenda-stage
      # Observability: reach uptrace:14317 (OTLP/gRPC) in docker-compose.obs.yml.
      - arenda-obs

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    logging: *default-logging
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:23000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - arenda-stage

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    ports:
      - "127.0.0.1:23002:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - arenda-stage

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_PREFIX: /api
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:23001:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - arenda-stage

networks:
  arenda-stage:
    name: arenda-stage
  # Created by docker-compose.obs.yml; start the obs stack first.
  arenda-obs:
    external: true
    name: arenda-obs

volumes:
  postgres-data:
