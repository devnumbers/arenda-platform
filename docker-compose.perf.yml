name: arenda-perf

services:
  postgres:
    image: postgres:18
    command:
      - postgres
      - -c
      - max_connections=128
      - -c
      - shared_preload_libraries=pg_stat_statements,auto_explain
      - -c
      - compute_query_id=auto
      - -c
      - track_io_timing=on
      - -c
      - pg_stat_statements.track=top
      - -c
      - auto_explain.log_min_duration=100ms
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
    environment:
      POSTGRES_USER: ${PERF_POSTGRES_USER:-arenda}
      POSTGRES_PASSWORD: ${PERF_POSTGRES_PASSWORD:-arenda}
      POSTGRES_DB: ${PERF_POSTGRES_DB:-arenda}
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-perf-data:/var/lib/postgresql
      - ./apps/backend/perf/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-perf-data:
