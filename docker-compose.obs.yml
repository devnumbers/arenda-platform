name: arenda-obs

x-env-file: &obs-env-file
  - path: .env.obs
    required: false

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.28.1
    restart: unless-stopped
    mem_limit: 3072m
    cpus: 2.00
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: uptrace
      CLICKHOUSE_USER: uptrace
      CLICKHOUSE_PASSWORD: ${UPTRACE_CH_PASSWORD}
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - arenda-obs

  uptrace-pg:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    logging: *default-logging
    environment:
      POSTGRES_USER: uptrace
      POSTGRES_PASSWORD: ${UPTRACE_PG_PASSWORD}
      POSTGRES_DB: uptrace
    volumes:
      - uptrace-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptrace -d uptrace"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - arenda-obs

  redis:
    image: redis:8.2.7-alpine
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    logging: *default-logging
    # Required by uptrace:2.0.3 (redis_cache); ephemeral cache — no ports,
    # no volumes.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - arenda-obs

  uptrace:
    image: uptrace/uptrace:2.0.3
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    logging: *default-logging
    env_file: *obs-env-file
    depends_on:
      clickhouse:
        condition: service_healthy
      uptrace-pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The image entrypoint reads /etc/uptrace/config.yml (verified
      # against the published uptrace/uptrace:2.0.3 /entrypoint.sh).
      - ./observability/uptrace.yml:/etc/uptrace/config.yml:ro
    ports:
      - "127.0.0.1:14318:14318"
    # OTLP/gRPC :14317 is intentionally NOT published: it is reachable only
    # inside the arenda-obs network (backend, vector, otelcol).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:14318/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - arenda-obs

  vector:
    image: timberio/vector:0.57.0-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging
    env_file: *obs-env-file
    depends_on:
      uptrace:
        condition: service_healthy
    # Vector >= 0.57 disables env var interpolation in the config by default
    # (the flag re-enables it so ${UPTRACE_DSN} in vector.yaml is expanded).
    command: ["--dangerously-allow-env-var-interpolation", "--config", "/etc/vector/vector.yaml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/caddy:/var/log/caddy:ro
      - /var/log/arenda:/var/log/arenda:ro
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      # Disk buffer + file checkpoints survive container recreation.
      - vector-data:/var/lib/vector
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8686/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - arenda-obs

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.156.0
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging
    env_file: *obs-env-file
    # The collector image runs as a non-root user that cannot read the host
    # docker.sock; root is the simple option (isolated network, ro socket).
    # Hardening alternative: drop `user` and set `group_add` to the host
    # docker group GID (`getent group docker`). See observability/README.md.
    user: "0"
    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
    depends_on:
      uptrace:
        condition: service_healthy
    volumes:
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro
    # No container healthcheck: the collector image is distroless (no shell,
    # no wget/curl). The health_check extension listens on localhost:13133
    # inside the container only; docker's own restart policy covers crashes.
    networks:
      - arenda-obs

networks:
  arenda-obs:
    name: arenda-obs

volumes:
  ch-data:
  uptrace-pg-data:
  vector-data:
