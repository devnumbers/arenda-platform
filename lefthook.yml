# Git hooks for this monorepo (decision: issue #294, registry: docs/agents/tooling.md).
# Setup: `make hooks-install` — installs the pinned lefthook binary when missing
# and wires .git/hooks.
# Deliberate bypass: `LEFTHOOK=0 git commit|push`, `git commit --no-verify`,
# or a personal lefthook-local.yml (gitignored).

pre-commit:
  parallel: true
  jobs:
    # Whole-repo backend lint: golangci-lint cannot take files from multiple
    # packages at once, and the warm full run (~4 s) fits the pre-commit budget.
    - name: backend lint
      glob: "**/*.go"
      run: make backend-lint
    # Nolint gate (remediation grid #325, #344): zero //nolint directives in
    # the backend, no whitelist (target state #323) — staged files only; the
    # full pass runs in CI and the Stop-gate.
    - name: backend nolint gate
      glob: "apps/backend/**/*.go"
      run: make backend-nolint FILES="{staged_files}"
    # The repo's lint script as-is (same invocation as CI): staged files act
    # only as the trigger.
    - name: frontend lint
      glob: "apps/frontend/**/*.{ts,tsx}"
      run: npm --prefix apps/frontend run lint
    - name: admin typecheck
      glob: "apps/admin/**/*.{ts,tsx}"
      run: make admin-typecheck
    # Admin ESLint gate (wave 2C, #307): dataProvider/generated/URL boundaries.
    - name: admin lint
      glob: "apps/admin/**/*.{ts,tsx}"
      run: npm --prefix apps/admin run lint
    # Landing (ADR 0063, карта #888): same shape as frontend — the package lint
    # runs whole; staged files act only as the trigger.
    - name: landing lint
      glob: "apps/landing/**/*.{ts,tsx}"
      run: npm --prefix apps/landing run lint
    # TS suppression gate (quality mode #378, gate #399): zero eslint-disable
    # comments, @ts-ignore/@ts-expect-error/@ts-nocheck and explicit `any` in
    # the manual code of the frontend/admin/landing apps — staged files only;
    # the full pass runs in CI and the Stop-gate (generated/artifacts/
    # node_modules excluded by the script itself).
    - name: ts suppressions gate
      glob: "{apps/frontend,apps/admin,apps/landing}/**/*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}"
      run: make ts-suppressions FILES="{staged_files}"
    # Migration lint (wave 3, #309): squawk (apps/backend/.squawk.toml) + domain rules
    # (money BIGINT kopecks, no DEFAULT on id) over the staged migrations only.
    - name: migrations lint
      glob: "apps/backend/db/migrations/*.sql"
      run: make migrations-lint FILES="{staged_files}"

pre-push:
  parallel: true
  jobs:
    # Verify everything + security; time is not critical here (make test
    # requires Docker and blocks the push with a clear message without it).
    - name: full test suite
      run: make test
    - name: migrations lint
      run: make migrations-lint
    - name: govulncheck
      run: make backend-vulncheck
    - name: npm audit
      run: make npm-audit
    - name: trivy fs
      run: make trivy-fs
